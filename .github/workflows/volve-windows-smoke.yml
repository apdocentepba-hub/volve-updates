name: VOLVE Windows rescue scheduler smoke
on:
  push:
    paths:
      - .github/workflows/volve-windows-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduler:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Validate Windows Task Scheduler assumptions on disposable CI runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $minuteName="VOLVE-CI-RESCUE-$PID"
          $bootName="VOLVE-CI-BOOT-$PID"
          $exe="$env:windir\System32\cmd.exe"
          try {
            & schtasks.exe /Create /TN $minuteName /SC MINUTE /MO 5 /RU SYSTEM /RL HIGHEST /TR "`"$exe`" /c exit"
            if($LASTEXITCODE -ne 0){throw '5-minute creation failed'}
            & schtasks.exe /Create /TN $bootName /SC ONSTART /DELAY 0002:00 /RU SYSTEM /RL HIGHEST /TR "`"$exe`" /c exit"
            if($LASTEXITCODE -ne 0){throw 'boot creation failed'}
            $minute=Get-ScheduledTask -TaskName $minuteName -ErrorAction Stop
            $boot=Get-ScheduledTask -TaskName $bootName -ErrorAction Stop
            $kind=[string]$minute.Triggers[0].CimClass.CimClassName
            $interval=[string]$minute.Triggers[0].Repetition.Interval
            $bootKind=[string]$boot.Triggers[0].CimClass.CimClassName
            Write-Output "minute trigger=$kind; interval=$interval; boot trigger=$bootKind"
            if($kind -ne 'MSFT_TaskTimeTrigger' -or $interval -ne 'PT5M'){throw 'minute trigger semantics differed from VOLVE assumptions'}
            if($bootKind -ne 'MSFT_TaskBootTrigger'){throw 'boot trigger semantics differed from VOLVE assumptions'}
            $adapters=@(Get-NetAdapter -ErrorAction Stop)
            Write-Output "Read-only Get-NetAdapter succeeded ($($adapters.Count) adapters)"
          } finally {
            & schtasks.exe /Delete /TN $minuteName /F 2>$null | Out-Null
            & schtasks.exe /Delete /TN $bootName /F 2>$null | Out-Null
          }
