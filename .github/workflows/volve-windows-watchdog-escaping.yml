name: VOLVE Windows watchdog escaping and repair dry run
on:
  push:
    paths:
      - .github/workflows/volve-windows-watchdog-escaping.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Reproduce doubled backslashes and verify action-only repair
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name="VOLVE-CI-WATCHDOG-$PID"
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE Recovery Test '+$PID)
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $script=Join-Path $root 'VOLVE_DNS_Watchdog_0270.ps1'
          $receipt=Join-Path $root 'receipt.txt'
          @'
          [IO.File]::WriteAllText((Join-Path $PSScriptRoot 'receipt.txt'),'SCRIPT_RAN')
          '@ | Set-Content -LiteralPath $script -Encoding ascii
          $exe=Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $wanted='-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$script+'"'
          $escaped=$script.Replace('\','\\')
          $legacy='-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$escaped+'"'
          $cmd='"'+$exe+'" '+$legacy
          try {
            & schtasks.exe /Create /TN $name /RU SYSTEM /RL HIGHEST /SC MINUTE /MO 1 /TR $cmd | Out-Null
            if($LASTEXITCODE -ne 0){throw 'Failed to create legacy task'}
            [xml]$before=(& schtasks.exe /Query /TN $name /XML | Out-String)
            $argsBefore=[string]$before.Task.Actions.Exec.Arguments
            if($argsBefore -ne $legacy){throw "Legacy task args mismatch: $argsBefore"}
            Write-Output ('OLD_ARGS=' + $argsBefore)
            $taskBefore=Get-ScheduledTask -TaskName $name -ErrorAction Stop
            $triggersBefore=@($taskBefore.Triggers).Count
            $principalBefore=[string]$taskBefore.Principal.UserId
            $action=New-ScheduledTaskAction -Execute $exe -Argument $wanted
            Set-ScheduledTask -TaskName $name -Action $action -ErrorAction Stop | Out-Null
            [xml]$after=(& schtasks.exe /Query /TN $name /XML | Out-String)
            $argsAfter=[string]$after.Task.Actions.Exec.Arguments
            if($argsAfter -ne $wanted){throw "Corrected args not exact: $argsAfter"}
            $taskAfter=Get-ScheduledTask -TaskName $name -ErrorAction Stop
            if(@($taskAfter.Triggers).Count -ne $triggersBefore){throw 'Triggers changed'}
            if([string]$taskAfter.Principal.UserId -ne $principalBefore){throw 'Principal changed'}
            Start-ScheduledTask -TaskName $name -ErrorAction Stop
            $deadline=(Get-Date).AddSeconds(25)
            while(!(Test-Path -LiteralPath $receipt) -and (Get-Date) -lt $deadline){Start-Sleep -Milliseconds 250}
            if(!(Test-Path -LiteralPath $receipt)){throw 'Corrected task did not execute'}
            if([IO.File]::ReadAllText($receipt) -ne 'SCRIPT_RAN'){throw 'Wrong result from task'}
            Write-Output ('NEW_ARGS=' + $argsAfter)
            Write-Output 'PASS: action corrected, triggers and SYSTEM principal retained, script executed.'
            Write-Output 'NO DNS adapter or resolver was modified.'
          } finally {
            & schtasks.exe /Delete /TN $name /F 2>$null | Out-Null
            Remove-Item -LiteralPath $root -Force -Recurse -ErrorAction SilentlyContinue
          }
