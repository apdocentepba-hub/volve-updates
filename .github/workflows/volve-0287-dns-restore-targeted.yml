name: VOLVE targeted DNS restoration regression (NO INSTALL NO RELEASE)
on:
  push:
    branches: [work/0287-dns-restore-regression-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restoration-regression:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Reconstruct hash-pinned VOLVE source; never publish a motor
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, zipfile, shutil
          from pathlib import Path
          root=Path("development/0.28.7")
          parts=sorted((root/"complete-source-parts").glob("part-*.bin"))
          assert [p.name for p in parts]==[f"part-{i:02d}.bin" for i in range(10)]
          data=b"".join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=="92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5"
          Path("source.zip").write_bytes(data)
          Path("build").mkdir(exist_ok=True)
          with zipfile.ZipFile("source.zip") as z:z.extractall("build")
          for name,sha in [
            ("VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip","fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd"),
            ("VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip","773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40"),
          ]:
            p=root/name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
            with zipfile.ZipFile(p) as z:z.extractall("build")
          for p in (root/"journal").glob("*.go"):
            shutil.copy2(p,Path("build/codigo/motorupdate")/p.name)
          PY
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
      - name: Execute five in-memory regressions only
        shell: powershell
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'Hosted CI only'}
          # Both restoration implementations must execute their in-memory
          # regressions before the VM starts. A compiled or skipped test
          # alone cannot count as evidence of restored DNS.
          $restoreTests=@('TestVOLVEDNSRollbackRejectsLaterFamilyDrift','TestVOLVEDNSRollbackRejectsMissingContext','TestNativeDNSRecoveryRestoresStaticIPv4AndAutomaticIPv6ThroughPinnedWriter','TestNativeDNSRecoveryResumesAfterAutomaticDriverFailedPostMutation','TestNativeDNSRecoveryBatchRejectsDriftAfterLaterFamilyWrite')
          $restoreRegex='^('+($restoreTests -join '|')+')$'
          $restoreListed=@(go test ./motorupdate -list $restoreRegex)
          if($LASTEXITCODE -ne 0){throw 'DNS restoration test census failed'}
          foreach($required in $restoreTests){if($restoreListed -cnotcontains $required){throw ('Required DNS restoration test missing: '+$required)}}
          $restoreEvents=@(go test ./motorupdate -run $restoreRegex -count=1 -timeout 2m -json)
          if($LASTEXITCODE -ne 0){$restoreEvents | Write-Host;throw 'DNS restoration regression failed; refuse guest trial'}
          $restorePassed=@(foreach($line in $restoreEvents){
            $event=ConvertFrom-Json -InputObject $line
            if($event.Action -ceq 'pass' -and $event.PSObject.Properties['Test']){[string]$event.Test}
          })
          foreach($required in $restoreTests){if(@($restorePassed | Where-Object {$_ -ceq $required}).Count -ne 1){throw ('DNS restoration test did not execute and pass exactly once: '+$required)}}
          Write-Host ('PASS: '+$restoreTests.Count+' required in-memory DNS restoration regressions; NO NATIVE DNS WRITES')
