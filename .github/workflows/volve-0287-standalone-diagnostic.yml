name: VOLVE 0.28.7 standalone READ ONLY Windows diagnostic artifact (NO RELEASE)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/auditcmd/**'
      - 'development/0.28.7/inapp/motor_install_route.go'
      - 'development/0.28.7/inapp/motor_install_route_windows.go'
      - 'development/0.28.7/inapp/apply_overlay.go'
      - '.github/workflows/volve-0287-standalone-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-readonly-audit:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Rebuild original source with pinned hashes; no production deployment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=@(Get-ChildItem 'development/0.28.7/complete-source-parts' -Filter 'part-*.bin' -File | Sort-Object Name)
          if($parts.Count -ne 10){throw 'Source chunks missing'}
          $zip=[IO.File]::Create((Join-Path (Get-Location) 'source.zip'))
          try{
            for($i=0;$i -lt 10;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Unexpected source chunk name'}
              $source=[IO.File]::OpenRead($parts[$i].FullName)
              try{$source.CopyTo($zip)}finally{$source.Dispose()}
            }
          }finally{$zip.Dispose()}
          if((Get-FileHash -Algorithm SHA256 source.zip).Hash.ToLowerInvariant() -ne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw 'Original source integrity mismatch'}
          New-Item -ItemType Directory build -Force | Out-Null
          Expand-Archive -LiteralPath source.zip -DestinationPath build -Force
          $overlay='development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip'
          if((Get-FileHash -Algorithm SHA256 $overlay).Hash.ToLowerInvariant() -ne 'fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'){throw 'Preflight overlay altered'}
          Expand-Archive -LiteralPath $overlay -DestinationPath build -Force
          Copy-Item 'development/0.28.7/journal/*.go' build/codigo/motorupdate/ -Force
          $crash='development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip'
          if((Get-FileHash -Algorithm SHA256 $crash).Hash.ToLowerInvariant() -ne '773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'){throw 'Recovery overlay altered'}
          Expand-Archive -LiteralPath $crash -DestinationPath build -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Real Go source overlay failed'}
      - name: Confirm original Centro root and prepare isolated read-only tool
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content -LiteralPath 'build/codigo/main_windows.go' -Raw
          $folderMatch=[regex]::Matches($src,'(?m)^\s*const\s+stateDirName\s*=\s*"([A-Za-z0-9_.-]+)"\s*$')
          if($folderMatch.Count -ne 1){throw 'Original Centro state directory name not uniquely verified'}
          $folder=$folderMatch[0].Groups[1].Value
          if($folder -ne 'VOLVE-Browser-Filter'){throw 'Installed root does not match audited 0.28.6 source; rebuild required'}
          if(-not $src.Contains('return filepath.Join(base, stateDirName, "estado.json"), nil')){
            throw 'Original Centro statePath no longer matches hardened read-only root resolver'
          }
          New-Item -ItemType Directory 'build/codigo/cmd/volve-readonly-audit' -Force|Out-Null
          Copy-Item 'development/0.28.7/auditcmd/*.go' 'build/codigo/cmd/volve-readonly-audit/' -Force
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'VOLVE_CI_INSTALLED_FOLDER.txt') -Value $folder -NoNewline
          Write-Host 'PASS: original installed-root source matched. Standalone diagnostic does not link updater or privileged task switch entrypoint.'
      - name: Compile/test standalone 64-bit Windows diagnostic and verify no-mutation contract
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          go test ./cmd/volve-readonly-audit -count=1 -timeout 5m -v
          if($LASTEXITCODE -ne 0){throw 'Standalone read-only diagnostic tests failed'}
          go test ./motorupdate -count=1 -timeout 6m -run '^(TestMotorRoute|TestWindowsMotorRoute)' 
          if($LASTEXITCODE -ne 0){throw 'Core host classification regressions failed'}
          $folder=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'VOLVE_CI_INSTALLED_FOLDER.txt') -Raw
          $dist=Join-Path (Get-Location) 'dist'
          New-Item -ItemType Directory $dist -Force|Out-Null
          $exe=Join-Path $dist 'VOLVE_Diagnostico_0_28_7_Solo_Lectura.exe'
          go build -trimpath -ldflags "-X main.stateDirName=$folder" -o $exe ./cmd/volve-readonly-audit
          if($LASTEXITCODE -ne 0){throw 'Standalone EXE compile failed'}
          $meta=go version -m $exe
          if($LASTEXITCODE -ne 0){throw 'Go build metadata absent'}
          Copy-Item '../../development/0.28.7/auditcmd/VOLVE_Diagnostico_Solo_Lectura.cmd' $dist
          Copy-Item '../../development/0.28.7/auditcmd/LEEME_DIAGNOSTICO.txt' $dist
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $dist 'SHA256_EXE.txt') -Value ('SHA256 '+$hash+'  VOLVE_Diagnostico_0_28_7_Solo_Lectura.exe')
          Write-Host ('STANDALONE EXE SHA256: '+$hash)
          Write-Host ('STANDALONE EXE BYTES: '+(Get-Item $exe).Length)
          Write-Host 'PASS: Go executable packaged with read-only entrypoint; NO DNS, tasks, UAC bypass or production release changed.'
      - uses: actions/upload-artifact@v4
        with:
          name: VOLVE_0287_Diagnostico_Windows_SoloLectura_LAB
          path: build/codigo/dist/*
          if-no-files-found: error
          retention-days: 7
