name: VOLVE pilot fresh motor SYSTEM DNS53 (DISPOSABLE VM ONLY)
on:
  push:
    branches: [feature/motor-updater-0287-pilot, work/0287-native-setup-preview-20261113, work/0287-installer-progress-20261124, work/0287-activation-order-regression-20261127]
    paths:
      - 'development/0.28.7/inapp/ci_fresh_dns53_windows.go'
      - 'development/0.28.7/inapp/ci_fresh_dns53_windows_test.go'
      - 'development/0.28.7/inapp/dns_restore_system_real_windows_test.go'
      - 'development/0.28.7/inapp/dns_restore_watchdog_crash_windows_test.go'
      - 'development/0.28.7/inapp/fresh_activation_admission.go'
      - 'development/0.28.7/inapp/fresh_activation_reservation_windows.go'
      - 'development/0.28.7/inapp/fresh_recovery_permit_windows.go'
      - 'development/0.28.7/installer-wizard/test_ci_isolated_system_dns_recovery.ps1'
      - 'development/0.28.7/inapp/apply_overlay.go'
      - '.github/workflows/volve-0287-fresh-system-dns53.yml'
  pull_request:
    branches: [work/0287-dns-cname-chain-guard-20261113]
    paths:
      - 'development/0.28.7/inapp/ci_fresh_dns53_windows.go'
      - 'development/0.28.7/inapp/ci_fresh_dns53_windows_test.go'
      - 'development/0.28.7/inapp/dns_restore_system_real_windows_test.go'
      - 'development/0.28.7/inapp/dns_restore_watchdog_crash_windows_test.go'
      - 'development/0.28.7/inapp/fresh_activation_admission.go'
      - 'development/0.28.7/inapp/fresh_activation_reservation_windows.go'
      - 'development/0.28.7/inapp/fresh_recovery_permit_windows.go'
      - 'development/0.28.7/installer-wizard/test_ci_isolated_system_dns_recovery.ps1'
      - 'development/0.28.7/inapp/apply_overlay.go'
      - '.github/workflows/volve-0287-fresh-system-dns53.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volve-ci-fresh-resident53-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fresh-system-dns53:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Parse every VOLVE Go overlay before expensive CI build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $all=@(Get-ChildItem 'development/0.28.7/inapp' -Filter '*.go' -File)
          if($all.Count -lt 40){throw 'VOLVE Go overlay inventory unexpectedly incomplete'}
          foreach($file in $all){
            & gofmt -e -d $file.FullName *> $null
            if($LASTEXITCODE -ne 0){throw ('Invalid Go syntax in overlay: '+$file.Name)}
          }
          Write-Host ('PASS: parsed '+$all.Count+' Go overlay files before source reconstruction')
      - name: Reconstruct and verify full VOLVE Go source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=@(Get-ChildItem 'development/0.28.7/complete-source-parts' -Filter 'part-*.bin' | Sort-Object Name)
          if($parts.Count -ne 10){throw 'Source archive part count'}
          $dest=[IO.File]::Create((Join-Path (Get-Location) 'source.zip'))
          try {
            for($i=0;$i -lt 10;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Source archive order'}
              $src=[IO.File]::OpenRead($parts[$i].FullName)
              try{$src.CopyTo($dest)}finally{$src.Dispose()}
            }
          }finally{$dest.Dispose()}
          if((Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw 'Source SHA256 mismatch'}
          Expand-Archive source.zip -DestinationPath build -Force
          $old='development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip'
          if((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'){throw 'Preflight ZIP SHA256 mismatch'}
          Expand-Archive $old -DestinationPath build -Force
          $recovery='development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip'
          if((Get-FileHash $recovery -Algorithm SHA256).Hash.ToLowerInvariant() -ne '773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'){throw 'Recovery ZIP SHA256 mismatch'}
          Expand-Archive $recovery -DestinationPath build -Force
          Copy-Item development/0.28.7/journal/*.go build/codigo/motorupdate/ -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Source overlay failed'}
      - name: Compile CI-tagged actual VOLVE motor and test safe preflight
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          go test ./motorupdate -run '^TestFreshMotor' -count=1 -v
          if($LASTEXITCODE -ne 0){throw 'Fresh motor gates failed'}
          go test ./motorupdate -run '^(TestProtectedDNSActivation|TestWindowsPinnedDNSActivation|TestWindowsProtectedDNSActivationLease|TestPublisherSignedDNSActivation|TestPublisherScopedDNSActivation|TestWindowsNativeSignedDNSActivationNonce|TestWindowsSignedDNSActivationNonceAndRecoveryShareOneRealKernelLease|TestNativeDNSRecovery)' -count=1 -timeout 5m -v
          if($LASTEXITCODE -ne 0){throw 'Protected dual-stack activation and independent recovery transaction failed'}
          # Require the same corrected policy/adapter transition in the source
          # used to compile the actual CI-only SYSTEM DNS motor.
          $order=@(go test ./motorupdate -run '^TestWindows(ActivationPolicyDriftInsideAttestationPreventsCommit|DNSActivationOverrideGuardRejectsDriftWithoutSuppressingRecovery|DNSOverride(Census(StrictEvidence|NativeReadOnly)|FingerprintSyntheticContent))$' -count=1 -timeout 2m -v)
          $orderExit=$LASTEXITCODE
          $order|Write-Host
          if($orderExit -ne 0){throw 'Policy activation transition refused; do not compile real motor'}
          foreach($marker in @('PASS VOLVE_DNS_POLICY_DRIFT_DURING_ATTESTATION_TRANSACTION_RECOVERY','PASS VOLVE_DNS_ACTIVATION_POLICY_GUARD_REJECTS_DRIFT_PRESERVES_RECOVERY','PASS VOLVE_NATIVE_DNS_OVERRIDE_CENSUS_COUNTS_ONLY_NO_INSTALL','PASS VOLVE_DNS_OVERRIDE_FINGERPRINT_SYNTHETIC_CONTENT_DRIFT')){
            if(@($order|Where-Object {$_ -match ([regex]::Escape($marker)+'$')}).Count -ne 1){throw ('Missing activation proof '+$marker)}
          }
          # Real NTFS ACL + Win32 mutex + multiple independent opens cost seconds each.
          # This is a separate integration suite: retain all assertions, avoid a
          # misleading combined 5-minute Go timeout on healthy Windows runners.
          go test ./motorupdate -run '^TestSignedWindowsDNSBoot' -count=1 -timeout 7m -v
          if($LASTEXITCODE -ne 0){throw 'Signed Windows boot DNS recovery integration failed'}
          $receiptProof=@(go test -tags volveci . -run '^TestCIFreshStartupDiagnosticExactBytes$' -count=1 -v -timeout 1m)
          $receiptExit=$LASTEXITCODE
          $receiptProof|Write-Host
          if($receiptExit -ne 0 -or @($receiptProof|Where-Object {$_ -match 'PASS VOLVE_CI_STARTUP_DIAGNOSTIC_EXACT_LF_CREATE_ONLY$'}).Count -ne 1){throw 'CI diagnostic byte contract failed'}
          go build -tags volveci -trimpath -o "$env:RUNNER_TEMP\VOLVE_CI_FreshDNS53.exe" .
          if($LASTEXITCODE -ne 0){throw 'Real motor executable compilation failed'}
          $binary=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_FreshDNS53.exe'
          if(-not (Test-Path -LiteralPath $binary -PathType Leaf)){throw 'CI motor executable missing'}
          Get-FileHash $binary -Algorithm SHA256 | Format-List
      - name: Stage signed CI motor through NSIS before SYSTEM task startup
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:GITHUB_RUN_ID -cnotmatch '^[0-9]{6,20}$'){throw 'Hosted CI only'}
          $vm=Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          if(($vm.Manufacturer+' '+$vm.Model) -notmatch '(?i:virtual machine|hyper-v|vmware|kvm|qemu|virtualbox)'){throw 'Not disposable VM'}
          $principal=[Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if(!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'Elevated lab required'}
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-SYSTEM-Handoff-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'Handoff path collision'}
          New-Item -ItemType Directory -Path $root -ErrorAction Stop|Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VOLVE_CI_HANDOFF_ROOT=$root"
          $icacls=Join-Path $env:SystemRoot 'System32\icacls.exe'
          & $icacls $root /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' /q
          if($LASTEXITCODE -ne 0){throw 'Protected handoff directory ACL failed'}
          & $icacls $root /setowner '*S-1-5-32-544' /q
          if($LASTEXITCODE -ne 0){throw 'Protected handoff directory ownership failed'}
          function Assert-VolvCIHandoffACL([string]$path){
            $item=Get-Item -LiteralPath $path -Force -ErrorAction Stop
            if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Handoff path is a reparse point'}
            $acl=Get-Acl -LiteralPath $path -ErrorAction Stop
            $owner=$acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
            if($owner -cnotin @('S-1-5-18','S-1-5-32-544')){throw 'Unexpected handoff owner'}
            $rules=@($acl.GetAccessRules($true,$true,[Security.Principal.SecurityIdentifier]))
            foreach($rule in $rules){
              if($rule.IdentityReference.Value -cnotin @('S-1-5-18','S-1-5-32-544') -or $rule.AccessControlType -ne 'Allow'){throw 'Unexpected handoff ACL principal'}
            }
            foreach($sid in @('S-1-5-18','S-1-5-32-544')){
              if(!@($rules|Where-Object {$_.IdentityReference.Value -ceq $sid -and ($_.FileSystemRights -band [Security.AccessControl.FileSystemRights]::FullControl) -eq [Security.AccessControl.FileSystemRights]::FullControl}).Count){throw 'Missing protected principal full control'}
            }
          }
          Assert-VolvCIHandoffACL $root
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=VOLVE CI SYSTEM HANDOFF ONLY' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 2048 -Provider 'Microsoft Software Key Storage Provider' -NotAfter (Get-Date).AddDays(2)
          if(!$cert.HasPrivateKey){throw 'Ephemeral lab certificate missing'}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VOLVE_CI_HANDOFF_THUMB=$($cert.Thumbprint)"
          $der=Join-Path $root 'test-public.cer'
          [IO.File]::WriteAllBytes($der,$cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $certutil=Join-Path $env:SystemRoot 'System32\certutil.exe'
          foreach($store in @('Root','TrustedPublisher')){
            & $certutil -f -addstore $store $der
            if($LASTEXITCODE -ne 0){throw 'Disposable CI signer trust failed'}
          }
          $unsignedMotor=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_FreshDNS53.exe'
          $signed=Join-Path $root 'signed-input.exe'
          Copy-Item -LiteralPath $unsignedMotor -Destination $signed -ErrorAction Stop
          $null=Set-AuthenticodeSignature -FilePath $signed -Certificate $cert -HashAlgorithm SHA256 -IncludeChain All
          $sig=Get-AuthenticodeSignature -LiteralPath $signed
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Thumbprint -cne $cert.Thumbprint){throw 'CI motor signing failed'}
          $pin=(Get-FileHash -LiteralPath $signed -Algorithm SHA256).Hash
          $compiler=@('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')|Where-Object {Test-Path -LiteralPath $_ -PathType Leaf}|Select-Object -First 1
          if(!$compiler){
            choco install nsis --yes --no-progress --limit-output --execution-timeout=90
            if($LASTEXITCODE -ne 0){throw 'NSIS provisioning failed'}
            $compiler=@('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')|Where-Object {Test-Path -LiteralPath $_ -PathType Leaf}|Select-Object -First 1
          }
          if(!$compiler -or $root -match '["$]'){throw 'Unsafe or unavailable NSIS path'}
          $stage=Join-Path $root 'stage'
          $nsi=@'
          Unicode true
          Name "VOLVE CI handoff - NO INSTALL"
          OutFile "handoff.exe"
          RequestExecutionLevel user
          SilentInstall silent
          Section
            SetOutPath "__STAGE__"
            File /oname=VOLVE_CI_FreshDNS53.exe "__SIGNED__"
          SectionEnd
          '@
          $nsi=$nsi.Replace('__STAGE__',$stage).Replace('__SIGNED__',$signed)
          [IO.File]::WriteAllText((Join-Path $root 'handoff.nsi'),$nsi,[Text.UTF8Encoding]::new($true))
          Push-Location $root
          try{
            & $compiler '/V3' 'handoff.nsi'
            if($LASTEXITCODE -ne 0){throw 'NSIS handoff compilation failed'}
          }finally{Pop-Location}
          $proc=Start-Process -FilePath (Join-Path $root 'handoff.exe') -ArgumentList '/S' -PassThru -ErrorAction Stop
          try{
            if(!$proc.WaitForExit(60000)){throw 'NSIS handoff timeout'}
            if($proc.ExitCode -ne 0){throw 'NSIS handoff refused'}
          }finally{if(!$proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction Stop};$proc.Dispose()}
          $exe=Join-Path $stage 'VOLVE_CI_FreshDNS53.exe'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf) -or @(Get-ChildItem -LiteralPath $stage -Force).Count -ne 1){throw 'Unexpected NSIS staged contents'}
          foreach($p in @($stage,$exe)){
            & $icacls $p /setowner '*S-1-5-32-544' /q
            if($LASTEXITCODE -ne 0){throw 'Handoff node ownership failed'}
            Assert-VolvCIHandoffACL $p
          }
          $verified=Get-AuthenticodeSignature -LiteralPath $exe
          if($verified.Status -ne 'Valid' -or $verified.SignerCertificate.Thumbprint -cne $cert.Thumbprint -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -cne $pin){throw 'Extracted motor differs from signed original'}
          Remove-Item -LiteralPath $unsignedMotor,$signed -Force -ErrorAction Stop
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VOLVE_CI_HANDOFF_EXE=$exe"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VOLVE_CI_HANDOFF_SHA=$pin"
          Write-Host 'PASS VOLVE_NSIS_EXTRACTED_SIGNED_CI_MOTOR_READY_FOR_SYSTEM NO_INSTALL'
      - name: Start real VOLVE DNS53 motor under Windows SYSTEM and query from separate process
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Not a disposable GitHub hosted runner'}
          $vm=Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          if(($vm.Manufacturer+' '+$vm.Model) -notmatch '(?i:virtual machine|vmware|kvm|hyper-v|qemu|virtualbox)'){throw 'Not a verified virtual machine'}
          if(Get-ScheduledTask -TaskName 'VOLVE-DNS-SERVER-0270' -ErrorAction SilentlyContinue){throw 'Production task present'}
          if(Get-ScheduledTask -TaskName 'VOLVE-DNS-RESCUE-0270' -ErrorAction SilentlyContinue){throw 'Production recovery task present'}
          $base=(Get-DnsClientServerAddress | Sort-Object InterfaceIndex,AddressFamily | Select-Object InterfaceIndex,AddressFamily,ServerAddresses | ConvertTo-Json -Compress -Depth 6)
          $hosts=(Get-FileHash -Algorithm SHA256 -LiteralPath "$env:WINDIR\System32\drivers\etc\hosts").Hash
          $occupied=@(Get-NetUDPEndpoint -LocalPort 53 -ErrorAction SilentlyContinue)+@(Get-NetTCPConnection -LocalPort 53 -State Listen -ErrorAction SilentlyContinue)
          $conflicts=@($occupied|Where-Object {$_.LocalAddress -in @('0.0.0.0','::','127.0.0.1','::1')})
          if($conflicts.Count){$conflicts|Select-Object LocalAddress,LocalPort,OwningProcess|Format-Table|Out-String|Write-Host;throw 'Existing loopback/wildcard DNS listener; no changes'}
          Write-Host ('DNS53 preflight: unrelated-interface listeners='+$occupied.Count)
          $task='VOLVE-CI-FreshMotor-'+$env:GITHUB_RUN_ID
          if($task -notmatch '^VOLVE-CI-FreshMotor-[0-9]{6,20}$'){throw 'Unexpected disposable task name'}
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-FreshDNS53-'+$env:GITHUB_RUN_ID)
          $exe=$env:VOLVE_CI_HANDOFF_EXE
          function Assert-ExtractedMotor {
            if(!$exe -or $exe -cne (Join-Path $env:VOLVE_CI_HANDOFF_ROOT 'stage\VOLVE_CI_FreshDNS53.exe')){throw 'Unexpected motor handoff path'}
            $sig=Get-AuthenticodeSignature -LiteralPath $exe -ErrorAction Stop
            if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Thumbprint -cne $env:VOLVE_CI_HANDOFF_THUMB -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -cne $env:VOLVE_CI_HANDOFF_SHA){throw 'Extracted motor signature or hash changed'}
          }
          Assert-ExtractedMotor
          if(Test-Path -LiteralPath $root){throw 'CI root already exists'}
          # Existing VM-only extended service window, bounded again by Scheduler.
          $argument='--ci-boot-dns53 "'+$root+'" VOLVE-CI-GITHUB-HOSTED-VM-DNS53-ONLY'
          $registered=$false
          function Write-VolvStartupFailure {
            $receipt=Join-Path $root 'ci-startup-failure.txt'
            if(!(Test-Path -LiteralPath $receipt -PathType Leaf)){Write-Host 'VOLVE_SYSTEM_STARTUP_DIAGNOSTIC=missing';return}
            $item=Get-Item -LiteralPath $receipt -Force
            if(($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $item.Length -gt 160){throw 'Invalid CI startup diagnostic node'}
            $line=(Get-Content -LiteralPath $receipt -Raw).Trim()
            if($line -cnotmatch '^stage=(root-inspect|catalog-create|catalog-verify|upstream-tcp-bind|upstream-udp-bind|production-service|production-catalog|production-ipv4-start|production-ipv6-start|production-ipv4-timeout|production-ipv6-timeout|service-deadline|unknown);win32=[0-9]{1,10}$'){throw 'Invalid CI startup diagnostic'}
            Write-Host ('VOLVE_SYSTEM_STARTUP_DIAGNOSTIC='+$line)
          }
          try{
            $action=New-ScheduledTaskAction -Execute $exe -Argument $argument
            $trigger=New-ScheduledTaskTrigger -AtStartup
            $settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 9) -AllowStartIfOnBatteries
            Register-ScheduledTask -TaskName $task -Action $action -Trigger $trigger -Settings $settings -User 'SYSTEM' -RunLevel Highest -ErrorAction Stop | Out-Null
            $registered=$true
            $record=Get-ScheduledTask -TaskName $task -ErrorAction Stop
            if($record.Principal.UserId -notin @('SYSTEM','S-1-5-18') -or @($record.Actions).Count -ne 1 -or [string]$record.Actions[0].Execute -ine $exe){throw 'Task does not match expected SYSTEM binary'}
            $taskXML=Export-ScheduledTask -TaskName $task -ErrorAction Stop
            $taskDocument=[xml]$taskXML
            if(@($taskDocument.SelectNodes("//*[local-name()='BootTrigger']")).Count -ne 1){throw 'SYSTEM motor has no startup trigger'}
            Assert-ExtractedMotor
            Start-ScheduledTask -TaskName $task -ErrorAction Stop
            $deadline=(Get-Date).AddSeconds(25)
            do{
              Start-Sleep -Milliseconds 500
              $all=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction Stop)
              $matched=@($all | Where-Object { [string]$_.ExecutablePath -ieq $exe })
            }until($matched.Count -eq 1 -or (Get-Date) -ge $deadline)
            if($matched.Count -ne 1){throw 'Single real resident process was not started'}
            $owner=Invoke-CimMethod -InputObject $matched[0] -MethodName GetOwnerSid -ErrorAction Stop
            if($owner.ReturnValue -ne 0 -or $owner.Sid -ne 'S-1-5-18'){throw 'DNS service owner is not SYSTEM'}
            # Process creation alone is not a readiness receipt. Require all
            # four bound loopback sockets to belong to the exact same process.
            $ready=$false
            $readyDeadline=(Get-Date).AddSeconds(35)
            do {
              $running=Get-CimInstance Win32_Process -Filter ('ProcessId='+$matched[0].ProcessId) -ErrorAction SilentlyContinue
              $state=Get-ScheduledTask -TaskName $task -ErrorAction Stop
              $info=Get-ScheduledTaskInfo -TaskName $task -ErrorAction Stop
              $ownedTCP=@(Get-NetTCPConnection -LocalPort 53 -State Listen -ErrorAction SilentlyContinue|Where-Object {$_.OwningProcess -eq $matched[0].ProcessId})
              $ownedUDP=@(Get-NetUDPEndpoint -LocalPort 53 -ErrorAction SilentlyContinue|Where-Object {$_.OwningProcess -eq $matched[0].ProcessId})
              $ready=($null -ne $running -and $running.ExecutablePath -ieq $exe -and $ownedTCP.Count -eq 2 -and $ownedUDP.Count -eq 2 -and @($ownedTCP|Where-Object {$_.LocalAddress -in @('127.0.0.1','::1')}).Count -eq 2 -and @($ownedUDP|Where-Object {$_.LocalAddress -in @('127.0.0.1','::1')}).Count -eq 2)
              if($ready){break}
              if(!$running -or $state.State -ne 'Running'){break}
              Start-Sleep -Milliseconds 400
            }until((Get-Date) -ge $readyDeadline)
            Write-Host ('VOLVE_SYSTEM_READY='+([ordered]@{ready=$ready;process_alive=($null -ne $running);task_state=[string]$state.State;last_task_result=$info.LastTaskResult;tcp=$ownedTCP.Count;udp=$ownedUDP.Count}|ConvertTo-Json -Compress))
            if(!$ready){throw 'SYSTEM motor did not establish four verified loopback listeners; no release'}
            $env:VOLVE_CI_FRESH_DNS53_PROBE='GITHUB-HOSTED-VM-ONLY'
            $env:VOLVE_CI_TCP_REUSE_PROBE='OWNED_SYSTEM_LOOPBACK_ONLY'
            $firstProof=@(go test . -run '^TestCI(FreshResidentSYSTEMPort53|ResidentTCPConnectionReuse)$' -count=1 -timeout 1m -v)
            $firstExit=$LASTEXITCODE
            $firstProof | Write-Host
            if($firstExit -ne 0){throw 'External real DNS53 blocking or TCP reuse verification failed'}
            $reuse=@($firstProof|Where-Object {$_ -match 'PASS VOLVE_TCP_REUSE_QUERY address=(127\.0\.0\.1|::1) sequence=[12]$'})
            if($reuse.Count -ne 4 -or @($firstProof|Where-Object {$_ -match '^--- PASS: TestCIResidentTCPConnectionReuse '}).Count -ne 1){throw 'Missing four independent TCP reuse responses'}
            Write-Host 'PASS: actual SYSTEM motor TCP reuse on both address families, two unique queries per connection; NO ADAPTER WRITES'
            if(@($firstProof | Where-Object {$_ -match 'actually forwards an allowed A record'}).Count -ne 1){
              throw 'DNS53 PASS without verified usable allowed-domain A answer'
            }
            foreach($endpoint in @('127.0.0.1','::1')){
              $bound=@(Get-NetUDPEndpoint -LocalPort 53 -LocalAddress $endpoint -ErrorAction Stop)
              if($bound.Count -ne 1 -or $bound[0].OwningProcess -ne $matched[0].ProcessId){throw 'Port 53 is not owned exclusively by verified SYSTEM motor'}
            }
            Write-Host 'PASS VOLVE_NSIS_EXTRACTED_SIGNED_MOTOR_SYSTEM_DUAL_STACK_VERIFIED NO_ADAPTER_WRITES'
            Write-Host 'PASS: real compiled VOLVE runs under SYSTEM and serves dual-stack DNS/53; BetWarrior and stake.com blocked; example.org forwarded'
            # Verify that the SAME persistent startup task can stop and restart
            # without an installer re-creating it or mutating network settings.
            Stop-ScheduledTask -TaskName $task -ErrorAction Stop
            $stopDeadline=(Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 400
              $leftProcesses=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction SilentlyContinue | Where-Object {[string]$_.ExecutablePath -ieq $exe})
            }until($leftProcesses.Count -eq 0 -or (Get-Date) -ge $stopDeadline)
            if($leftProcesses.Count -ne 0){throw 'DNS motor did not stop before controlled restart'}
            $savedTask=Get-ScheduledTask -TaskName $task -ErrorAction Stop
            if($savedTask.Principal.UserId -notin @('SYSTEM','S-1-5-18') -or @($savedTask.Triggers).Count -ne 1){throw 'Installed startup task changed unexpectedly'}
            Assert-ExtractedMotor
            Start-ScheduledTask -TaskName $task -ErrorAction Stop
            $restartProof=@(go test . -run '^TestCIFreshResidentSYSTEMPort53$' -count=1 -timeout 1m -v)
            $restartExit=$LASTEXITCODE
            $restartProof | Write-Host
            if($restartExit -ne 0){throw 'Real DNS/53 failed after restarting same registered SYSTEM task'}
            if(@($restartProof | Where-Object {$_ -match 'actually forwards an allowed A record'}).Count -ne 1){
              throw 'Restarted DNS53 PASS without a verified allowed A record'
            }
            Write-Host 'PASS: persistent AtStartup SYSTEM task restarted with exact original 400k catalog and DNS blocking still works'
            # Record the exact restarted resident before the independent
            # recovery experiment. Never treat a replacement PID as survival.
            function Get-VolvResidentIdentity {
              $live=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction Stop|Where-Object {$_.ExecutablePath -ieq $exe})
              if($live.Count -ne 1){throw 'Expected exactly one extracted resident'}
              $process=$live[0]
              $owner=Invoke-CimMethod -InputObject $process -MethodName GetOwnerSid -ErrorAction Stop
              if($owner.ReturnValue -ne 0 -or $owner.Sid -ne 'S-1-5-18'){throw 'Resident is not SYSTEM'}
              $t=Get-ScheduledTask -TaskName $task -ErrorAction Stop
              if($t.State -ne 'Running' -or $t.Principal.UserId -notin @('SYSTEM','S-1-5-18') -or @($t.Actions).Count -ne 1 -or [string]$t.Actions[0].Execute -ine $exe -or [string]$t.Actions[0].Arguments -cne $argument){throw 'Resident task identity changed'}
              foreach($address in @('127.0.0.1','::1')){
                $tcp=@(Get-NetTCPConnection -LocalPort 53 -LocalAddress $address -State Listen -ErrorAction Stop)
                $udp=@(Get-NetUDPEndpoint -LocalPort 53 -LocalAddress $address -ErrorAction Stop)
                if($tcp.Count -ne 1 -or $udp.Count -ne 1 -or $tcp[0].OwningProcess -ne $process.ProcessId -or $udp[0].OwningProcess -ne $process.ProcessId){throw 'Resident does not own four DNS53 endpoints'}
              }
              Assert-ExtractedMotor
              return ('{0}|{1:o}' -f $process.ProcessId,[datetime]$process.CreationDate)
            }
            $beforeRecovery=Get-VolvResidentIdentity
            $recoveryScript=Join-Path $env:GITHUB_WORKSPACE 'development/0.28.7/installer-wizard/test_ci_isolated_system_dns_recovery.ps1'
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($recoveryScript,[ref]$tokens,[ref]$errors)|Out-Null
            if(@($errors).Count -ne 0){throw 'Recovery script syntax invalid'}
            & $recoveryScript
            Write-Host 'PASS VOLVE_ISOLATED_RECOVERY_SCOPE_EXACT_GUID_NO_PRODUCTION_CENSUS_CHANGE'
            $afterRecovery=Get-VolvResidentIdentity
            if($beforeRecovery -cne $afterRecovery){throw 'Resident replaced during independent crash restoration'}
            $afterProof=@(go test . -run '^TestCIFreshResidentSYSTEMPort53$' -count=1 -timeout 1m -v)
            $afterExit=$LASTEXITCODE
            $afterProof|Write-Host
            if($afterExit -ne 0 -or @($afterProof|Where-Object {$_ -match '^--- PASS: TestCIFreshResidentSYSTEMPort53 '}).Count -ne 1 -or @($afterProof|Where-Object {$_ -match 'actually forwards an allowed A record'}).Count -ne 1){throw 'DNS proof after isolated restoration failed'}
            Write-Host 'PASS VOLVE_SAME_NSIS_EXTRACTED_SYSTEM_MOTOR_SURVIVES_REAL_ISOLATED_DNS_CRASH_RESTORATION'
            # Corrupt the lab catalog after stopping, to prove the next start
            # refuses execution BEFORE opening DNS/53. This is VM-only.
            Stop-ScheduledTask -TaskName $task -ErrorAction Stop
            $stopDeadline=(Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 400
              $leftProcesses=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction SilentlyContinue | Where-Object {[string]$_.ExecutablePath -ieq $exe})
            }until($leftProcesses.Count -eq 0 -or (Get-Date) -ge $stopDeadline)
            if($leftProcesses.Count -ne 0){throw 'Motor did not stop before tamper detection'}
            $fixture=Join-Path $root 'catalog\feeds\hagezi_gambling_full.txt'
            if(-not (Test-Path -LiteralPath $fixture -PathType Leaf)){throw 'Missing installed test catalog'}
            Add-Content -LiteralPath $fixture -Value 'tampered-lab.example' -Encoding ascii
            Assert-ExtractedMotor
            Start-ScheduledTask -TaskName $task -ErrorAction Stop
            $badDeadline=(Get-Date).AddSeconds(12)
            do {
              Start-Sleep -Milliseconds 500
              $state=Get-ScheduledTask -TaskName $task -ErrorAction Stop
              $taskInfo=Get-ScheduledTaskInfo -TaskName $task -ErrorAction Stop
            }until(($state.State -ne 'Running' -and $taskInfo.LastTaskResult -ne 0) -or (Get-Date) -ge $badDeadline)
            if($state.State -eq 'Running' -or $taskInfo.LastTaskResult -eq 0){throw 'Tampered catalog started successfully'}
            foreach($endpoint in @('127.0.0.1','::1')){
              if(@(Get-NetUDPEndpoint -LocalAddress $endpoint -LocalPort 53 -ErrorAction SilentlyContinue).Count -ne 0){
                throw 'Tampered DNS service opened port 53'
              }
            }
            $tamperDiagnostic=Join-Path $root 'ci-startup-failure.txt'
            if(!(Test-Path -LiteralPath $tamperDiagnostic -PathType Leaf)){throw 'Missing controlled catalog rejection diagnostic'}
            if((Get-Content -LiteralPath $tamperDiagnostic -Raw).Trim() -cnotmatch '^stage=catalog-verify;win32=[0-9]{1,10}$'){throw 'Wrong startup failure reason after catalog tamper'}
            Write-VolvStartupFailure
            Write-Host 'PASS: tampered catalog cannot restart the SYSTEM motor and does not open DNS/53'
          }catch{
            if($registered){
              $taskState=Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
              $taskInfo=Get-ScheduledTaskInfo -TaskName $task -ErrorAction SilentlyContinue
              Write-Host ('VOLVE_SYSTEM_FAILURE='+([ordered]@{task_state=[string]$taskState.State;last_task_result=$taskInfo.LastTaskResult;catalog_present=(Test-Path -LiteralPath (Join-Path $root 'catalog\feeds\hagezi_gambling_full.txt'))}|ConvertTo-Json -Compress))
              try{Write-VolvStartupFailure}catch{Write-Host 'VOLVE_SYSTEM_STARTUP_DIAGNOSTIC=invalid-receipt'}
              @(Get-NetTCPConnection -LocalPort 53 -State Listen -ErrorAction SilentlyContinue)+@(Get-NetUDPEndpoint -LocalPort 53 -ErrorAction SilentlyContinue)|Select-Object LocalAddress,LocalPort,OwningProcess|Format-Table|Out-String|Write-Host
            }
            throw
          }finally{
            Remove-Item Env:\VOLVE_CI_FRESH_DNS53_PROBE -ErrorAction SilentlyContinue
            Remove-Item Env:\VOLVE_CI_TCP_REUSE_PROBE -ErrorAction SilentlyContinue
            if($registered){
              Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
            }
            # Never delete an unknown process: only terminate our exact compiled CI binary if still running.
            $left=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction SilentlyContinue | Where-Object { [string]$_.ExecutablePath -ieq $exe })
            foreach($p in $left){Stop-Process -Id $p.ProcessId -Force -ErrorAction Stop}
            $after=(Get-DnsClientServerAddress | Sort-Object InterfaceIndex,AddressFamily | Select-Object InterfaceIndex,AddressFamily,ServerAddresses | ConvertTo-Json -Compress -Depth 6)
            if($base -cne $after){throw 'FATAL: Windows DNS adapter settings changed'}
            $hostsAfter=(Get-FileHash -Algorithm SHA256 -LiteralPath "$env:WINDIR\System32\drivers\etc\hosts").Hash
            if($hosts -ne $hostsAfter){throw 'FATAL: hosts protection changed'}
            Write-Host 'PASS: disposable task removed and Windows hosts/DNS untouched'
          }
      - name: Remove disposable handoff and CI-only trust
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'Hosted cleanup only'}
          $thumb=$env:VOLVE_CI_HANDOFF_THUMB
          if($thumb){
            if($thumb -cnotmatch '^[A-F0-9]{40}$'){throw 'Unexpected CI signer pin'}
            foreach($store in @('Cert:\LocalMachine\Root','Cert:\LocalMachine\TrustedPublisher','Cert:\CurrentUser\My')){
              $p=Join-Path $store $thumb
              if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Force -ErrorAction Stop}
              if(Test-Path -LiteralPath $p){throw 'CI certificate cleanup failed'}
            }
          }
          $root=$env:VOLVE_CI_HANDOFF_ROOT
          if($root){
            $expected=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-SYSTEM-Handoff-'+$env:GITHUB_RUN_ID)
            if($root -cne $expected){throw 'Unexpected disposable handoff root'}
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop}
          }
          Write-Host 'PASS VOLVE_CI_HANDOFF_CLEANUP NO_RELEASE'
