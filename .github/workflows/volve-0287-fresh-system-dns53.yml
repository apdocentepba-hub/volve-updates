name: VOLVE pilot fresh motor SYSTEM DNS53 (DISPOSABLE VM ONLY)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/inapp/ci_fresh_dns53_windows.go'
      - 'development/0.28.7/inapp/ci_fresh_dns53_windows_test.go'
      - 'development/0.28.7/inapp/apply_overlay.go'
      - '.github/workflows/volve-0287-fresh-system-dns53.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volve-ci-fresh-resident53-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh-system-dns53:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Reconstruct and verify full VOLVE Go source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=@(Get-ChildItem 'development/0.28.7/complete-source-parts' -Filter 'part-*.bin' | Sort-Object Name)
          if($parts.Count -ne 10){throw 'Source archive part count'}
          $dest=[IO.File]::Create((Join-Path (Get-Location) 'source.zip'))
          try {
            for($i=0;$i -lt 10;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Source archive order'}
              $src=[IO.File]::OpenRead($parts[$i].FullName)
              try{$src.CopyTo($dest)}finally{$src.Dispose()}
            }
          }finally{$dest.Dispose()}
          if((Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw 'Source SHA256 mismatch'}
          Expand-Archive source.zip -DestinationPath build -Force
          $old='development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip'
          if((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'){throw 'Preflight ZIP SHA256 mismatch'}
          Expand-Archive $old -DestinationPath build -Force
          Copy-Item development/0.28.7/journal/*.go build/codigo/motorupdate/ -Force
          $recovery='development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip'
          if((Get-FileHash $recovery -Algorithm SHA256).Hash.ToLowerInvariant() -ne '773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'){throw 'Recovery ZIP SHA256 mismatch'}
          Expand-Archive $recovery -DestinationPath build -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Source overlay failed'}
      - name: Compile CI-tagged actual VOLVE motor and test safe preflight
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          go test ./motorupdate -run '^TestFreshMotor' -count=1 -v
          if($LASTEXITCODE -ne 0){throw 'Fresh motor gates failed'}
          go build -tags volveci -trimpath -o "$env:RUNNER_TEMP\VOLVE_CI_FreshDNS53.exe" .
          if($LASTEXITCODE -ne 0){throw 'Real motor executable compilation failed'}
          $binary=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_FreshDNS53.exe'
          if(-not (Test-Path -LiteralPath $binary -PathType Leaf)){throw 'CI motor executable missing'}
          Get-FileHash $binary -Algorithm SHA256 | Format-List
      - name: Start real VOLVE DNS53 motor under Windows SYSTEM and query from separate process
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Not a disposable GitHub hosted runner'}
          $vm=Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          if(($vm.Manufacturer+' '+$vm.Model) -notmatch '(?i:virtual machine|vmware|kvm|hyper-v|qemu|virtualbox)'){throw 'Not a verified virtual machine'}
          if(Get-ScheduledTask -TaskName 'VOLVE-DNS-SERVER-0270' -ErrorAction SilentlyContinue){throw 'Production task present'}
          if(Get-ScheduledTask -TaskName 'VOLVE-DNS-RESCUE-0270' -ErrorAction SilentlyContinue){throw 'Production recovery task present'}
          $base=(Get-DnsClientServerAddress | Sort-Object InterfaceIndex,AddressFamily | Select-Object InterfaceIndex,AddressFamily,ServerAddresses | ConvertTo-Json -Compress -Depth 6)
          $hosts=(Get-FileHash -Algorithm SHA256 -LiteralPath "$env:WINDIR\System32\drivers\etc\hosts").Hash
          foreach($endpoint in @('127.0.0.1','::1')){
            if(@(Get-NetUDPEndpoint -LocalPort 53 -LocalAddress $endpoint -ErrorAction SilentlyContinue).Count -ne 0){throw ('DNS port 53 already occupied: '+$endpoint)}
          }
          $task='VOLVE-CI-FreshMotor-'+$env:GITHUB_RUN_ID
          if($task -notmatch '^VOLVE-CI-FreshMotor-[0-9]{6,20}$'){throw 'Unexpected disposable task name'}
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-FreshDNS53-'+$env:GITHUB_RUN_ID)
          $exe=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_FreshDNS53.exe'
          if(Test-Path -LiteralPath $root){throw 'CI root already exists'}
          $argument='--ci-fresh-dns53 "'+$root+'" VOLVE-CI-GITHUB-HOSTED-VM-DNS53-ONLY'
          $registered=$false
          try{
            $action=New-ScheduledTaskAction -Execute $exe -Argument $argument
            $trigger=New-ScheduledTaskTrigger -AtStartup
            $settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 3) -AllowStartIfOnBatteries
            Register-ScheduledTask -TaskName $task -Action $action -Trigger $trigger -Settings $settings -User 'SYSTEM' -RunLevel Highest -ErrorAction Stop | Out-Null
            $registered=$true
            $record=Get-ScheduledTask -TaskName $task -ErrorAction Stop
            if($record.Principal.UserId -notin @('SYSTEM','S-1-5-18') -or @($record.Actions).Count -ne 1 -or [string]$record.Actions[0].Execute -ine $exe){throw 'Task does not match expected SYSTEM binary'}
            $taskXML=Export-ScheduledTask -TaskName $task -ErrorAction Stop
            $taskDocument=[xml]$taskXML
            if(-not $taskDocument.Task.Triggers.BootTrigger){throw 'SYSTEM motor has no startup trigger'}
            Start-ScheduledTask -TaskName $task -ErrorAction Stop
            $deadline=(Get-Date).AddSeconds(25)
            do{
              Start-Sleep -Milliseconds 500
              $all=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction Stop)
              $matched=@($all | Where-Object { [string]$_.ExecutablePath -ieq $exe })
            }until($matched.Count -eq 1 -or (Get-Date) -ge $deadline)
            if($matched.Count -ne 1){throw 'Single real resident process was not started'}
            $owner=Invoke-CimMethod -InputObject $matched[0] -MethodName GetOwnerSid -ErrorAction Stop
            if($owner.ReturnValue -ne 0 -or $owner.Sid -ne 'S-1-5-18'){throw 'DNS service owner is not SYSTEM'}
            $env:VOLVE_CI_FRESH_DNS53_PROBE='GITHUB-HOSTED-VM-ONLY'
            go test . -run '^TestCIFreshResidentSYSTEMPort53$' -count=1 -timeout 1m -v
            if($LASTEXITCODE -ne 0){throw 'External real DNS53 IPv4+IPv6 blocking verification failed'}
            foreach($endpoint in @('127.0.0.1','::1')){
              $bound=@(Get-NetUDPEndpoint -LocalPort 53 -LocalAddress $endpoint -ErrorAction Stop)
              if($bound.Count -ne 1 -or $bound[0].OwningProcess -ne $matched[0].ProcessId){throw 'Port 53 is not owned exclusively by verified SYSTEM motor'}
            }
            Write-Host 'PASS: real compiled VOLVE runs under SYSTEM and serves dual-stack DNS/53; BetWarrior and stake.com blocked; example.org forwarded'
            # Verify that the SAME persistent startup task can stop and restart
            # without an installer re-creating it or mutating network settings.
            Stop-ScheduledTask -TaskName $task -ErrorAction Stop
            $stopDeadline=(Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 400
              $leftProcesses=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction SilentlyContinue | Where-Object {[string]$_.ExecutablePath -ieq $exe})
            }until($leftProcesses.Count -eq 0 -or (Get-Date) -ge $stopDeadline)
            if($leftProcesses.Count -ne 0){throw 'DNS motor did not stop before controlled restart'}
            $savedTask=Get-ScheduledTask -TaskName $task -ErrorAction Stop
            if($savedTask.Principal.UserId -notin @('SYSTEM','S-1-5-18') -or @($savedTask.Triggers).Count -ne 1){throw 'Installed startup task changed unexpectedly'}
            Start-ScheduledTask -TaskName $task -ErrorAction Stop
            go test . -run '^TestCIFreshResidentSYSTEMPort53          }finally{
            Remove-Item Env:\VOLVE_CI_FRESH_DNS53_PROBE -ErrorAction SilentlyContinue
            if($registered){
              Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
            }
            # Never delete an unknown process: only terminate our exact compiled CI binary if still running.
            $left=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction SilentlyContinue | Where-Object { [string]$_.ExecutablePath -ieq $exe })
            foreach($p in $left){Stop-Process -Id $p.ProcessId -Force -ErrorAction Stop}
            $after=(Get-DnsClientServerAddress | Sort-Object InterfaceIndex,AddressFamily | Select-Object InterfaceIndex,AddressFamily,ServerAddresses | ConvertTo-Json -Compress -Depth 6)
            if($base -cne $after){throw 'FATAL: Windows DNS adapter settings changed'}
            $hostsAfter=(Get-FileHash -Algorithm SHA256 -LiteralPath "$env:WINDIR\System32\drivers\etc\hosts").Hash
            if($hosts -ne $hostsAfter){throw 'FATAL: hosts protection changed'}
            Write-Host 'PASS: disposable task removed and Windows hosts/DNS untouched'
          }
 -count=1 -timeout 1m -v
            if($LASTEXITCODE -ne 0){throw 'Real DNS/53 failed after restarting same registered SYSTEM task'}
            Write-Host 'PASS: persistent AtStartup SYSTEM task restarted with exact original 400k catalog and DNS blocking still works'
            # Corrupt the lab catalog after stopping, to prove the next start
            # refuses execution BEFORE opening DNS/53. This is VM-only.
            Stop-ScheduledTask -TaskName $task -ErrorAction Stop
            $stopDeadline=(Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 400
              $leftProcesses=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction SilentlyContinue | Where-Object {[string]$_.ExecutablePath -ieq $exe})
            }until($leftProcesses.Count -eq 0 -or (Get-Date) -ge $stopDeadline)
            if($leftProcesses.Count -ne 0){throw 'Motor did not stop before tamper detection'}
            $fixture=Join-Path $root 'catalog\feeds\hagezi_gambling_full.txt'
            if(-not (Test-Path -LiteralPath $fixture -PathType Leaf)){throw 'Missing installed test catalog'}
            Add-Content -LiteralPath $fixture -Value 'tampered-lab.example' -Encoding ascii
            Start-ScheduledTask -TaskName $task -ErrorAction Stop
            $badDeadline=(Get-Date).AddSeconds(12)
            do {
              Start-Sleep -Milliseconds 500
              $state=Get-ScheduledTask -TaskName $task -ErrorAction Stop
              $taskInfo=Get-ScheduledTaskInfo -TaskName $task -ErrorAction Stop
            }until(($state.State -ne 'Running' -and $taskInfo.LastTaskResult -ne 0) -or (Get-Date) -ge $badDeadline)
            if($state.State -eq 'Running' -or $taskInfo.LastTaskResult -eq 0){throw 'Tampered catalog started successfully'}
            foreach($endpoint in @('127.0.0.1','::1')){
              if(@(Get-NetUDPEndpoint -LocalAddress $endpoint -LocalPort 53 -ErrorAction SilentlyContinue).Count -ne 0){
                throw 'Tampered DNS service opened port 53'
              }
            }
            Write-Host 'PASS: tampered catalog cannot restart the SYSTEM motor and does not open DNS/53'
          }finally{
            Remove-Item Env:\VOLVE_CI_FRESH_DNS53_PROBE -ErrorAction SilentlyContinue
            if($registered){
              Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
            }
            # Never delete an unknown process: only terminate our exact compiled CI binary if still running.
            $left=@(Get-CimInstance Win32_Process -Filter "Name='VOLVE_CI_FreshDNS53.exe'" -ErrorAction SilentlyContinue | Where-Object { [string]$_.ExecutablePath -ieq $exe })
            foreach($p in $left){Stop-Process -Id $p.ProcessId -Force -ErrorAction Stop}
            $after=(Get-DnsClientServerAddress | Sort-Object InterfaceIndex,AddressFamily | Select-Object InterfaceIndex,AddressFamily,ServerAddresses | ConvertTo-Json -Compress -Depth 6)
            if($base -cne $after){throw 'FATAL: Windows DNS adapter settings changed'}
            $hostsAfter=(Get-FileHash -Algorithm SHA256 -LiteralPath "$env:WINDIR\System32\drivers\etc\hosts").Hash
            if($hosts -ne $hostsAfter){throw 'FATAL: hosts protection changed'}
            Write-Host 'PASS: disposable task removed and Windows hosts/DNS untouched'
          }
