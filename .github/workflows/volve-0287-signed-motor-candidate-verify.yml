name: VOLVE original-publisher signed DNS motor candidate (VERIFY ONLY)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/motor-release-candidate/**'
      - '.github/workflows/volve-0287-signed-motor-candidate-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-signed-candidate:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Download exact published Centro binary; reconstruct signed motor candidate WITHOUT publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Only hosted Windows CI is accepted'}
          New-Item -ItemType Directory candidate -Force | Out-Null
          gh release download v0.28.7 --repo "${{ github.repository }}" --pattern VOLVE_0_28_7_CENTRO.exe --dir candidate
          if($LASTEXITCODE -ne 0){throw 'Original released binary unavailable'}
          $source='candidate/VOLVE_0_28_7_CENTRO.exe'
          if((Get-Item $source).Length -ne 18168832 -or (Get-FileHash -Algorithm SHA256 $source).Hash.ToLowerInvariant() -cne 'e451b6289116636986ddd67b39dc15f02e471ebde7be9508b38d7bcb0155b414'){
            throw 'Original published Centro EXE not byte-exact'
          }
          $target='candidate/VOLVE_DNS_Motor_0_28_7.exe'
          Copy-Item $source $target
          Copy-Item development/0.28.7/motor-release-candidate/VOLVE_DNS_Motor_0_28_7.exe.json ($target+'.json')
          Copy-Item development/0.28.7/motor-release-candidate/VOLVE_DNS_Motor_0_28_7.exe.sig ($target+'.sig')
          if((Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant() -cne 'e451b6289116636986ddd67b39dc15f02e471ebde7be9508b38d7bcb0155b414'){throw 'Prepared motor bits mismatch'}
      - name: Rebuild pinned 0.28.7 source to call REAL motorupdate.VerifyStaged
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=@(Get-ChildItem development/0.28.7/complete-source-parts -Filter part-*.bin | Sort-Object Name)
          if($parts.Count -ne 10){throw 'Unexpected source chunk count'}
          $file=[IO.File]::Create((Join-Path $PWD 'verified.zip'))
          try {
            for($i=0;$i -lt 10;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Source chunk order mismatch'}
              $stream=[IO.File]::OpenRead($parts[$i].FullName)
              try{$stream.CopyTo($file)}finally{$stream.Dispose()}
            }
          } finally {$file.Dispose()}
          if((Get-FileHash -Algorithm SHA256 verified.zip).Hash.ToLowerInvariant() -cne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw 'Base source mismatch'}
          New-Item -ItemType Directory build -Force | Out-Null
          Expand-Archive verified.zip build -Force
          $overlays=@(
            @{n='VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip';h='fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'},
            @{n='VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip';h='773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'}
          )
          foreach($o in $overlays){
            $p=Join-Path development/0.28.7 $o.n
            if((Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant() -cne $o.h){throw 'Overlay not pinned'}
            Expand-Archive $p build -Force
          }
          Copy-Item development/0.28.7/journal/*.go build/codigo/motorupdate -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Trusted motor source overlay unavailable'}
      - name: Verify exact publisher signature via motorupdate.VerifyStaged; reject corrupt bytes and signatures
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $env:VOLVE_CI_MOTOR_CANDIDATE=(Resolve-Path ../../candidate/VOLVE_DNS_Motor_0_28_7.exe).Path
          @'
          //go:build windows
          package motorupdate
          import (
            "crypto/ed25519"
            "encoding/base64"
            "os"
            "path/filepath"
            "testing"
            "strings"
          )
          func TestAuthenticPublisherSignedVOLVEMotorCandidate(t *testing.T){
            p:=os.Getenv("VOLVE_CI_MOTOR_CANDIDATE")
            if p==""{t.Fatal("actual released motor candidate required")}
            key,e:=base64.StdEncoding.DecodeString("6pa2qoWNv+J7u0ulDXvqlBd7qEeDzPBdxmU6NpqTGHk=")
            if e!=nil{t.Fatal(e)}
            m,e:=VerifyStaged(p,ed25519.PublicKey(key))
            if e!=nil{t.Fatalf("real publisher-signed release candidate refused: %v",e)}
            if m.Schema!=1||m.Component!="dns-engine"||m.Version!="0.28.7"||m.MinPanelVersion!="0.28.7"||
              m.Size!=18168832||m.SHA256!="e451b6289116636986ddd67b39dc15f02e471ebde7be9508b38d7bcb0155b414"||
              !strings.HasSuffix(m.URL,"/v0.28.7/VOLVE_DNS_Motor_0_28_7.exe"){
              t.Fatalf("candidate identity mismatch: %+v",m)
            }
            temp:=t.TempDir()
            bad:=filepath.Join(temp,filepath.Base(p))
            raw,e:=os.ReadFile(p);if e!=nil{t.Fatal(e)}
            raw[100]^=0xff
            if e=os.WriteFile(bad,raw,0600);e!=nil{t.Fatal(e)}
            for _,ext:=range []string{".json",".sig"}{
              data,e:=os.ReadFile(p+ext);if e!=nil{t.Fatal(e)}
              if e=os.WriteFile(bad+ext,data,0600);e!=nil{t.Fatal(e)}
            }
            if _,e=VerifyStaged(bad,ed25519.PublicKey(key));e==nil{t.Fatal("tampered motor executable passed signed verification")}
            good,e:=os.ReadFile(p);if e!=nil{t.Fatal(e)}
            if e=os.WriteFile(bad,good,0600);e!=nil{t.Fatal(e)}
            signature,e:=os.ReadFile(bad+".sig");if e!=nil{t.Fatal(e)}
            signature[0]^=1
            if e=os.WriteFile(bad+".sig",signature,0600);e!=nil{t.Fatal(e)}
            if _,e=VerifyStaged(bad,ed25519.PublicKey(key));e==nil{t.Fatal("tampered Ed25519 signature passed signed verification")}
          }
          '@ | Set-Content motorupdate/release_publisher_candidate_ci_windows_test.go -Encoding utf8
          go test ./motorupdate -run '^TestAuthenticPublisherSignedVOLVEMotorCandidate$' -count=1 -v -timeout 3m
          if($LASTEXITCODE -ne 0){throw 'Original publisher motor signature did not pass real verifier'}
          Write-Host 'PASS: official v0.28.7 EXACT bytes accepted by motorupdate.VerifyStaged with real editor key; tamper tests rejected'
      - name: Export signed motor candidate as CI artifact ONLY; never release or install
        uses: actions/upload-artifact@v4
        with:
          name: VOLVE-0287-MOTOR-FIRMADO-NO-INSTALAR
          path: |
            candidate/VOLVE_DNS_Motor_0_28_7.exe
            candidate/VOLVE_DNS_Motor_0_28_7.exe.json
            candidate/VOLVE_DNS_Motor_0_28_7.exe.sig
          if-no-files-found: error
          retention-days: 7
