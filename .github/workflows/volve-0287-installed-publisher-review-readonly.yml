name: VOLVE 0.28.7 installed publisher review native Windows READ ONLY (NO RELEASE)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/inapp/installed_publisher_review_windows.go'
      - 'development/0.28.7/inapp/installed_publisher_review_windows_test.go'
      - 'development/0.28.7/inapp/legacy_publisher_review_packet.go'
      - 'development/0.28.7/inapp/legacy_publisher_review_packet_test.go'
      - 'development/0.28.7/inapp/apply_overlay.go'
      - '.github/workflows/volve-0287-installed-publisher-review-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-review-native-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Reconstruct authenticated VOLVE source and compile native reviewer in Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=@(Get-ChildItem 'development/0.28.7/complete-source-parts' -Filter 'part-*.bin' -File | Sort-Object Name)
          if($parts.Count -ne 10){throw 'Source chunks missing'}
          $zip=[IO.File]::Create((Join-Path (Get-Location) 'source.zip'))
          try{
            for($i=0;$i -lt 10;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Unexpected source chunk name'}
              $source=[IO.File]::OpenRead($parts[$i].FullName)
              try{$source.CopyTo($zip)}finally{$source.Dispose()}
            }
          }finally{$zip.Dispose()}
          if((Get-FileHash -Algorithm SHA256 source.zip).Hash.ToLowerInvariant() -ne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw 'Original source integrity mismatch'}
          New-Item -ItemType Directory build -Force | Out-Null
          Expand-Archive -LiteralPath source.zip -DestinationPath build -Force
          $overlay='development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip'
          if((Get-FileHash -Algorithm SHA256 $overlay).Hash.ToLowerInvariant() -ne 'fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'){throw 'Preflight overlay altered'}
          Expand-Archive -LiteralPath $overlay -DestinationPath build -Force
          Copy-Item 'development/0.28.7/journal/*.go' build/codigo/motorupdate/ -Force
          $crash='development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip'
          if((Get-FileHash -Algorithm SHA256 $crash).Hash.ToLowerInvariant() -ne '773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'){throw 'Recovery overlay altered'}
          Expand-Archive -LiteralPath $crash -DestinationPath build -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Real Go source overlay failed'}
          foreach($file in @(
            'installed_publisher_review_windows.go',
            'installed_publisher_review_windows_test.go'
          )){
            if(-not (Test-Path -LiteralPath (Join-Path 'build/codigo' $file) -PathType Leaf)){
              throw ('Installed publisher reviewer missing from Go Windows build: '+$file)
            }
          }
          if(-not (Test-Path -LiteralPath 'build/codigo/motorupdate/legacy_publisher_review_packet.go' -PathType Leaf)){
            throw 'Publisher review engine missing from exact Go module'
          }
      - name: Prove installed read-only publisher review cannot fake live SYSTEM task or grant installation
        working-directory: build/codigo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          go test . -count=1 -timeout 6m -v -run '^TestInstalledPublisherReview'
          if($LASTEXITCODE -ne 0){throw 'Windows installed publisher review used unsafe or unverifiable evidence'}
          go test ./motorupdate -count=1 -timeout 3m -v -run '^TestLegacyPublisherReviewPacket'
          if($LASTEXITCODE -ne 0){throw 'Unsigned review packet incorrectly passed missing identity or editorial signature'}
          Write-Host 'PASS: real Windows scheduler observer, signed candidate, snapshot/task XML identity and process DNS53 guard. No production key, motor switch, network or filesystem mutations.'

