name: VOLVE 0.28.5 - Windows update downgrade guard
on:
  push:
    paths:
      - qa/0285-updater-guard/**
      - .github/workflows/volve-updater-0285-windows-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: qa/0285-updater-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Regression and no-downgrade guard
        shell: pwsh
        run: go test ./... -count=1 -v
      - name: Windows race detector
        shell: pwsh
        run: go test -race ./... -count=1
