name: VOLVE activation order regression (MEMORY ONLY NO INSTALL)
on:
  push:
    branches: [work/0287-activation-order-regression-20261127]
    paths:
      - 'development/0.28.7/inapp/**'
      - '.github/workflows/volve-0287-activation-order-regression.yml'
permissions:
  contents: read
jobs:
  order-regression:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Reconstruct exact pinned motor source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib,zipfile,shutil
          from pathlib import Path
          root=Path('development/0.28.7')
          parts=sorted((root/'complete-source-parts').glob('part-*.bin'))
          assert [p.name for p in parts]==[f'part-{i:02d}.bin' for i in range(10)]
          payload=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(payload).hexdigest()=='92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'
          Path('source.zip').write_bytes(payload)
          Path('build').mkdir(exist_ok=True)
          with zipfile.ZipFile('source.zip') as z: z.extractall('build')
          for name,digest in (
            ('VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip','fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'),
            ('VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip','773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40')
          ):
              p=root/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(p) as z: z.extractall('build')
          for p in (root/'journal').glob('*.go'):
              shutil.copy2(p,Path('build/codigo/motorupdate')/p.name)
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Pinned source reconstruction failed'}
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Overlay failed'}
      - name: Test exact activation order with simulated DNS writes and native fresh reservation
        working-directory: build/codigo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $result=@(go test ./motorupdate -run '^(TestFreshActivationAdmissionSeparatesFreshFromMigration|TestWindowsFreshReservationNativeCreateOnly|TestWindowsFreshControllerSignedArchivesAndRecovery|TestWindowsFreshWatchdogNativeRegistrationAttestation|TestWindowsFreshNativeActivationRejectsNonSYSTEM|TestWindowsFreshRecoveryPermitDistinctScope|TestWindowsFreshPersistedRecoveryResumesWithoutActivationGrant|TestWindows(ActivationPolicyDriftInsideAttestationPreventsCommit|DNSActivationOverrideGuardRejectsDriftWithoutSuppressingRecovery|PinnedDNSActivation.*))$' -count=1 -v -timeout 10m)
          $code=$LASTEXITCODE
          $result|Write-Host
          if($code -ne 0){throw 'Activation order regression failed'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_DNS_POLICY_DRIFT_DURING_ATTESTATION_TRANSACTION_RECOVERY$'}).Count -ne 1){throw 'Missing transaction proof'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestWindowsPinnedDNSActivationRejectsConcurrentPostAttestationDNSChange '}).Count -ne 1){throw 'Missing adapter drift regression'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_ADMISSION_BINDS_NINE_PINS_REJECTS_MIGRATION_AND_CATALOG$'}).Count -ne 1){throw 'Missing fresh admission scope proof'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_NATIVE_RESERVATION_CREATE_ONLY_ACL_REPLAY_REFUSED_NO_DNS$'}).Count -ne 1){throw 'Missing native fresh reservation proof'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_SIGNED_ARCHIVES_RESERVATION_RECOVERY_CHAIN_MEMORY_DNS_ONLY$'}).Count -ne 1){throw 'Missing integrated fresh archive and recovery proof'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_RESERVATION_REOPEN_REFUSES_FOREIGN_PARTIAL$'}).Count -ne 1 -or @($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_RESERVATION_DRIFT_STOPS_NEXT_WRITE_AND_RECOVERS$'}).Count -ne 1){throw 'Missing fresh consumed receipt drift proof'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_NATIVE_WATCHDOG_REGISTRATION_PINNED_INERT_NO_START_NO_DNS$'}).Count -ne 1){throw 'Missing native watchdog registration proof'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_WATCHDOG_ADMISSION_BINDS_XML_EXE_DACL$'}).Count -ne 1 -or @($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_NATIVE_ROUTE_REFUSES_NON_SYSTEM_NO_WRITES$'}).Count -ne 1){throw 'Missing fresh native admission binding and non-SYSTEM refusal proof'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_RECOVERY_PERMIT_DISTINCT_SCOPE_NO_ACTIVATION_EXPIRY$'}).Count -ne 1){throw 'Missing fresh recovery-only scope proof'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FRESH_PERSISTED_RESCUE_RESUME_IDEMPOTENT_WITHOUT_ACTIVATION_MEMORY_DNS_ONLY$'}).Count -ne 1){throw 'Missing durable fresh rescue resume proof'}
          Write-Host 'PASS VOLVE_ACTIVATION_ORDER_MEMORY_ONLY_NO_INSTALL_NO_RELEASE'
