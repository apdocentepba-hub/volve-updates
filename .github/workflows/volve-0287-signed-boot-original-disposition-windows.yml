name: VOLVE 0.28.7 publisher-authorized boot restore original image decisions (READ ONLY)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - '.github/workflows/volve-0287-signed-boot-original-disposition-windows.yml'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_boot_admission_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_boot_admission_windows_test.go'
      - 'development/0.28.7/inapp/watchdogcmd/main_windows.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-image-disposition:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Authenticate original source and recovery overlays
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Disposable hosted CI required'}
          $parts=@(Get-ChildItem development/0.28.7/complete-source-parts -Filter 'part-*.bin' -File|Sort-Object Name)
          if($parts.Count -ne 10){throw 'Unexpected source parts'}
          $archive=Join-Path $PWD 'authenticated-source.zip'
          $out=[IO.File]::Create($archive)
          try{
            for($i=0;$i -lt $parts.Count;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Unexpected part order'}
              $inputStream=[IO.File]::OpenRead($parts[$i].FullName)
              try{$inputStream.CopyTo($out)}finally{$inputStream.Dispose()}
            }
          }finally{$out.Dispose()}
          if((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -cne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){
            throw 'Unexpected original source SHA256'
          }
          New-Item -ItemType Directory build -Force|Out-Null
          Expand-Archive $archive build -Force
          $overlays=@(
            @{name='VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip';sha='fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'},
            @{name='VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip';sha='773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'}
          )
          foreach($o in $overlays){
            $file=Join-Path development/0.28.7 $o.name
            if((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() -cne $o.sha){throw 'Recovery overlay changed'}
            Expand-Archive $file build -Force
          }
          Copy-Item development/0.28.7/journal/*.go build/codigo/motorupdate -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Authentic source overlay failed'}
      - name: Test all signed boot admission cases with real Windows NTFS and mutex
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $env:CGO_ENABLED='0'
          $pattern='^TestSignedBootAdmission(RejectsMissingGrantThenAcceptsExactSealedGrant|RejectsWrongKeyOrTamperedGrantWithoutChangingJournal|RejectsCancelledOrUntrustedReaders|ClassifiesExactOriginalStatesAndRejectsUnknown|RejectsSymlinkedOriginalWithoutModifyingTarget)$'
          go test ./cmd/volve-managed-watchdog -run $pattern -count=1 -timeout 7m -v
          if($LASTEXITCODE -ne 0){throw 'Signed boot exact original-image decisions rejected by Windows test'}
          go build -trimpath -o (Join-Path $env:RUNNER_TEMP 'VOLVE_CI_Independent_Recovery.exe') ./cmd/volve-managed-watchdog
          if($LASTEXITCODE -ne 0){throw 'Independent Windows watchdog build failed'}
          Write-Host 'PASS: genuine signed grant + original/absent/target/unknown/reparse decision; no production motor or DNS touched'
