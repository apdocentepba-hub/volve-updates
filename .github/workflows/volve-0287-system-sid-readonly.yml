name: VOLVE 0.28.7 SYSTEM + NTFS combined read-only gate (NO RELEASE)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - '.github/workflows/volve-0287-system-sid-readonly.yml'
      - 'development/0.28.7/inapp/dns_system_probe_ci/main_windows.go'
      - 'development/0.28.7/inapp/dns_restore_sealed_attestor_windows.go'
      - 'development/0.28.7/inapp/dns_restore_ntfs_acl_windows.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-local-system-token:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Reject interactive admin; accept true SYSTEM task token; remove CI task
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='VOLVE-CI-SystemSID-'+$env:GITHUB_RUN_ID
          if($name -notmatch '^VOLVE-CI-SystemSID-[0-9]{8,15}$'){
            throw 'Unexpected CI-only Task Scheduler object name'
          }
          if(Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue){
            throw 'Collision: refusing to modify an existing scheduled task'
          }
          $folder=Join-Path $env:RUNNER_TEMP 'volve-ci-system-sid'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $source='development/0.28.7/inapp'
          Copy-Item -Path (Join-Path $source 'dns_restore*.go') -Destination $folder -ErrorAction Stop
          Copy-Item -LiteralPath (Join-Path $source 'resident_journal.go') -Destination $folder -ErrorAction Stop
          $target=Join-Path $folder 'cmd/systemprobe'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $source 'dns_system_probe_ci/main_windows.go') -Destination $target -ErrorAction Stop
          $exe=Join-Path $folder 'volve-ci-system-probe.exe'
          $receipt=Join-Path $folder 'system-token-evidence.txt'
          # Create a disposable REAL Windows NTFS journal fixture. Seal its
          # owner/ACL to LocalSystem+Administrators, without changing any
          # product directory, DNS interface, existing task or user file.
          $parent=Join-Path $folder 'legacy-engine-recovery'
          $journal=Join-Path $parent 'motor-recovery-transaction'
          $intent=Join-Path $journal 'resident-intent.json'
          $snapshot=Join-Path $parent 'dns-restore-snapshot.json'
          New-Item -ItemType Directory -Path $journal -Force | Out-Null
          [IO.File]::WriteAllText($intent,'{}')
          [IO.File]::WriteAllText($snapshot,'{}')
          $admins=[Security.Principal.SecurityIdentifier]::new('S-1-5-32-544')
          $system=[Security.Principal.SecurityIdentifier]::new('S-1-5-18')
          $full=[Security.AccessControl.FileSystemRights]::FullControl
          $allow=[Security.AccessControl.AccessControlType]::Allow
          foreach($p in @($parent,$journal,$intent,$snapshot)){
            if([IO.Directory]::Exists($p)){
              $acl=New-Object Security.AccessControl.DirectorySecurity
              $flags=[Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [Security.AccessControl.InheritanceFlags]::ObjectInherit
              foreach($sid in @($admins,$system)){
                $rule=[Security.AccessControl.FileSystemAccessRule]::new($sid,$full,$flags,[Security.AccessControl.PropagationFlags]::None,$allow)
                $acl.AddAccessRule($rule)
              }
              $acl.SetAccessRuleProtection($true,$false)
              $acl.SetOwner($admins)
              Set-Acl -LiteralPath $p -AclObject $acl -ErrorAction Stop
            }else{
              $acl=New-Object Security.AccessControl.FileSecurity
              foreach($sid in @($admins,$system)){
                $rule=[Security.AccessControl.FileSystemAccessRule]::new($sid,$full,$allow)
                $acl.AddAccessRule($rule)
              }
              $acl.SetAccessRuleProtection($true,$false)
              $acl.SetOwner($admins)
              Set-Acl -LiteralPath $p -AclObject $acl -ErrorAction Stop
            }
          }
          Write-Host 'PASS: disposable journal and snapshot sealed to SYSTEM/Administrators NTFS DACL'
          Push-Location $folder
          try {
            go mod init volve-ci-system-dns-readonly
            if($LASTEXITCODE -ne 0){throw 'CI module setup failed'}
            go build -o $exe ./cmd/systemprobe
            if($LASTEXITCODE -ne 0){throw 'CI identity-only executable failed to compile'}
            $interactive=Start-Process -FilePath $exe -ArgumentList ('"'+$receipt+'" "'+$journal+'" "'+$snapshot+'"') -NoNewWindow -PassThru -Wait
            if($interactive.ExitCode -ne 83 -or (Test-Path $receipt)){
              throw 'Interactive admin was incorrectly accepted as SYSTEM'
            }
            Write-Host 'PASS: interactive Windows admin rejected (SID != S-1-5-18)'
            $principal=New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
            $action=New-ScheduledTaskAction -Execute $exe -Argument ('"'+$receipt+'" "'+$journal+'" "'+$snapshot+'"')
            $trigger=New-ScheduledTaskTrigger -Once -At ((Get-Date).AddDays(5))
            $registered=$false
            try {
              Register-ScheduledTask -TaskName $name -Principal $principal -Action $action -Trigger $trigger -ErrorAction Stop | Out-Null
              $registered=$true
              $task=Get-ScheduledTask -TaskName $name -ErrorAction Stop
              if($task.TaskPath -ne '\' -or $task.Principal.UserId -notin @('SYSTEM','S-1-5-18') -or
                 @($task.Actions).Count -ne 1 -or $task.Actions[0].Execute -ine $exe){
                throw 'Disposable SYSTEM task identity not pinned'
              }
              Start-ScheduledTask -TaskName $name -ErrorAction Stop
              $matched=$false
              for($i=0;$i -lt 80;$i++){
                if(Test-Path -LiteralPath $receipt){
                  $evidence=Get-Content -LiteralPath $receipt -Raw -ErrorAction Stop
                  if($evidence -ne 'VOLVE_CI_WINDOWS_SYSTEM_SID_AND_SEALED_NTFS'){
                    throw 'SYSTEM task returned unexpected identity evidence'
                  }
                  $matched=$true
                  break
                }
                Start-Sleep -Milliseconds 500
              }
              if(-not $matched){
                $info=Get-ScheduledTaskInfo -TaskName $name -ErrorAction SilentlyContinue
                throw "SYSTEM-only process did not attest its token; LastTaskResult=$($info.LastTaskResult)"
              }
              Write-Host 'PASS: one actual LocalSystem process proved SID S-1-5-18 AND verified all protected NTFS journal/snapshot descriptors'
              # Adversarial replay IN THE SAME SYSTEM TASK: tamper only the
              # disposable CI snapshot DACL by granting BUILTIN Users read
              # access. SYSTEM must now FAIL CLOSED (exit 83, no witness).
              for($i=0;$i -lt 20;$i++){
                $taskState=Get-ScheduledTask -TaskName $name -ErrorAction Stop
                if($taskState.State -ne 'Running'){break}
                Start-Sleep -Milliseconds 250
              }
              if((Get-ScheduledTask -TaskName $name).State -eq 'Running'){
                throw 'First SYSTEM witness still executing before tamper probe'
              }
              Remove-Item -LiteralPath $receipt -Force -ErrorAction Stop
              $weakAcl=Get-Acl -LiteralPath $snapshot -ErrorAction Stop
              $users=[Security.Principal.SecurityIdentifier]::new('S-1-5-32-545')
              $weakRule=[Security.AccessControl.FileSystemAccessRule]::new(
                $users,[Security.AccessControl.FileSystemRights]::Read,
                [Security.AccessControl.AccessControlType]::Allow)
              $weakAcl.AddAccessRule($weakRule)
              Set-Acl -LiteralPath $snapshot -AclObject $weakAcl -ErrorAction Stop
              Start-ScheduledTask -TaskName $name -ErrorAction Stop
              $denied=$false
              for($i=0;$i -lt 80;$i++){
                $status=Get-ScheduledTaskInfo -TaskName $name -ErrorAction Stop
                if($status.LastTaskResult -eq 83){$denied=$true;break}
                Start-Sleep -Milliseconds 500
              }
              if(-not $denied -or (Test-Path -LiteralPath $receipt)){
                throw "SYSTEM re-attestation accepted compromised NTFS ACL, last result=$($status.LastTaskResult)"
              }
              Write-Host 'PASS: same LocalSystem task rejected a foreign Users ACL on the disposable snapshot'
            } finally {
              if($registered){
                $task=Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
                if($null -ne $task){
                  if($task.TaskPath -ne '\' -or $task.Principal.UserId -notin @('SYSTEM','S-1-5-18')){
                    throw 'Refusing to remove unexpected task identity'
                  }
                  Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction Stop
                }
                Write-Host 'PASS: disposable SYSTEM task removed'
              }
            }
          } finally { Pop-Location }
