name: VOLVE 0.28.7 READ ONLY Windows install route triage (NO RELEASE)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/inapp/motor_install_route.go'
      - 'development/0.28.7/inapp/motor_install_route_test.go'
      - 'development/0.28.7/inapp/motor_install_route_windows.go'
      - 'development/0.28.7/inapp/motor_install_route_windows_test.go'
      - 'development/0.28.7/inapp/installed_motor_route_windows.go'
      - 'development/0.28.7/inapp/installed_motor_route_windows_test.go'
      - 'development/0.28.7/inapp/fresh_install_policy.go'
      - 'development/0.28.7/inapp/apply_overlay.go'
      - '.github/workflows/volve-0287-motor-route-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-route-triage:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Rebuild verified VOLVE source with safe six-inventory route classifier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=@(Get-ChildItem 'development/0.28.7/complete-source-parts' -Filter 'part-*.bin' -File | Sort-Object Name)
          if($parts.Count -ne 10){throw 'Source chunks missing'}
          $zip=[IO.File]::Create((Join-Path (Get-Location) 'source.zip'))
          try{
            for($i=0;$i -lt 10;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Unexpected source chunk name'}
              $source=[IO.File]::OpenRead($parts[$i].FullName)
              try{$source.CopyTo($zip)}finally{$source.Dispose()}
            }
          }finally{$zip.Dispose()}
          if((Get-FileHash -Algorithm SHA256 source.zip).Hash.ToLowerInvariant() -ne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw 'Original source integrity mismatch'}
          New-Item -ItemType Directory build -Force | Out-Null
          Expand-Archive -LiteralPath source.zip -DestinationPath build -Force
          $overlay='development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip'
          if((Get-FileHash -Algorithm SHA256 $overlay).Hash.ToLowerInvariant() -ne 'fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'){throw 'Preflight overlay altered'}
          Expand-Archive -LiteralPath $overlay -DestinationPath build -Force
          Copy-Item 'development/0.28.7/journal/*.go' build/codigo/motorupdate/ -Force
          $crash='development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip'
          if((Get-FileHash -Algorithm SHA256 $crash).Hash.ToLowerInvariant() -ne '773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'){throw 'Recovery overlay altered'}
          Expand-Archive -LiteralPath $crash -DestinationPath build -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Real Go source overlay failed'}
          foreach($file in @(
            'motor_install_route.go',
            'motor_install_route_test.go',
            'motor_install_route_windows.go',
            'motor_install_route_windows_test.go'
          )){
            if(-not (Test-Path -LiteralPath (Join-Path 'build/codigo/motorupdate' $file) -PathType Leaf)){
              throw ('Read-only route module omitted from actual Go build: '+$file)
            }
          }
      - name: Prove native Windows route does not confuse catalog-only with DNS motor
        working-directory: build/codigo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          go test ./motorupdate -count=1 -timeout 7m -v -run '^(TestMotorRoute|TestWindowsMotorRoute|TestFreshMotorPolicy)'
          if($LASTEXITCODE -ne 0){throw 'Windows read-only motor route classifier failed to reject unsafe residue'}
          Write-Host 'PASS: real Task Scheduler/DNS/UDP/TCP read-only audit; catalog-only != legacy motor; no release and no system changes.'
      - name: Test explicit installed command cannot install or turn an unknown catalog into motor evidence
        working-directory: build/codigo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path -LiteralPath installed_motor_route_windows.go -PathType Leaf)){throw 'Pilot route CLI missing from compiled source'}
          go test . -count=1 -timeout 5m -v -run '^TestInstalledMotorRouteCLI'
          if($LASTEXITCODE -ne 0){throw 'Installed route diagnostic has unsafe privilege, catalog or DNS handling'}
          Write-Host 'PASS: explicit read-only installed route command, unpinned catalog stays blocked, local IPv6 residue blocked and no writes.'
