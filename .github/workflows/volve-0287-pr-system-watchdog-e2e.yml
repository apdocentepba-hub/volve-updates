          set "RESULT=%ERRORLEVEL%"
          > "%~dp0exit.tmp" echo %RESULT%
          move /y "%~dp0exit.tmp" "%~dp0exit.txt" >nul
          exit /b %RESULT%
          '@
              Set-Content -LiteralPath $runner -Value $script -Encoding ASCII -ErrorAction Stop
              $action=New-ScheduledTaskAction -Execute (Join-Path $env:WINDIR 'System32\cmd.exe') -Argument ('/d /c ""'+$runner+'""') -WorkingDirectory $root
              $principal=New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
              $settings=New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 16)
              & wevtutil.exe sl Microsoft-Windows-TaskScheduler/Operational /e:true
              if($LASTEXITCODE -ne 0){throw 'Task history unavailable'}
              Register-ScheduledTask -TaskName $task -TaskPath '\' -Principal $principal -Action $action -Settings $settings -ErrorAction Stop|Out-Null
              try{
                function Get-OwnedManualTaskProof([string]$ownedName,[long]$cursor){
                  $all=@()
                  try{$all=@(Get-WinEvent -LogName 'Microsoft-Windows-TaskScheduler/Operational' -MaxEvents 4096 -ErrorAction Stop)}
                  catch{if($_.FullyQualifiedErrorId -notmatch '^NoMatchingEventsFound(?:,|$)'){throw}}
                  $records=@(foreach($event in $all){
                    if([long]$event.RecordId -le $cursor -or $event.Id -notin @(110,100,201,102)){continue}
                    $xml=[xml]$event.ToXml()
                    $fields=@{}
                    foreach($node in $xml.SelectNodes("//*[local-name()='EventData']/*[local-name()='Data']")){
                      $fields[[string]$node.GetAttribute('Name')]=[string]$node.InnerText
                    }
                    if($fields['TaskName'] -cne ('\'+$ownedName)){continue}
                    $instance=[guid]::Empty
                    $instanceText=[string]$fields['InstanceId']
                    if(-not $instanceText){$instanceText=[string]$fields['TaskInstanceId']}
                    if(-not [guid]::TryParse($instanceText,[ref]$instance) -or $instance -eq [guid]::Empty){continue}
                    [pscustomobject]@{id=[int]$event.Id;record=[long]$event.RecordId;instance=$instance.ToString('D');result=[string]$fields['ResultCode']}
                  })
                  # Real guest evidence (ca1ef94): providers emitted 100
                  # before 110 for the SAME GUID. Both must be fresh and
                  # unique, both precede successful action completion (201),
                  # which precedes task completion (102). Do not require
                  # ordering between the two independent start notifications.
                  $instances=@($records|Group-Object instance)
                  if($instances.Count -eq 1){
                    $owned=@($instances[0].Group)
                    $trigger=@($owned|Where-Object id -eq 110)
                    $started=@($owned|Where-Object id -eq 100)
                    $action=@($owned|Where-Object id -eq 201)
                    $completed=@($owned|Where-Object id -eq 102)
                    if($owned.Count -eq 4 -and $trigger.Count -eq 1 -and $started.Count -eq 1 -and $action.Count -eq 1 -and $completed.Count -eq 1){
                      $ids=@($owned|Sort-Object record|ForEach-Object {[long]$_.record})
                      if(@($ids|Sort-Object -Unique).Count -eq 4 -and
                        $action[0].record -gt $trigger[0].record -and $action[0].record -gt $started[0].record -and
                        $completed[0].record -gt $action[0].record -and
                        $action[0].result -in @('0','0x0','0x00000000') -and
                        (-not $completed[0].result -or $completed[0].result -in @('0','0x0','0x00000000'))){
                        return [pscustomobject]@{verified=$true;record_ids=$ids;instance=$trigger[0].instance}
                      }
                    }
                  }
                  # Keep the exact owned event metadata on rejection so
                  # that provider ordering/schema differences are observable.
                  # No unrelated task name, command, account or raw XML.
                  return [pscustomobject]@{verified=$false;record_ids=@();instance=$null;cursor=$cursor;observed=@($records|Sort-Object record|Select-Object -Last 32)}
                }
                # A newly enabled Operational log may legitimately be empty.
                # Empty is a valid zero cursor, NEVER a successful event chain.
                $cursor=[long]0
                $logInfo=Get-WinEvent -ListLog 'Microsoft-Windows-TaskScheduler/Operational' -ErrorAction Stop
                if(-not $logInfo.IsEnabled){throw 'Scheduler event journal disabled'}
                try{$cursor=[long](Get-WinEvent -LogName 'Microsoft-Windows-TaskScheduler/Operational' -MaxEvents 1 -ErrorAction Stop).RecordId}
                catch{if($_.FullyQualifiedErrorId -notmatch '^NoMatchingEventsFound(?:,|$)'){throw}}
                $startedAt=Get-Date
                Start-ScheduledTask -TaskName $task -TaskPath '\' -ErrorAction Stop
                $exitFile=Join-Path $root 'exit.txt'
                $until=[datetime]::UtcNow.AddMinutes(15)
                do{
                  Start-Sleep -Seconds 3
                  $current=Get-ScheduledTask -TaskName $task -TaskPath '\' -ErrorAction Stop
                  if((Test-Path -LiteralPath $exitFile) -and $current.State -eq 'Ready'){
                    # Nonzero exit is already a failure. Preserve its log
                    # without burning the entire success-event deadline.
