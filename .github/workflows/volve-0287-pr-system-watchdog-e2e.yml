name: VOLVE 0.28.7 signed migration + isolated guest recovery labs (NO RELEASE)
on:
  pull_request:
    branches: [feature/motor-updater-0287-pilot, work/0287-dns-cname-chain-guard-20261113]
    paths:
      - '.github/workflows/volve-0287-pr-system-watchdog-e2e.yml'
      - 'development/0.28.7/inapp/signed_legacy_windows_task_lab_test.go'
      - 'development/0.28.7/inapp/apply_overlay.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-legacy-and-system-watchdog:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify hosted disposable VM and no installed VOLVE motor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Hosted CI VM only'}
          $vm=Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          if(($vm.Manufacturer+' '+$vm.Model) -notmatch '(?i:virtual machine|vmware|hyper-v|kvm|qemu|virtualbox)'){throw 'Not a VM'}
          foreach($task in @('VOLVE-DNS-SERVER-0270','VOLVE-DNS-RESCUE-0270')){
            if(Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue){throw 'Production VOLVE task present; refuse test'}
          }
      - name: Record nested Windows VM prerequisites without changing the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hyperV = Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V -ErrorAction SilentlyContinue
          $processors = @(Get-CimInstance Win32_Processor)
          $report = [ordered]@{
            hyperv_enabled = ($hyperV.State -eq 'Enabled')
            new_vm_available = [bool](Get-Command New-VM -ErrorAction SilentlyContinue)
            firmware_virtualization_reported = ($processors.VirtualizationFirmwareEnabled -contains $true)
            virtualization_extensions_reported = ($processors.VMMonitorModeExtensions -contains $true)
          }
          $json = ConvertTo-Json -InputObject $report -Compress
          Write-Host "VOLVE_NESTED_VM_PREREQUISITES=$json"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $json
      - name: Reconstruct SHA-256 pinned VOLVE base and reviewed 0.28.7 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,shutil
          base=Path('development/0.28.7')
          parts=sorted((base/'complete-source-parts').glob('part-*.bin'))
          assert [p.name for p in parts]==[f'part-{i:02d}.bin' for i in range(10)]
          data=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=='92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'
          Path('source.zip').write_bytes(data)
          Path('build').mkdir(exist_ok=True)
          with zipfile.ZipFile('source.zip') as z:z.extractall('build')
          patches=[
            ('VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip','fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'),
            ('VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip','773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40')]
          for name,digest in patches:
            p=base/name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
            with zipfile.ZipFile(p) as z:z.extractall('build')
          for p in (base/'journal').glob('*.go'):
            shutil.copy2(p,Path('build/codigo/motorupdate')/p.name)
          print('Authenticated source assembled; no real installation touched.')
          PY
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
      - name: Execute signed CI task switch with independent SYSTEM watchdog (boot metadata only; NO REAL REBOOT)
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $helper=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_Standalone_Motor_Watchdog.exe'
          go build -trimpath -o $helper ./cmd/volve-managed-watchdog
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $helper)){throw 'Independent watchdog did not build'}
          $env:VOLVE_CI_MANAGED_WATCHDOG_EXE=$helper
          go test ./motorupdate -run '^(TestDurablePublisherGrant|TestDurablePublisherBoundWindowsBoot)' -count=1 -timeout 3m -v
          if($LASTEXITCODE -ne 0){throw 'Durable grant failed persisted file/fresh process negative tests'}
          go test ./motorupdate -run '^(TestSignedPublisherBootRecovery|TestPublisherBoundProtectedBoot)' -count=1 -timeout 2m -v
          if($LASTEXITCODE -ne 0){throw 'Signed publisher grant and resident journal binding failed'}
          $cancelledUpdaterTest='TestProtectedSignedCancelledUpdaterStillReacquiresBeforeHealth'
          $mutexCensus=@(go test ./motorupdate -list ('^'+$cancelledUpdaterTest+'$'))
          if($LASTEXITCODE -ne 0 -or -not ($mutexCensus -ccontains $cancelledUpdaterTest)){
            throw 'CRITICAL: cancelled updater mutex regression missing from reconstructed motorupdate'
          }
          go test ./motorupdate -run '^(TestProtectedSignedSwitchAndBootRecoveryShareProductionMutex|TestProtectedAdaptersFailClosedWithoutTrustedOperations|TestProtectedSignedRollbackHandsOffThenReacquiresBeforeHealth|TestProtectedSignedCancelledUpdaterStillReacquiresBeforeHealth|TestProtectedSignedDriverRejectsHandoffMissing)$' -count=1 -timeout 3m -v
          if($LASTEXITCODE -ne 0){throw 'Production switch and boot recovery did not share protected mutex'}
          go test ./cmd/volve-managed-watchdog -run '^(TestIndependentWatchdogUsesMigrationBootLockEvenForTerminalJournal|TestProtectedResidentBootPolicyUsesProductionMutexBeforeReadingJournal|TestProtectedBootPlanAuditWaitsForProductionUpdateMutex|TestIndependentBootAuditAcrossFreshProcesses|TestDurableWindowsGrant)' -count=1 -timeout 6m -v
          if($LASTEXITCODE -ne 0){throw 'Watchdog did not respect migration-held BootLock'}
          $census=@(go test . -list '^TestWindowsSignedUnversionedMigrationWithActualSYSTEMRecovery$')
          if($LASTEXITCODE -ne 0 -or -not ($census -contains 'TestWindowsSignedUnversionedMigrationWithActualSYSTEMRecovery')){
            throw 'CRITICAL: actual SYSTEM signed migration E2E test missing from reconstructed Centro'
          }
          go test . -run '^TestWindowsSignedUnversionedMigrationWithActualSYSTEMRecovery$' -count=1 -timeout 9m -v
          if($LASTEXITCODE -ne 0){throw 'Signed disposable SYSTEM transaction and watchdog rollback failed'}
          Write-Host 'PASS: disposable signed migration and independent real SYSTEM watchdog rollback; no installed VOLVE motor touched.'

  nested-hyperv-start-probe:
    name: Nested Hyper-V Start-VM probe (empty disk, no network, NO GUEST OS)
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Attempt real Start-VM and record exact outcome
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Hosted CI only'}
          $hostVM = Get-CimInstance Win32_ComputerSystem
          if(($hostVM.Manufacturer+' '+$hostVM.Model) -notmatch '(?i:virtual machine|vmware|hyper-v|kvm|qemu|virtualbox)'){throw 'Not a disposable VM'}
          $name = 'VOLVE-CI-NESTED-'+[guid]::NewGuid().ToString('N')
          $dir = Join-Path $env:RUNNER_TEMP $name
          $disk = Join-Path $dir 'empty.vhdx'
          $vm = $null
          $report = [ordered]@{
            runner_commit = $env:GITHUB_SHA
            phase = 'prerequisites'
            start_vm_attempted = $false
            start_vm_returned = $false
            state_after_start = $null
            network_adapters = $null
            guest_os_installed = $false
            guest_boot_verified = $false
            disk_persistence_verified = $false
            error_message = $null
            error_type = $null
            error_id = $null
            hresult = $null
            cleanup_ok = $false
          }
          try {
            Import-Module Hyper-V -ErrorAction Stop
            $report.phase = 'create_empty_disk_and_vm'
            New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
            $vm = New-VM -Name $name -Generation 2 -MemoryStartupBytes 1GB -NewVHDPath $disk -NewVHDSizeBytes 2GB -Path $dir -ErrorAction Stop
            $vm | Set-VMProcessor -Count 1 -ErrorAction Stop
            $vm | Get-VMNetworkAdapter | Remove-VMNetworkAdapter -Confirm:$false -ErrorAction Stop
            $report.network_adapters = @($vm | Get-VMNetworkAdapter).Count
            if($report.network_adapters -ne 0){throw 'Network isolation failed'}
            $report.phase = 'start_vm'
            $report.start_vm_attempted = $true
            Start-VM -VM $vm -ErrorAction Stop
            $report.start_vm_returned = $true
            Start-Sleep -Seconds 3
            $report.state_after_start = (Get-VM -Id $vm.Id -ErrorAction Stop).State.ToString()
            if($report.state_after_start -ne 'Running'){throw 'Start-VM returned but VM is not Running'}
            $report.phase = 'hypervisor_start_confirmed_only'
          } catch {
            $report.error_message = $_.Exception.Message
            $report.error_type = $_.Exception.GetType().FullName
            $report.error_id = $_.FullyQualifiedErrorId
            $report.hresult = ('0x{0:X8}' -f $_.Exception.HResult)
          } finally {
            try {
              if($null -ne $vm){
                $owned = Get-VM -Id $vm.Id -ErrorAction Stop
                if($owned.Name -cne $name){throw 'Unexpected VM identity'}
                if($owned.State -ne 'Off'){Stop-VM -VM $owned -TurnOff -Force -ErrorAction Stop}
                Remove-VM -VM $owned -Force -ErrorAction Stop
              }
              if(Test-Path -LiteralPath $dir){Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction Stop}
              $report.cleanup_ok = $true
            } catch {
              $report.cleanup_error = $_.Exception.Message
            }
            $json = ConvertTo-Json -InputObject $report -Compress -Depth 4
            Write-Host "VOLVE_NESTED_VM_RESULT=$json"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $json
          }
          if(-not $report.cleanup_ok){throw 'Nested VM cleanup failed; see recorded result'}
          if($report.error_message){throw ('Nested VM probe failed in '+$report.phase+': '+$report.error_message)}
          Write-Host 'PASS: Hyper-V started an empty isolated VM; NO guest OS boot or VOLVE installation proven.'

  nested-windows-guest-reboot:
    name: Windows guest ${{ matrix.trial }} (NO VOLVE INSTALL)
    needs: nested-hyperv-start-probe
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        trial: [strict-reboot, native-dns]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Reconstruct hash-pinned VOLVE source; never publish a motor
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, zipfile, shutil
          from pathlib import Path
          root=Path("development/0.28.7")
          parts=sorted((root/"complete-source-parts").glob("part-*.bin"))
          assert [p.name for p in parts]==[f"part-{i:02d}.bin" for i in range(10)]
          data=b"".join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=="92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5"
          Path("source.zip").write_bytes(data)
          Path("build").mkdir(exist_ok=True)
          with zipfile.ZipFile("source.zip") as z:z.extractall("build")
          for name,sha in [
            ("VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip","fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd"),
            ("VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip","773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40"),
          ]:
            p=root/name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
            with zipfile.ZipFile(p) as z:z.extractall("build")
          for p in (root/"journal").glob("*.go"):
            shutil.copy2(p,Path("build/codigo/motorupdate")/p.name)
          PY
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
      - name: Build standalone VM-only journal helper
        if: matrix.trial == 'strict-reboot'
        shell: powershell
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'volve-journal-lab.exe'
          & go build -trimpath -o $out ./cmd/volve-journal-lab
          if($LASTEXITCODE -ne 0){throw 'Could not compile the lab journal helper'}
          if((Get-Item -LiteralPath $out).Length -lt 1048576){throw 'Unexpectedly short lab helper'}
          Write-Host 'PASS: compiled lab journal helper; not a product executable'
      - name: Compile exact candidate motorupdate test binary for private guest
        if: matrix.trial == 'native-dns'
        shell: powershell
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'VOLVE-CI-GuestDNS.test.exe'
          & go test -c -trimpath -o $out ./motorupdate
          if($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $out)){throw 'Could not compile exact motorupdate tests'}
          Write-Host 'PASS: candidate motorupdate test executable compiled; NO PRODUCT INSTALL'
      - name: Boot official evaluation guest and execute selected isolated trial
        shell: powershell
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VOLVE_GUEST_TRIAL: ${{ matrix.trial }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Hosted CI only'}
          $hostVM=Get-CimInstance Win32_ComputerSystem
          if(($hostVM.Manufacturer+' '+$hostVM.Model) -notmatch '(?i:virtual machine|vmware|hyper-v|kvm|qemu|virtualbox)'){throw 'Not a disposable VM'}
          if($env:VOLVE_GUEST_TRIAL -cnotin @('strict-reboot','native-dns')){throw 'Unknown lab trial'}
          Import-Module Hyper-V -ErrorAction Stop
          $name='VOLVE-CI-WINGUEST-'+[guid]::NewGuid().ToString('N')
          $dir=Join-Path $env:RUNNER_TEMP $name
          $vhd=Join-Path $dir 'evaluation.vhd'
          $vm=$null
          $privateSwitch=$null
          $mounted=$false
          $session=$null
          $report=[ordered]@{
            candidate_head=$env:CANDIDATE_HEAD
            trial=$env:VOLVE_GUEST_TRIAL
            environment_drift=$null
            runner_commit=$env:GITHUB_SHA
            source='Microsoft Windows Server 2022 evaluation center VHD'
            stage='download'
            downloaded_sha256=$null
            downloaded_bytes=$null
            generation=$null
            guest_boot_verified=$false
            guest_os=$null
            guest_boot_before=$null
            guest_boot_after=$null
            guest_poweroff_observed=$false
            disk_persistence_verified=$false
            recovery_kit_prepared=$false
            recovery_kit_audit_passed=$false
            recovery_kit_verified=$false
            recovery_kit_cleanup_verified=$false
            recovery_proof_sha256=$null
            private_guest_dns_verified=$false
            private_guest_dns_test_exit=$null
            dns_test_exe_sha256=$null
            dns_reboot_verified=$false
            network_connectivity_verified=$false
            network_adapters=$null
            scheduler_preflight=$null
            private_guest_dns_scheduler=$null
            cleanup_ok=$false
            error_message=$null
          }
          function Connect-Guest([guid]$id,[pscredential]$credential,[int]$seconds){
            $until=[datetime]::UtcNow.AddSeconds($seconds)
            do {
              try {return New-PSSession -VMId $id -Credential $credential -ErrorAction Stop}
              catch {Start-Sleep -Seconds 10}
            } while([datetime]::UtcNow -lt $until)
            throw 'PowerShell Direct did not become available before deadline'
          }
          try{
            New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
            $drive=[IO.DriveInfo]::new([IO.Path]::GetPathRoot($dir))
            $budget=[int64]($drive.AvailableFreeSpace-6GB)
            if($budget -lt 4GB){throw 'Insufficient disk space for official VHD plus safety margin'}
            # Official Microsoft Evaluation Center direct download; never uploaded or redistributed.
            & curl.exe --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 1200 --max-filesize $budget --silent --show-error --output $vhd 'https://go.microsoft.com/fwlink/p/?clcid=0x409&country=us&culture=en-us&linkid=2195166'
            if($LASTEXITCODE -ne 0){throw ('Microsoft VHD download failed with curl exit '+$LASTEXITCODE)}
            $report.downloaded_bytes=(Get-Item -LiteralPath $vhd).Length
            $report.downloaded_sha256=(Get-FileHash -LiteralPath $vhd -Algorithm SHA256).Hash
            if($report.downloaded_sha256 -cne '588355586A3B99F1D47CEE02F4861680A7E1BCB353582FBE7DA11E2988E7562F'){throw 'Official VHD bytes differ from the previously observed successful lab image; review before running'}
            Get-VHD -Path $vhd -ErrorAction Stop | Out-Null
            $report.stage='prepare_offline_guest_answer_file'
            $password='V!a7'+[guid]::NewGuid().ToString('N')
            Write-Host ('::add-mask::'+$password)
            $credential=[pscredential]::new('Administrator',(ConvertTo-SecureString $password -AsPlainText -Force))
            $mountedDisk=Mount-VHD -Path $vhd -NoDriveLetter -PassThru -ErrorAction Stop
            $mounted=$true
            $disk=$mountedDisk | Get-Disk -ErrorAction Stop
            if(@($disk).Count -ne 1 -or $disk.IsBoot -or $disk.IsSystem){throw 'Refuse unexpected mounted disk identity'}
            if($disk.IsOffline){Set-Disk -Number $disk.Number -IsOffline $false -ErrorAction Stop}
            if($disk.IsReadOnly){throw 'Downloaded guest disk is read-only'}
            if($disk.PartitionStyle -eq 'GPT'){$report.generation=2}
            elseif($disk.PartitionStyle -eq 'MBR'){$report.generation=1}
            else{throw 'Unexpected guest partition layout'}
            $roots=@()
            foreach($part in @(Get-Partition -DiskNumber $disk.Number | Where-Object {$_.Size -gt 2GB})){
              if(-not $part.DriveLetter){
                Add-PartitionAccessPath -DiskNumber $disk.Number -PartitionNumber $part.PartitionNumber -AssignDriveLetter -ErrorAction Stop
                $part=Get-Partition -DiskNumber $disk.Number -PartitionNumber $part.PartitionNumber
              }
              if(-not $part.DriveLetter){continue}
              $root=([string]$part.DriveLetter)+':\'
              if(Test-Path -LiteralPath (Join-Path $root 'Windows\System32\ntoskrnl.exe')){$roots+=@($root)}
            }
            if($roots.Count -ne 1){throw 'Expected exactly one offline Windows installation'}
            $panther=Join-Path $roots[0] 'Windows\Panther\Unattend'
            $answer=Join-Path $panther 'Unattend.xml'
            if(Test-Path -LiteralPath $answer){throw 'Existing vendor answer file requires review; refuse overwrite'}
            New-Item -ItemType Directory -Path $panther -Force | Out-Null
            $xml=@"
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend">
            <settings pass="oobeSystem">
              <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <UserAccounts><AdministratorPassword><Value>$password</Value><PlainText>true</PlainText></AdministratorPassword></UserAccounts>
                <AutoLogon><Password><Value>$password</Value><PlainText>true</PlainText></Password><Enabled>true</Enabled><LogonCount>1</LogonCount><Username>Administrator</Username></AutoLogon>
                <OOBE><HideEULAPage>false</HideEULAPage><ProtectYourPC>3</ProtectYourPC></OOBE>
              </component>
            </settings>
          </unattend>
          "@
            [xml]$parsed=$xml
            Set-Content -LiteralPath $answer -Value $xml -Encoding UTF8 -ErrorAction Stop
            Dismount-VHD -Path $vhd -ErrorAction Stop
            $mounted=$false
            $report.stage='start_windows_guest'
            $vm=New-VM -Name $name -Generation $report.generation -MemoryStartupBytes 4GB -VHDPath $vhd -Path $dir -ErrorAction Stop
            $vm | Set-VMProcessor -Count 2 -ErrorAction Stop
            $vm | Set-VM -AutomaticCheckpointsEnabled $false -ErrorAction Stop
            $vm | Get-VMNetworkAdapter | Remove-VMNetworkAdapter -Confirm:$false -ErrorAction Stop
            $report.network_adapters=@($vm | Get-VMNetworkAdapter).Count
            if($report.network_adapters -ne 0){throw 'Guest network isolation failed'}
            Start-VM -VM $vm -ErrorAction Stop
            $session=Connect-Guest $vm.Id $credential 600
            $trial=$env:GITHUB_RUN_ID+'321'
            if($trial -cnotmatch '^[0-9]{14,18}$'){throw 'Unexpected trial identifier'}
            $checkedOut=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $checkedOut -cne $env:CANDIDATE_HEAD){throw 'Candidate source checkout mismatch'}
            # First boot of an evaluation image can register additional
            # Windows tasks. Give setup an independent clean boot BEFORE
            # taking the strict baseline; do not delete or exempt any task.
            if($env:VOLVE_GUEST_TRIAL -ceq 'strict-reboot'){
              $report.stage='warmup_clean_guest_boot'
              Invoke-Command -Session $session -ErrorAction Stop -ScriptBlock {
                $ErrorActionPreference='Stop'
                & shutdown.exe /s /t 5 /f
                if($LASTEXITCODE -ne 0){throw 'Guest warmup shutdown failed'}
              }
              Remove-PSSession $session
              $session=$null
              $limit=[datetime]::UtcNow.AddMinutes(4)
              while((Get-VM -Id $vm.Id -ErrorAction Stop).State -ne 'Off' -and [datetime]::UtcNow -lt $limit){Start-Sleep -Seconds 3}
              if((Get-VM -Id $vm.Id -ErrorAction Stop).State -ne 'Off'){throw 'Warmup shutdown not observed'}
              Start-VM -VM $vm -ErrorAction Stop
              $session=Connect-Guest $vm.Id $credential 360
              Start-Sleep -Seconds 60
            }
            # Prove Task Scheduler can execute an owned no-op as actual
            # LocalSystem before arming any recovery or injecting DNS faults.
            $report.stage='system_scheduler_preflight'
            $probe=Invoke-Command -Session $session -ArgumentList $trial -ErrorAction Stop -ScriptBlock {
              param($id)
              $ErrorActionPreference='Stop'
              $name='VOLVE-CI-SYSTEMProbe-'+$id
              $root=Join-Path $env:ProgramData $name
              if((Test-Path -LiteralPath $root) -or (Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue)){throw 'Probe identity collision'}
              New-Item -ItemType Directory -Path $root -ErrorAction Stop|Out-Null
              & icacls.exe $root '/inheritance:r' '/grant:r' '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'|Out-Null
              if($LASTEXITCODE -ne 0){throw 'Probe ACL failed'}
              & wevtutil.exe sl Microsoft-Windows-TaskScheduler/Operational /e:true
              if($LASTEXITCODE -ne 0){throw 'Task history unavailable'}
              $cmd=Join-Path $env:WINDIR 'System32\cmd.exe'
              $who=Join-Path $env:WINDIR 'System32\whoami.exe'
              $out=Join-Path $root 'sid.txt'
              $action=New-ScheduledTaskAction -Execute $cmd -Argument ('/d /c ""'+$who+'" /user /fo csv /nh > "'+$out+'""') -WorkingDirectory $root
              $principal=New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
              $settings=New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 2)
              Register-ScheduledTask -TaskName $name -TaskPath '\' -Action $action -Principal $principal -Settings $settings -ErrorAction Stop|Out-Null
              try{
                $start=Get-Date
                Start-ScheduledTask -TaskName $name -TaskPath '\' -ErrorAction Stop
                $limit=[datetime]::UtcNow.AddSeconds(90)
                do{
                  Start-Sleep -Seconds 2
                  $t=Get-ScheduledTask -TaskName $name -TaskPath '\' -ErrorAction Stop
                  $info=Get-ScheduledTaskInfo -TaskName $name -TaskPath '\' -ErrorAction Stop
                  if((Test-Path -LiteralPath $out) -and $t.State -ne 'Running'){break}
                }while([datetime]::UtcNow -lt $limit)
                $sidVerified=(Test-Path -LiteralPath $out) -and ((Get-Content -LiteralPath $out -Raw) -match '(?m),"S-1-5-18"\s*
                $events=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-TaskScheduler/Operational';StartTime=$start.AddSeconds(-5)} -MaxEvents 1000 -ErrorAction SilentlyContinue|Where-Object {
                  $xml=[xml]$_.ToXml()
                  @($xml.Event.EventData.Data|Where-Object {$_.Name -eq 'TaskName' -and $_.'#text' -ceq ('\'+$name)}).Count -gt 0
                }|ForEach-Object {[int]$_.Id})
                [pscustomobject]@{sid_verified=$sidVerified;last_result=[int64]$info.LastTaskResult;state=[string]$t.State;event_ids=@($events|Sort-Object -Unique);scheduler_service=[string](Get-Service Schedule).Status}
              }finally{
