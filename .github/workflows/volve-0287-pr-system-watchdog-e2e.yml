                if($owned.State -eq 'Running'){Stop-ScheduledTask -TaskName $task -TaskPath '\' -ErrorAction Stop}
                Unregister-ScheduledTask -TaskName $task -TaskPath '\' -Confirm:$false -ErrorAction Stop
