              $task='VOLVE-CI-GuestDNS-'+$id
              if(Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue){throw 'Task collision'}
              $runner=Join-Path $root 'run-test.cmd'
              $script=@'
          @echo off
          setlocal
          "%SystemRoot%\System32\whoami.exe" /user /fo csv /nh > "%~dp0started.txt" 2>&1
          if errorlevel 1 exit /b 91
          set "GITHUB_ACTIONS=true"
