            }
            $report.private_guest_dns_test_exit=$test.exit
            $report.private_guest_dns_scheduler=[ordered]@{system_sid_verified=$test.system_sid_verified;last_result=$test.last_result;state=$test.state;event_ids=$test.event_ids;correlated_event_chain=$test.correlated_event_chain}
