                    $proof=Get-OwnedManualTaskProof $task $cursor
                    if($proof.verified){break}
                  }
                }while([datetime]::UtcNow -lt $until)
                $proof=Get-OwnedManualTaskProof $task $cursor
                $log=Join-Path $root 'test.log'
                $output=if(Test-Path -LiteralPath $log){Get-Content -LiteralPath $log -Raw}else{''}
                $code=if(Test-Path -LiteralPath $exitFile){[int]([IO.File]::ReadAllText($exitFile))}else{-999}
                $started=Join-Path $root 'started.txt'
                $sidVerified=(Test-Path -LiteralPath $started) -and ((Get-Content -LiteralPath $started -Raw) -match '(?m),"S-1-5-18"\s*$')
                $info=Get-ScheduledTaskInfo -TaskName $task -TaskPath '\' -ErrorAction Stop
                $current=Get-ScheduledTask -TaskName $task -TaskPath '\' -ErrorAction Stop
                $events=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-TaskScheduler/Operational';StartTime=$startedAt.AddSeconds(-5)} -MaxEvents 1000 -ErrorAction SilentlyContinue|Where-Object {
                  $xml=[xml]$_.ToXml()
