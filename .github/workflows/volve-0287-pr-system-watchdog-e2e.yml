                }|ForEach-Object {[int]$_.Id})
                [pscustomobject]@{exit=$code;log=$output;system_sid_verified=$sidVerified;last_result=[int64]$info.LastTaskResult;state=[string]$current.State;event_ids=@($events|Sort-Object -Unique);correlated_event_chain=$proof}
              }finally{
