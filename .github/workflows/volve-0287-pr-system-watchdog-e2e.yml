                  $info=Get-ScheduledTaskInfo -TaskName $taskName -TaskPath '\' -ErrorAction Stop
                  $boot=(Get-CimInstance Win32_OperatingSystem).LastBootUpTime
                  $events=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-TaskScheduler/Operational';StartTime=$boot.AddSeconds(-5)} -MaxEvents 2000 -ErrorAction SilentlyContinue|Where-Object {
                    $xml=[xml]$_.ToXml()
                    @($xml.Event.EventData.Data|Where-Object {$_.Name -eq 'TaskName' -and $_.'#text' -ceq ('\'+$taskName)}).Count -gt 0
                  }|ForEach-Object {[int]$_.Id})
                  $journalStatus='unavailable'
                  $journal=Join-Path $dir ('VOLVE-CI-BOOT-'+$id+'\recovery.json')
                  $helper=Join-Path $dir 'volve-journal-lab.exe'
                  if((Test-Path -LiteralPath $journal) -and (Test-Path -LiteralPath $helper)){
                    $value=& $helper status $journal
                    if($LASTEXITCODE -eq 0 -and $value -match '^(ROLLBACK_REQUIRED|NO_ROLLBACK:restored)$'){$journalStatus=$value}
                  }
                  [pscustomobject]@{
                    watchdog_state=[string]$task.State
                    watchdog_last_result=[int64]$info.LastTaskResult
                    watchdog_last_run_after_boot=($info.LastRunTime -ge $boot.AddSeconds(-5))
                    watchdog_event_ids=@($events|Sort-Object -Unique)
                    recovery_journal_status=$journalStatus
                    before=@($old.taskRecords).Count;after=@($new.taskRecords).Count
                    added=@($added|ForEach-Object {& $classify $_})
                    removed=@($removed|ForEach-Object {& $classify $_})
                    changed=@($changed|ForEach-Object {Get-VolvVMBaselineTaskDriftHint -ExpectedRecord $left[$_] -ActualRecord $right[$_]})
                    hosts_equal=($old.hostsSha256 -ceq $new.hostsSha256)
                    dns_equal=(($old.dnsRecords -join '|') -ceq ($new.dnsRecords -join '|'))
                    recovery_marker_present=(Test-Path -LiteralPath $marker)
                    failure_marker_present=(Test-Path -LiteralPath $failed)
                  }
                }
              }catch{$report.environment_diagnostic_error=$_.Exception.Message}
            }
          }finally{
            try{
              if($session){Remove-PSSession $session -ErrorAction SilentlyContinue}
              if($mounted){Dismount-VHD -Path $vhd -ErrorAction Stop}
              if($vm){
                $owned=Get-VM -Id $vm.Id -ErrorAction Stop
                if($owned.Name -cne $name){throw 'Unexpected VM identity'}
                if($owned.State -ne 'Off'){Stop-VM -VM $owned -TurnOff -Force -ErrorAction Stop}
                Remove-VM -VM $owned -Force -ErrorAction Stop
              }
              if($privateSwitch){
                $ownedSwitch=Get-VMSwitch -Id $privateSwitch.Id -ErrorAction Stop
                if($ownedSwitch.Name -cne ($name+'-PRIVATE') -or [string]$ownedSwitch.SwitchType -cne 'Private'){throw 'Unexpected private switch identity'}
                Remove-VMSwitch -VMSwitch $ownedSwitch -Force -ErrorAction Stop
              }
              if(Test-Path -LiteralPath $dir){Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction Stop}
              $report.cleanup_ok=$true
            }catch{$report.cleanup_error=$_.Exception.Message}
            $json=ConvertTo-Json -InputObject $report -Depth 4 -Compress
            Write-Host "VOLVE_WINDOWS_GUEST_REBOOT_RESULT=$json"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $json
          }
          if(-not $report.cleanup_ok){throw 'Guest cleanup failed'}
          if($report.error_message){throw ('Guest test failed in '+$report.stage+': '+$report.error_message)}
          if($env:VOLVE_GUEST_TRIAL -ceq 'strict-reboot'){
            if(-not $report.disk_persistence_verified){throw 'Guest persistence not demonstrated'}
            if(-not $report.recovery_kit_verified -or -not $report.recovery_kit_cleanup_verified){throw 'Strict SYSTEM recovery kit not fully verified'}
            Write-Host 'PASS: real guest reboot + strict SYSTEM task fixture recovery; NO DNS TEST NO INSTALL.'
          }else{
            if(-not $report.private_guest_dns_verified){throw 'Private guest signed native DNS test not proven'}
            Write-Host 'PASS: real signed native SYSTEM DNS slice; NO DNS REBOOT, NO REAL MOTOR, NO CONNECTIVITY PROOF, NO INSTALL.'
          }
