                  $changed=@($left.Keys|Where-Object {$right.ContainsKey($_) -and $left[$_] -cne $right[$_]}|Sort-Object)
                  $classify={param($name) [pscustomobject]@{id=(Get-VolvVMBaselineSha -Value $name).Substring(0,16);scope=$(if($name.StartsWith('\Microsoft\Windows\',[StringComparison]::OrdinalIgnoreCase)){'microsoft-windows'}else{'other'})}}
