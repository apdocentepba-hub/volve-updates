name: VOLVE 0.28.7 REAL disposable SYSTEM task + file restore (NO RELEASE)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/inapp/watchdogcmd/resident_post_switch_file_task_ci_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_post_switch_file_task_ci_windows_test.go'
      - 'development/0.28.7/inapp/watchdogcmd/main_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_pilot_restore_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_pilot_restore_windows_test.go'
      - 'development/0.28.7/inapp/apply_overlay.go'
      - '.github/workflows/volve-0287-real-system-task-file-restore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-disposable-system-restore:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Reconstruct authenticated source and apply reviewed code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, shutil
          base=Path("development/0.28.7")
          parts=sorted((base/"complete-source-parts").glob("part-*.bin"))
          assert len(parts)==10 and [p.name for p in parts]==[f"part-{i:02d}.bin" for i in range(10)]
          data=b"".join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=="92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5"
          Path("source.zip").write_bytes(data)
          Path("build").mkdir(exist_ok=True)
          with zipfile.ZipFile("source.zip") as z:z.extractall("build")
          patches=[
            ("VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip","fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd"),
            ("VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip","773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40"),
          ]
          for name,digest in patches:
            file=base/name
            assert hashlib.sha256(file.read_bytes()).hexdigest()==digest
            with zipfile.ZipFile(file) as z:z.extractall("build")
          for file in (base/"journal").glob("*.go"):
            shutil.copy2(file,Path("build/codigo/motorupdate")/file.name)
          print("Verified source and both rollback overlays; no production installation.")
          PY
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
      - name: Compile a separate CI watchdog EXE (no test-runner child)
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Standalone recovery restricted to disposable GitHub Windows VM'}
          $out=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_Standalone_Recovery_Watchdog.exe'
          go build -trimpath -o $out ./cmd/volve-managed-watchdog
          if($LASTEXITCODE -ne 0){throw 'Independent watchdog EXE failed to compile'}
          if(-not (Test-Path -LiteralPath $out -PathType Leaf)){throw 'Independent watchdog EXE is absent'}
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash
          if((Get-Item -LiteralPath $out).Length -lt 100000){throw 'Invalid compiled watchdog size'}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('VOLVE_CI_STANDALONE_RECOVERY_EXE='+$out)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'VOLVE_CI_REQUIRE_STANDALONE=1'
          Write-Host ('PASS: separate compiled Windows CI watchdog created, SHA256='+$hash)
      - name: Recreate actual missing old EXE and restore genuine disposable SYSTEM task
        shell: bash
        working-directory: build/codigo
        run: |
          test -f cmd/volve-managed-watchdog/resident_post_switch_file_task_ci_windows.go
          test -f cmd/volve-managed-watchdog/resident_post_switch_file_task_ci_windows_test.go
          go test ./cmd/volve-managed-watchdog -run '^(TestPostSwitchSystemTask|TestStandaloneCIRecoveryCLI|TestResidentPilotRecoveryScriptBindsLiveTaskAndBackup)' -count=1 -timeout 6m -v
          echo 'PASS: compiled independent watchdog executable restored the actual disposable SYSTEM task twice, rejected tampered arguments; no product tasks or DNS adapters changed.'
