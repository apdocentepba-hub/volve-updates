name: VOLVE 0.28.7 Windows installed-task inventory READ ONLY (NO RELEASE)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/inapp/fresh_task_inventory_windows.go'
      - 'development/0.28.7/inapp/fresh_task_inventory_windows_test.go'
      - 'development/0.28.7/inapp/fresh_install_policy.go'
      - 'development/0.28.7/inapp/fresh_install_policy_test.go'
      - '.github/workflows/volve-0287-fresh-task-inventory-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-task-inspection:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify exactly scoped Go sources and run native Windows read-only task inventory
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:GO111MODULE='off'
          $files=@(
            'development/0.28.7/inapp/fresh_install_policy.go',
            'development/0.28.7/inapp/fresh_install_policy_test.go',
            'development/0.28.7/inapp/fresh_task_inventory_windows.go',
            'development/0.28.7/inapp/fresh_task_inventory_windows_test.go'
          )
          foreach($file in $files){
            if(-not (Test-Path -LiteralPath $file -PathType Leaf)){
              throw ('Required read-only inventory source missing: '+$file)
            }
          }
          go test -count=1 -timeout 3m -v @files
          if($LASTEXITCODE -ne 0){throw 'Read-only live Task Scheduler inventory or strict fresh-motor classification FAILED'}
          Write-Host 'PASS: real Windows Task Scheduler read-only inventory + strict catalog-only/motor task tests. NO DNS, installation or task mutation.'
