name: VOLVE 0.28.7 REAL motor VM preboot test (NO REBOOT / NO RELEASE)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/lab/vm_full_motor_reboot_dns.ps1'
      - 'development/0.28.7/lab/live_dns_boot_event_chain.ps1'
      - 'development/0.28.7/inapp/ci_fresh_dns53_windows.go'
      - 'development/0.28.7/inapp/apply_overlay.go'
      - '.github/workflows/volve-0287-vm-full-dns-preboot-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vm-full-motor-preboot:
    runs-on: windows-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Rebuild authenticated complete VOLVE source, no production release
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, zipfile, shutil
          from pathlib import Path
          root=Path("development/0.28.7")
          parts=sorted((root/"complete-source-parts").glob("part-*.bin"))
          assert [p.name for p in parts]==[f"part-{i:02d}.bin" for i in range(10)]
          data=b"".join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=="92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5"
          Path("source.zip").write_bytes(data)
          Path("build").mkdir(exist_ok=True)
          with zipfile.ZipFile("source.zip") as z:z.extractall("build")
          for name,sha in [
            ("VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip","fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd"),
            ("VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip","773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40"),
          ]:
            p=root/name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
            with zipfile.ZipFile(p) as z:z.extractall("build")
          for p in (root/"journal").glob("*.go"):
            shutil.copy2(p,Path("build/codigo/motorupdate")/p.name)
          PY
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
      - name: Build the REAL CI-tagged FULL motor, not a DNS imitation
        shell: powershell
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          go build -tags volveci -trimpath -o "$env:RUNNER_TEMP\VOLVE_CI_FreshDNS53.exe" .
          if($LASTEXITCODE -ne 0){throw 'Full VOLVE motor build failed'}
          $file=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_FreshDNS53.exe'
          if((Get-Item -LiteralPath $file).Length -lt 1048576){throw 'Motor too short'}
      - name: Stage actual SYSTEM startup full DNS, prove IPv4+IPv6, reject fake reboot and clean
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){
            throw 'Not an ephemeral GitHub-hosted Windows VM'
          }
          $run=$env:GITHUB_RUN_ID
          $task='VOLVE-CI-FreshMotor-'+$run
          $root=Join-Path $env:ProgramData ('VOLVE-CI-FreshDNS53-'+$run)
          $exe=Join-Path $root 'VOLVE_CI_FreshDNS53.exe'
          $script='development/0.28.7/lab/vm_full_motor_reboot_dns.ps1'
          $motor=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_FreshDNS53.exe'
          $dnsBefore=(Get-DnsClientServerAddress|Sort-Object InterfaceIndex,AddressFamily |
            Select-Object InterfaceIndex,AddressFamily,ServerAddresses|ConvertTo-Json -Depth 6 -Compress)
          $hosts=Join-Path $env:WINDIR 'System32\drivers\etc\hosts'
          $hostsBefore=([Security.Cryptography.SHA256]::Create()).ComputeHash([IO.File]::ReadAllBytes($hosts))
          # Hosted runners may disable this event log. Enable it ONLY for our
          # ephemeral lab and restore its original setting in finally.
          $eventLog='Microsoft-Windows-TaskScheduler/Operational'
          $logWasEnabled=(Get-WinEvent -ListLog $eventLog -ErrorAction Stop).IsEnabled
          if(-not $logWasEnabled){
            & wevtutil.exe sl $eventLog /e:true
            if($LASTEXITCODE -ne 0){throw 'Unable to enable disposable CI Task Scheduler history'}
          }
          try{
            & $script -Mode Probe
            & $script -Mode Prepare -LabId $run -MotorExe $motor
            $refused=$false
            try{& $script -Mode Verify -LabId $run}catch{
              if($_.Exception.Message -match '^NOT VERIFIED: Windows did not reboot'){$refused=$true}
              else{throw}
            }
            if(-not $refused){throw 'A manual test without reboot was falsely certified'}
            $evidence=Join-Path $root 'boot-dns-before.json'
            if(-not (Test-Path -LiteralPath $evidence -PathType Leaf)){throw 'No preboot proof packet'}
            & $script -Mode Cleanup -LabId $run
            Write-Host 'PASS: real full VOLVE dual-stack DNS53 under disposable SYSTEM task, catalog 400005 records, no reboot not certified, task removed'
          }finally{
            $existing=Get-ScheduledTask -TaskName $task -TaskPath '\' -ErrorAction SilentlyContinue
            if($null -ne $existing){
              if($existing.Principal.UserId -notin @('SYSTEM','S-1-5-18') -or
                @($existing.Actions).Count -ne 1 -or
                [string]$existing.Actions[0].Execute -ine $exe){
                throw 'Cannot safely clean an unexpected CI task'
              }
              if($existing.State -eq 'Running'){Stop-ScheduledTask -TaskName $task -ErrorAction Stop}
              Unregister-ScheduledTask -TaskName $task -TaskPath '\' -Confirm:$false -ErrorAction Stop
            }
            $left=@(Get-CimInstance Win32_Process|Where-Object{
              [string]$_.ExecutablePath -ieq $exe
            })
            if($left.Count -ne 0){throw 'CI-owned DNS service survived task cleanup'}
            $dnsAfter=(Get-DnsClientServerAddress|Sort-Object InterfaceIndex,AddressFamily |
              Select-Object InterfaceIndex,AddressFamily,ServerAddresses|ConvertTo-Json -Depth 6 -Compress)
            if($dnsAfter -cne $dnsBefore){throw 'FATAL: DNS adapter state changed'}
            $hostsAfter=([Security.Cryptography.SHA256]::Create()).ComputeHash([IO.File]::ReadAllBytes($hosts))
            if([BitConverter]::ToString($hostsAfter) -cne [BitConverter]::ToString($hostsBefore)){
              throw 'FATAL: Windows hosts changed'
            }
            if(-not $logWasEnabled){
              & wevtutil.exe sl $eventLog /e:false
              if($LASTEXITCODE -ne 0){throw 'Could not restore original disposable event history setting'}
            }
          }
