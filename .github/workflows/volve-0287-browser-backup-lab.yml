name: VOLVE browser original policy local backup (READ ONLY NO INSTALL)
on:
  push:
    branches: [work/0287-browser-backup-capture-20261126]
    paths:
      - '.github/workflows/volve-0287-browser-backup-lab.yml'
      - 'development/0.28.7/inapp/browser_policy_inventory_windows.go'
      - 'development/0.28.7/inapp/browser_policy_inventory_windows_test.go'
permissions:
  contents: read
jobs:
  browser-backup:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Reconstruct and verify full VOLVE Go source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=@(Get-ChildItem 'development/0.28.7/complete-source-parts' -Filter 'part-*.bin' | Sort-Object Name)
          if($parts.Count -ne 10){throw 'Source archive part count'}
          $dest=[IO.File]::Create((Join-Path (Get-Location) 'source.zip'))
          try {
            for($i=0;$i -lt 10;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Source archive order'}
              $src=[IO.File]::OpenRead($parts[$i].FullName)
              try{$src.CopyTo($dest)}finally{$src.Dispose()}
            }
          }finally{$dest.Dispose()}
          if((Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw 'Source SHA256 mismatch'}
          Expand-Archive source.zip -DestinationPath build -Force
          $old='development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip'
          if((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'){throw 'Preflight ZIP SHA256 mismatch'}
          Expand-Archive $old -DestinationPath build -Force
          Copy-Item development/0.28.7/journal/*.go build/codigo/motorupdate/ -Force
          $recovery='development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip'
          if((Get-FileHash $recovery -Algorithm SHA256).Hash.ToLowerInvariant() -ne '773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'){throw 'Recovery ZIP SHA256 mismatch'}
          Expand-Archive $recovery -DestinationPath build -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Source overlay failed'}
      - name: Verify three local policy captures without registry writes
        working-directory: build/codigo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $result=@(go test ./motorupdate -run '^TestVOLVEBrowser(Policy|OriginalCapture|OriginalArchive|OriginalPair|OriginalTriple)' -count=1 -v -timeout 5m)
          $exit=$LASTEXITCODE
          $result|Write-Host
          if($exit -ne 0){throw 'Browser capture regression failed'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestVOLVEBrowserOriginalCapture'}).Count -ne 3){throw 'Expected exactly three new capture tests'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_BROWSER_ORIGINAL_THREE_KEYS_NATIVE_READ_ONLY'}).Count -ne 1){throw 'Missing native observation'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestVOLVEBrowserOriginalArchive'}).Count -ne 3){throw 'Expected three archive tests'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_BROWSER_ARCHIVE_REAL_NTFS_FIXTURE'}).Count -ne 1){throw 'Missing real NTFS fixture evidence'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestVOLVEBrowserOriginalPair'}).Count -ne 2){throw 'Expected two paired backup tests'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_ORIGINAL_PAIR_REAL_NTFS_NO_INSTALL'}).Count -ne 1){throw 'Missing paired backup native evidence'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestVOLVEBrowserOriginalTriple'}).Count -ne 2){throw 'Expected two DNS baseline integration tests'}
