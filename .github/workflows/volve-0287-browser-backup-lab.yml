name: VOLVE browser original policy local backup (READ ONLY NO INSTALL)
on:
  push:
    branches: [work/0287-browser-backup-capture-20261126]
    paths:
      - '.github/workflows/volve-0287-browser-backup-lab.yml'
      - 'development/0.28.7/inapp/browser_policy_inventory_windows.go'
      - 'development/0.28.7/inapp/browser_policy_inventory_windows_test.go'
      - 'development/0.28.7/inapp/fresh_task_inventory_windows.go'
      - 'development/0.28.7/inapp/fresh_task_inventory_windows_test.go'
permissions:
  contents: read
jobs:
  browser-backup:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Reconstruct and verify full VOLVE Go source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=@(Get-ChildItem 'development/0.28.7/complete-source-parts' -Filter 'part-*.bin' | Sort-Object Name)
          if($parts.Count -ne 10){throw 'Source archive part count'}
          $dest=[IO.File]::Create((Join-Path (Get-Location) 'source.zip'))
          try {
            for($i=0;$i -lt 10;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Source archive order'}
              $src=[IO.File]::OpenRead($parts[$i].FullName)
              try{$src.CopyTo($dest)}finally{$src.Dispose()}
            }
          }finally{$dest.Dispose()}
          if((Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw 'Source SHA256 mismatch'}
          Expand-Archive source.zip -DestinationPath build -Force
          $old='development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip'
          if((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'){throw 'Preflight ZIP SHA256 mismatch'}
          Expand-Archive $old -DestinationPath build -Force
          Copy-Item development/0.28.7/journal/*.go build/codigo/motorupdate/ -Force
          $recovery='development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip'
          if((Get-FileHash $recovery -Algorithm SHA256).Hash.ToLowerInvariant() -ne '773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'){throw 'Recovery ZIP SHA256 mismatch'}
          Expand-Archive $recovery -DestinationPath build -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Source overlay failed'}
      - name: Verify read-only policy captures and isolated synthetic HKCU reconstruction
        working-directory: build/codigo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $result=@(go test ./motorupdate -run '^TestVOLVEBrowser(Policy|OriginalCapture|OriginalArchive|OriginalPair|OriginalTriple|OriginalDecode)' -count=1 -v -timeout 5m)
          $exit=$LASTEXITCODE
          $result|Write-Host
          if($exit -ne 0){throw 'Browser capture regression failed'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestVOLVEBrowserOriginalCapture'}).Count -ne 3){throw 'Expected exactly three new capture tests'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_BROWSER_ORIGINAL_THREE_KEYS_NATIVE_READ_ONLY'}).Count -ne 1){throw 'Missing native observation'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestVOLVEBrowserOriginalArchive'}).Count -ne 3){throw 'Expected three archive tests'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_BROWSER_ARCHIVE_REAL_NTFS_FIXTURE'}).Count -ne 1){throw 'Missing real NTFS fixture evidence'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestVOLVEBrowserOriginalPair'}).Count -ne 2){throw 'Expected two paired backup tests'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_ORIGINAL_PAIR_REAL_NTFS_NO_INSTALL'}).Count -ne 1){throw 'Missing paired backup native evidence'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestVOLVEBrowserOriginalTriple'}).Count -ne 2){throw 'Expected two DNS baseline integration tests'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestVOLVEBrowserOriginalDecode'}).Count -ne 4){throw 'Expected four typed browser backup decode tests'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_BROWSER_SYNTHETIC_HKCU_REGSZ_ROUNDTRIP_AND_CLEANUP'}).Count -ne 1){throw 'Missing native synthetic registry roundtrip evidence'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_BROWSER_NATIVE_CAPTURE_FORMAT_SYNTHETIC_THREE_STATES'}).Count -ne 1){throw 'Missing native capture format reconstruction evidence'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_BROWSER_SYNTHETIC_REBUILD_INDEPENDENT_FINGERPRINT_AND_CLEANUP'}).Count -ne 1){throw 'Missing independent native reconstruction and cleanup evidence'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_BROWSER_ARCHIVE_TO_NATIVE_REBUILD_NTFS'}).Count -ne 1){throw 'Missing persistent browser archive reconstruction evidence'}
      - name: Verify catalog original XML capture against independently observed definition
        working-directory: build/codigo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $result=@(go test ./motorupdate -run '^TestWindowsOriginalCatalog(Capture|Archive)' -count=1 -v -timeout 5m)
          $exit=$LASTEXITCODE
          $result|Write-Host
          if($exit -ne 0){throw 'Catalog capture failed'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestWindowsOriginalCatalogCapture'}).Count -ne 2){throw 'Expected two catalog capture tests'}
          if(@($result|Where-Object {$_ -match '^--- PASS: TestWindowsOriginalCatalogArchive'}).Count -ne 5){throw 'Expected five catalog archive tests'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_CATALOG_ARCHIVE_REAL_NTFS_FIXTURE_NO_TASK_WRITES'}).Count -ne 1){throw 'Missing real catalog archive NTFS evidence'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FOUR_ORIGINAL_ARCHIVES_FIXTURE_REVIEW_NO_AUTHORIZATION'}).Count -ne 1){throw 'Missing four-component fixture review'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FOUR_ARCHIVES_REAL_NTFS_DISPLAY_ONLY'}).Count -ne 1){throw 'Missing native four-archive display review'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_ACTUAL_NATIVE_ORIGINALS_ARCHIVED_AND_RECENSUSED_NO_OS_WRITES'}).Count -ne 1){throw 'Missing actual native originals before/after evidence'}
          if(@($result|Where-Object {$_ -match 'PASS VOLVE_FOUR_ARCHIVES_REJECT_DRIFT_DURING_CATALOG_REVIEW'}).Count -ne 1){throw 'Missing archive drift rejection evidence'}
      - name: Reimport inert synthetic task XML and verify cleanup (hosted lab only)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'Hosted runner only'}
          $vm=Get-CimInstance Win32_ComputerSystem
          if(($vm.Manufacturer+' '+$vm.Model) -notmatch '(?i)virtual machine|hyper-v|vmware|qemu|kvm'){throw 'Disposable VM not verified'}
          $name='VOLVE-LAB-CATALOG-'+[Guid]::NewGuid().ToString('N')
          function ReadFixture {
            @(Get-ScheduledTask -TaskPath '\' -ErrorAction Stop | Where-Object {$_.TaskName -ceq $name})
          }
          if(@(ReadFixture).Count -ne 0){throw 'Synthetic task name collision'}
          $exe=Join-Path $env:SystemRoot 'System32\cmd.exe'
          $arguments='/d /c exit 0'
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=New-ScheduledTaskPrincipal -UserId $identity.Name -LogonType Interactive -RunLevel Limited
          $action=New-ScheduledTaskAction -Execute $exe -Argument $arguments
          $settings=New-ScheduledTaskSettingsSet -Disable -DisallowDemandStart
          $definition=New-ScheduledTask -Action $action -Principal $principal -Settings $settings
          function InspectFixture {
            $rows=@(ReadFixture)
            if($rows.Count -ne 1){throw 'Synthetic task identity missing or ambiguous'}
            $task=$rows[0]
            if([string]$task.State -ne 'Disabled' -or $task.Settings.Enabled -ne $false -or $task.Settings.AllowDemandStart -ne $false){throw 'Synthetic task is not inert'}
            if(@($task.Triggers|Where-Object {$_}).Count -ne 0 -or @($task.Actions).Count -ne 1){throw 'Synthetic task structure changed'}
            if($task.Actions[0].Execute -ine $exe -or $task.Actions[0].Arguments -cne $arguments){throw 'Synthetic task action changed'}
            $sid=([Security.Principal.NTAccount]$task.Principal.UserId).Translate([Security.Principal.SecurityIdentifier]).Value
            if($sid -ne $identity.User.Value -or [string]$task.Principal.LogonType -ne 'Interactive' -or [string]$task.Principal.RunLevel -ne 'Limited'){throw 'Synthetic principal changed'}
            $xml=Export-ScheduledTask -TaskName $name -TaskPath '\' -ErrorAction Stop
            if([string]::IsNullOrWhiteSpace($xml)){throw 'Synthetic task XML unavailable'}
            return [string]$xml
          }
          $passed=$false
          $archiveDir=Join-Path $env:RUNNER_TEMP ('volve-catalog-xml-'+[Guid]::NewGuid().ToString('N'))
          $archiveCreated=$false
          try{
            if(Test-Path -LiteralPath $archiveDir){throw 'Synthetic archive collision'}
            New-Item -ItemType Directory -Path $archiveDir -ErrorAction Stop | Out-Null
            $archiveCreated=$true
            $archiveFile=Join-Path $archiveDir 'catalog.xml'
            $utf8=New-Object System.Text.UTF8Encoding($false,$true)
            Register-ScheduledTask -TaskName $name -TaskPath '\' -InputObject $definition -ErrorAction Stop | Out-Null
            $original=InspectFixture
            $sha=[Security.Cryptography.SHA256]::Create()
            try{
              $pin=[Convert]::ToBase64String($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($original)))
              $bytes=$utf8.GetBytes($original)
              $stream=[IO.File]::Open($archiveFile,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
              try{$stream.Write($bytes,0,$bytes.Length);$stream.Flush($true)}finally{$stream.Dispose()}
              $original=$null;$bytes=$null
              Unregister-ScheduledTask -TaskName $name -TaskPath '\' -Confirm:$false -ErrorAction Stop
              if(@(ReadFixture).Count -ne 0){throw 'Synthetic task removal not verified'}
              $diskBytes=[IO.File]::ReadAllBytes($archiveFile)
              if($diskBytes.Length -lt 1 -or $diskBytes.Length -gt 1048576){throw 'Synthetic archive size invalid'}
              if([Convert]::ToBase64String($sha.ComputeHash($diskBytes)) -cne $pin){throw 'Synthetic disk archive changed'}
              $fromDisk=$utf8.GetString($diskBytes)
              Register-ScheduledTask -TaskName $name -TaskPath '\' -Xml $fromDisk -ErrorAction Stop | Out-Null
              $recovered=InspectFixture
              $pin2=[Convert]::ToBase64String($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($recovered)))
              if($pin -cne $pin2){throw 'Task Scheduler normalized or changed exported XML; exact reconstruction not verified'}
              $passed=$true
            }finally{$sha.Dispose()}
          }finally{
            if(@(ReadFixture).Count -eq 1){Unregister-ScheduledTask -TaskName $name -TaskPath '\' -Confirm:$false -ErrorAction Stop}
            if(@(ReadFixture).Count -ne 0){throw 'Synthetic task cleanup failed'}
            if($archiveCreated){Remove-Item -LiteralPath $archiveFile -ErrorAction SilentlyContinue;Remove-Item -LiteralPath $archiveDir -ErrorAction Stop;if(Test-Path -LiteralPath $archiveDir){throw 'Synthetic archive cleanup failed'}}
            $identity.Dispose()
          }
          if(!$passed){throw 'Synthetic task reconstruction unverified'}
          Write-Host 'PASS VOLVE_SYNTHETIC_CATALOG_XML_DISK_REIMPORT_AND_CLEANUP'
          Write-Host 'PASS VOLVE_SYNTHETIC_CATALOG_XML_REIMPORT_AND_CLEANUP'
