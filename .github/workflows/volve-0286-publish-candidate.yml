name: Publicar candidato VOLVE v0.28.6

on:
  push:
    paths:
      - 'release-candidates/v0.28.6/parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruir ejecutable desde bloques verificados
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "release-candidates/v0.28.6/parts"
          $parts = @(Get-ChildItem -LiteralPath $dir -Filter 'part-*.bin' -File | Sort-Object Name)
          if ($parts.Count -ne 29) { throw "Expected 29 parts; got $($parts.Count)" }
          for ($i = 0; $i -lt 29; $i++) {
            if ($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)) { throw "Missing or out-of-order block $i" }
          }
          $target = "release-candidates/v0.28.6/VOLVE_0_28_6_CENTRO.exe"
          $out = [IO.File]::Create($target)
          try {
            foreach ($p in $parts) {
              $inputStream = [IO.File]::OpenRead($p.FullName)
              try { $inputStream.CopyTo($out) } finally { $inputStream.Dispose() }
            }
          } finally { $out.Dispose() }
      - name: Verificar formato PE, tamaño y SHA-256 exactos
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = "release-candidates/v0.28.6/VOLVE_0_28_6_CENTRO.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLowerInvariant()
          if ($hash -ne "8659d948427e515e3471508487c81afadb6c9cecfd3633aedc6ea67459f1d72a") { throw "SHA256 mismatch" }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
          if ($bytes.Length -ne 14858240 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "invalid Windows PE" }
          Write-Host "Exact signed-manifest target bytes verified"
      - name: Prueba no destructiva del comando de consulta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = (Resolve-Path "release-candidates/v0.28.6/VOLVE_0_28_6_CENTRO.exe").Path
          $p = Start-Process -FilePath $f -ArgumentList '--check-app-updates' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Updater check failed: $($p.ExitCode)" }
          Write-Host "Updater check finished; no DNS installation requested"
      - name: Crear pre-release inmutable, sin activar canal stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.28.6"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release exists; refusing overwrite" }
          gh release create $tag "release-candidates/v0.28.6/VOLVE_0_28_6_CENTRO.exe" --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" --title "VOLVÉ 0.28.6 (piloto de auto-actualización)" --notes "Versión de prueba para validar el botón Actualizar VOLVÉ desde 0.28.5. Solo modifica el Centro de protección. El canal releases/stable.json permanece inactivo hasta comprobar la instalación."
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
