name: VOLVE 0.28.7 in-app updater integration inspect (NO release)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths: ['.github/workflows/volve-0287-inapp-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild authenticated development sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts=sorted(Path('development/0.28.7/complete-source-parts').glob('part-*.bin'))
          assert len(parts)==10
          with open('source.zip','wb') as out:
              for i,p in enumerate(parts):
                  assert p.name==f'part-{i:02d}.bin'
                  out.write(p.read_bytes())
          assert hashlib.sha256(Path('source.zip').read_bytes()).hexdigest()=='92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'
          PY
          mkdir src && unzip -q source.zip -d src
          unzip -q -o development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip -d src
          unzip -q -o development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip -d src
      - name: Print targeted updater sources (no user data, no secrets)
        shell: bash
        run: |
          echo '===== VERSION CONSTANTS AND CLI ====='
          grep -RnE --include='*.go' '(^const version|^var version|version = "0\\.28|version[[:space:]]*=[[:space:]]*"0\\.28)' src/codigo | head -30 || true
          for file in motorupdate/manifest.go motorupdate/stage.go motorupdate/transaction.go panel_windows.go main_windows.go; do
            echo "===== SOURCE FILE $file ====="
            case "$file" in
              panel_windows.go) sed -n '130,225p;395,475p' "src/codigo/$file";;
              main_windows.go) sed -n '490,560p' "src/codigo/$file";;
              *) sed -n '1,245p' "src/codigo/$file";;
            esac
          done

      - name: Inspect read-only Windows motor service definitions for driver design
        shell: bash
        run: |
          echo '=== Preflight and DNS engine task references (filtered) ==='
          grep -RnE --include='*.go' 'MotorUpgrade|motorUpgrade|VOLVE.*Motor|VOLVE.*DNS|TaskName|ServiceName|taskName|taskname' src/codigo | head -115 || true
          echo '=== Preflight file ==='
          find src/codigo -iname '*motor*preflight*' -o -iname 'motor_update_preflight_windows.go' | while read -r f; do
            echo "==== $f ===="
            sed -n '1,280p' "$f"
          done
          echo '=== Existing engine installation references ==='
          grep -RnE --include='*.go' 'schtasks|Register-ScheduledTask|New-ScheduledTask|VOLVE_DNS|dnsMotor|motorDNS' src/codigo | head -95 || true

      - name: Inspect DNS source motor binary and boot identity
        shell: bash
        run: |
          echo '===== DNS SERVICE BINARY ORIGIN ====='
          sed -n '1,106p;235,365p;450,515p' src/codigo/dnsprod_windows.go
          echo '===== REFERENCE PE SHA256 AND SIZE ====='
          find src/codigo/assets -maxdepth 1 -type f -name '*DNS*' -printf '%f %s bytes\n' || true
          sha256sum src/codigo/assets/VOLVE_DNS_Server_0270.exe || true
          echo '===== SERVICE CONFIG AND DNS CHECK ====='
          grep -RnE 'func checkDNSLocal|func expectedRescueArgs|func taskQuery|func installRoot|func taskRestore|func psQuote' src/codigo --include='*.go' | head -45
