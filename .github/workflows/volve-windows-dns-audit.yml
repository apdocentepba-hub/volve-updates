name: VOLVE Windows DNS preflight read-only
on:
  push:
    paths:
      - .github/workflows/volve-windows-dns-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Windows DNS cmdlets and interface identity WITHOUT changing DNS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('Get-NetAdapter','Get-DnsClientServerAddress','Set-DnsClientServerAddress')) {
            $cmd=Get-Command $name -ErrorAction Stop
            Write-Output "$name available in $($cmd.ModuleName)"
          }
          $live=@(Get-NetAdapter -ErrorAction Stop | Where-Object {$_.Status -eq 'Up'})
          Write-Output "Active adapters: $($live.Count)"
          $physical=@($live | Where-Object {$_.HardwareInterface})
          Write-Output "Active physical adapters: $($physical.Count)"
          if($physical.Count -eq 0){throw 'no physical adapter on Windows runner'}
          $checked=0
          foreach($a in $physical) {
            if($null -eq (Get-NetIPInterface -InterfaceIndex ([int]$a.ifIndex) -AddressFamily IPv4 -ErrorAction SilentlyContinue)) {
              Write-Output "Skipping adapter without a registered IPv4 interface"; continue
            }
            $guid=([string]$a.InterfaceGuid).Trim('{','}')
            $index=[int]$a.ifIndex
            if($index -le 0 -or $guid.Length -lt 20){throw 'invalid adapter identity'}
            $v4=@((Get-DnsClientServerAddress -InterfaceIndex $index -AddressFamily IPv4 -ErrorAction Stop).ServerAddresses | Where-Object {$_})
            $v6=@((Get-DnsClientServerAddress -InterfaceIndex $index -AddressFamily IPv6 -ErrorAction Stop).ServerAddresses | Where-Object {$_})
            Write-Output "Adapter interface index=$index v4Servers=$($v4.Count) v6Servers=$($v6.Count) physical=$($a.HardwareInterface)"
            $regPath="HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\{$guid}"
            $reg4=Get-ItemProperty -LiteralPath $regPath -ErrorAction Stop
            $mode=if(![string]::IsNullOrWhiteSpace([string]$reg4.NameServer)){'manual'}else{'automatic'}
            Write-Output "Windows IPv4 assignment mode: $mode"
            $checked++
          }
          if($checked -lt 1){throw 'No active physical adapter with readable DNS configuration'}
