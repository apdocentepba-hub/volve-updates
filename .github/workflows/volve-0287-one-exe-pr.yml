name: VOLVE one-EXE signed bundle lab (NO RELEASE)
on:
  pull_request:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/singlefile-*'
      - 'development/0.28.7/unifiedbundle/**'
      - '.github/workflows/volve-0287-one-exe-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Validate exact Go source archive
        shell: pwsh
        run: |
          @'
          import hashlib, tarfile
          from pathlib import Path
          root=Path("development/0.28.7")
          path=root/"singlefile-src.tar.xz"
          assert hashlib.sha256(path.read_bytes()).hexdigest()=="01294e1d5ce51928098d30bd90f04b7979e1764993d4b419c66489b67676e215"
          with tarfile.open(path,"r:xz") as a:
              for item in a.getmembers():
                  parts=Path(item.name).parts
                  assert item.isfile() and parts[0]=="singlefile" and ".." not in parts
                  dest=root/item.name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(a.extractfile(item).read())
          for rel in ('staging.go','staging_test.go','cmd/stageci/main.go'):
              source=root/'singlefile-overlay'/rel
              dest=root/'singlefile'/rel
              assert source.is_file(), f'Missing mandatory staging source: {rel}'
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(source.read_bytes())
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Source archive hash or path invalid'}
      - name: Test, analyze, compile and execute one EXE in Windows
        shell: pwsh
        working-directory: development/0.28.7/singlefile
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Not an isolated runner'}
          go test -count=1 ./...
          if($LASTEXITCODE -ne 0){throw 'Go test failed'}
          go vet ./...
          if($LASTEXITCODE -ne 0){throw 'Go vet failed'}
          $fixture=Join-Path $env:RUNNER_TEMP 'singlefile-fixture'
          $pub=(go run ./cmd/fixture --out $fixture | Select-Object -Last 1).Trim()
          if($LASTEXITCODE -ne 0 -or $pub.Length -ne 64){throw 'CI fixture failed'}
          $boot=Join-Path $env:RUNNER_TEMP 'VOLVE_Boot_LAB.exe'
          $out=Join-Path $env:RUNNER_TEMP 'VOLVE_Setup_LAB_NO_INSTALAR.exe'
          go build -ldflags "-X main.trustedKeyHex=$pub" -o $boot ./cmd/bootstrapper
          if($LASTEXITCODE -ne 0){throw 'Windows executable build failed'}
          go run ./cmd/assemble --bootstrapper $boot --bundle $fixture --out $out --pubkey $pub
          if($LASTEXITCODE -ne 0){throw 'Single EXE assembly failed'}
          $result=(& $out --verify-bundle | Out-String)
          if($LASTEXITCODE -ne 0 -or $result -notmatch 'PASS VOLVE_SINGLEFILE_SIGNED_BUNDLE release=0.28.7 items=8 NO_INSTALL'){throw 'Windows EXE self-verification failed'}
          $bytes=[IO.File]::ReadAllBytes($out)
          $bytes[$bytes.Length-57] = $bytes[$bytes.Length-57] -bxor 1
          $corrupt=Join-Path $env:RUNNER_TEMP 'VOLVE_corrupt_LAB.exe'
          [IO.File]::WriteAllBytes($corrupt,$bytes)
          $reject=(& $corrupt --verify-bundle 2>&1 | Out-String)
          if($LASTEXITCODE -eq 0){throw 'Modified ZIP was accepted'}
          # Real Windows extraction into a disposable, never-used lab directory.
          $staged=Join-Path $env:RUNNER_TEMP 'VOLVE-CI-verified-extraction'
          $stageResult=(go run ./cmd/stageci --exe $out --out $staged --pubkey $pub | Out-String)
          if($LASTEXITCODE -ne 0 -or $stageResult -notmatch 'PASS VOLVE_STAGE_VERIFIED_LAB release=0.28.7 items=8 NO_INSTALL'){
            throw 'Actual Windows signed staging verification failed'
          }
          foreach($name in @('VOLVE_DNS_Motor_0_28_7.exe','VOLVE_Managed_Watchdog.exe','VOLVE_Uninstall.exe','VOLVE_Browser_Policies.json','VOLVE_Full_Catalog.txt','manifest.json','manifest.ed25519')){
            if(-not (Test-Path -LiteralPath (Join-Path $staged $name) -PathType Leaf)){throw ('Staging missing: '+$name)}
          }
          Write-Host $stageResult
          Write-Host $result
          Write-Host 'PASS: packed Windows PE executed verified signed synthetic bundle; tampering rejected; NO INSTALL'
          # The expected rejected EXE exits nonzero; clear that LASTEXITCODE
          # only after proving the rejection or GitHub marks this step failed.
          exit 0
