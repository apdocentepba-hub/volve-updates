name: VOLVE 0.28.7 motor-updater pilot CI (NO release)
on:
  push:
    branches:
      - feature/motor-updater-0287-pilot
    paths:
      - 'development/0.28.7/**'
      - '.github/workflows/volve-motor-0287-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Expand candidate source
        run: mkdir -p build && unzip -q development/0.28.7/VOLVE_0287_CODIGO_MOTOR_PILOTO_NO_INSTALAR.zip -d build
      - name: Unit tests and race detector
        working-directory: build/codigo
        run: |
          go test ./... -count=1
          go test -race ./motorupdate ./releaseupdate -count=1
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Expand candidate source
        shell: pwsh
        run: |
          New-Item -ItemType Directory build -Force | Out-Null
          Expand-Archive -LiteralPath development/0.28.7/VOLVE_0287_CODIGO_MOTOR_PILOTO_NO_INSTALAR.zip -DestinationPath build -Force
      - name: Tests on Windows
        working-directory: build/codigo
        shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          go test ./motorupdate ./releaseupdate -count=1
          if($LASTEXITCODE -ne 0){throw "Unit tests failed"}
      - name: Compile GUI for Windows x64
        working-directory: build/codigo
        shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -trimpath -ldflags '-H windowsgui' -o VOLVE_0287_MOTOR_PILOT_NO_INSTALL.exe .
          if($LASTEXITCODE -ne 0){throw "Windows compilation failed"}
          $f="VOLVE_0287_MOTOR_PILOT_NO_INSTALL.exe"
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $f))
          if($bytes.Length -lt 1000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90){throw "Invalid Windows PE"}
          Get-FileHash -Algorithm SHA256 $f | Format-List
