          [IO.File]::WriteAllText($snapshotPath, $saved, [Text.UTF8Encoding]::new($false))
          if (-not (Test-Path $snapshotPath)) { throw "Snapshot not created" }
          $newAction = New-ScheduledTaskAction -Execute $candidate
