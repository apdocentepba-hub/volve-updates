          }
          Write-Host 'PASS: Windows Task Scheduler task restored after simulated process interruption.'
      - name: Remove only this test task
        if: always()
        shell: pwsh
        run: |
          $name = $env:TEST_TASK_NAME
          if ($name -match '^VOLVE-CI-EngineSwap-[0-9]+$') {
