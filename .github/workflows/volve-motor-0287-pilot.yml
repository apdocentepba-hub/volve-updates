name: VOLVE 0.28.7 motor-updater pilot CI (NO release)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/**'
      - '.github/workflows/volve-motor-0287-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Rebuild source ZIP and verify SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('development/0.28.7/complete-source-parts')
          parts=sorted(src.glob('part-*.bin'))
          if len(parts)!=10: raise RuntimeError('Expected 10 source chunks')
          with open('source.zip','wb') as dst:
              for i,p in enumerate(parts):
                  if p.name!=f'part-{i:02d}.bin': raise RuntimeError('Unexpected chunk order')
                  with open(p,'rb') as f: dst.write(f.read())
          digest=hashlib.sha256(Path('source.zip').read_bytes()).hexdigest()
          assert digest=='92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5',digest
          print('Reconstructed and verified complete source.')
          PY
          mkdir build && unzip -q source.zip -d build
      - name: Apply verified read-only preflight and rollback fixes
        shell: bash
        run: |
          test "$(sha256sum development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip | cut -d ' ' -f1)" = "fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd"
          unzip -q -o development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip -d build
      - name: Overlay crash recovery journal tests
        run: cp development/0.28.7/journal/*.go build/codigo/motorupdate/
      - name: Full unit tests and race detector
        working-directory: build/codigo
        run: |
          go test ./... -count=1
          go test -race ./motorupdate ./releaseupdate -count=1
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Rebuild verified complete source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $items=@(Get-ChildItem development/0.28.7/complete-source-parts -Filter 'part-*.bin' -File | Sort-Object Name)
          if($items.Count -ne 10){throw "Expected 10 chunks"}
          $out=[IO.File]::Create((Join-Path (Get-Location) 'source.zip'))
          try {
            for($i=0;$i -lt 10;$i++){
              if($items[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw "Chunk order"}
              $s=[IO.File]::OpenRead($items[$i].FullName)
              try{$s.CopyTo($out)}finally{$s.Dispose()}
            }
          }finally{$out.Dispose()}
          $hash=(Get-FileHash -Algorithm SHA256 source.zip).Hash.ToLowerInvariant()
          if($hash -ne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw "Source hash mismatch"}
          New-Item -ItemType Directory build -Force | Out-Null
          Expand-Archive -LiteralPath source.zip -DestinationPath build -Force
      - name: Apply verified read-only preflight and rollback fixes
        shell: pwsh
        run: |
          $f='development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip'
          $sha=(Get-FileHash -Algorithm SHA256 $f).Hash.ToLowerInvariant()
          if($sha -ne 'fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'){throw "Overlay mismatch"}
          Expand-Archive -LiteralPath $f -DestinationPath build -Force
      - name: Overlay crash recovery journal tests
        shell: pwsh
        run: Copy-Item development/0.28.7/journal/*.go build/codigo/motorupdate/ -Force
      - name: Run updater tests on Windows
        working-directory: build/codigo
        shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          go test ./motorupdate ./releaseupdate -count=1
          if($LASTEXITCODE -ne 0){throw "Unit tests failed"}
          go test . -run 'TestMotorJournalReadOnlyRejectsUnsafeStates|TestMotorPreflightOnlyReadsKnownFiles' -count=1
          if($LASTEXITCODE -ne 0){throw "Read-only preflight tests failed"}
      - name: Compile complete Windows GUI (not for distribution)
        working-directory: build/codigo
        shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -trimpath -ldflags '-H windowsgui' -o VOLVE_0287_PILOT_NO_INSTALL.exe .
          if($LASTEXITCODE -ne 0){throw "Windows compilation failed"}
          $f="VOLVE_0287_PILOT_NO_INSTALL.exe"
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $f))
          if($bytes.Length -lt 1000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90){throw "Invalid Windows PE"}
          Get-FileHash -Algorithm SHA256 $f | Format-List

  scheduler-rollback-drill:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      TEST_TASK_NAME: VOLVE-CI-EngineSwap-${{ github.run_id }}
    steps:
      - name: Export original harmless task and interrupt after switch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = $env:TEST_TASK_NAME
          if ($name -notmatch '^VOLVE-CI-EngineSwap-[0-9]+$') { throw "Unsafe task name" }
          $isAdmin = ([Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin) { throw "This isolated runner cannot create test tasks" }
          $original = Join-Path $env:WINDIR 'System32/cmd.exe'
          $candidate = Join-Path $env:WINDIR 'System32/notepad.exe'
          $action = New-ScheduledTaskAction -Execute $original -Argument '/C exit 0'
          $trigger = New-ScheduledTaskTrigger -Once -At ((Get-Date).AddYears(1))
          Register-ScheduledTask -TaskName $name -Action $action -Trigger $trigger -User SYSTEM -RunLevel Highest -Force | Out-Null
          $saved = Export-ScheduledTask -TaskName $name
          $snapshotPath = Join-Path $env:RUNNER_TEMP 'VOLVE_CI_original_task.xml'
          [IO.File]::WriteAllText($snapshotPath, $saved, [Text.UTF8Encoding]::new($false))
          if (-not (Test-Path $snapshotPath)) { throw "Snapshot not created" }
          $newAction = New-ScheduledTaskAction -Execute $candidate
          Set-ScheduledTask -TaskName $name -Action $newAction | Out-Null
          $current = @(Get-ScheduledTask -TaskName $name).Actions[0]
          if ($current.Execute -ne $candidate) { throw "Task was not switched" }
          Write-Host 'TEST: task action switched; ending process without rollback to simulate interrupted update.'
      - name: Recover original task in an independent process
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = $env:TEST_TASK_NAME
          $snapshotPath = Join-Path $env:RUNNER_TEMP 'VOLVE_CI_original_task.xml'
          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) { throw "No original task snapshot; fail closed" }
          $saved = [IO.File]::ReadAllText($snapshotPath)
          if (-not $saved.Contains('cmd.exe')) { throw "Snapshot does not identify expected harmless task" }
          Register-ScheduledTask -TaskName $name -Xml $saved -Force | Out-Null
          $restored = Get-ScheduledTask -TaskName $name
          $original = Join-Path $env:WINDIR 'System32/cmd.exe'
          if ($restored.Actions[0].Execute -ne $original -or $restored.Actions[0].Arguments -ne '/C exit 0') {
            throw 'Rollback verification failed: original action not restored'
          }
          Write-Host 'PASS: Windows Task Scheduler task restored after simulated process interruption.'
      - name: Remove only this test task
        if: always()
        shell: pwsh
        run: |
          $name = $env:TEST_TASK_NAME
          if ($name -match '^VOLVE-CI-EngineSwap-[0-9]+$') {
            Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
          }
