              Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
            }
          }
      - name: Remove isolated test-only task
        if: always()
        shell: pwsh
        run: |
          $task='VOLVE-CI-EngineRecovery-'+$env:GITHUB_RUN_ID
          if($task -match '^VOLVE-CI-EngineRecovery-[0-9]+$'){
            Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
          }

