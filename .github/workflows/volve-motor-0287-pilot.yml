name: VOLVE 0.28.7 motor-updater pilot CI (NO release)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/**'
      - '.github/workflows/volve-motor-0287-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Rebuild source ZIP and verify SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('development/0.28.7/complete-source-parts')
          parts=sorted(src.glob('part-*.bin'))
          if len(parts)!=10: raise RuntimeError('Expected 10 source chunks')
          with open('source.zip','wb') as dst:
              for i,p in enumerate(parts):
                  if p.name!=f'part-{i:02d}.bin': raise RuntimeError('Unexpected chunk order')
                  with open(p,'rb') as f: dst.write(f.read())
          digest=hashlib.sha256(Path('source.zip').read_bytes()).hexdigest()
          assert digest=='92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5',digest
          print('Reconstructed and verified complete source.')
          PY
          mkdir build && unzip -q source.zip -d build
      - name: Apply verified read-only preflight and rollback fixes
        shell: bash
        run: |
          test "$(sha256sum development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip | cut -d ' ' -f1)" = "fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd"
          unzip -q -o development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip -d build
      - name: Overlay crash recovery journal tests
        run: cp development/0.28.7/journal/*.go build/codigo/motorupdate/
      - name: Overlay updated recovery journal and crash simulation
        shell: bash
        run: |
          echo '773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40  development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip' | sha256sum --check
          unzip -q -o development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip -d build
      - name: Wire signed panel and motor staging into in-app updater (candidate)
        shell: bash
        run: go run development/0.28.7/inapp/apply_overlay.go build/codigo
      - name: Inspect existing updater integration points (development only)
        shell: bash
        run: |
          echo '=== updater source files ==='
          find build/codigo -name '*.go' | sort | grep -E '(releaseupdate|motorupdate|update|main\.go|panel)' | head -75
          echo '=== GUI and signed-update entrypoints ==='
          grep -RnEi --include='*.go' 'check-app-updates|install-app-update|HighestInstalledPanel|EnsureNoInstalledDowngrade|DownloadVerified|Motor.*Upgrade|Actualiza|Updater|update.*panel|InstallPanel' build/codigo | head -160 || true
          for file in panel_update_windows.go update_windows.go motor_update_windows.go motor_update_preflight_windows.go; do
            echo "=== SOURCE: $file ==="
            sed -n '1,240p' "build/codigo/$file"
          done
      - name: Full unit tests and race detector
        working-directory: build/codigo
        run: |
          go test ./... -count=1
          go test -race ./motorupdate ./releaseupdate -count=1
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Validate VM-only real-reboot lab without running it
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='development/0.28.7/lab/VOLVE_VM_REBOOT_LAB.ps1'
          $tokens=$null
          $errorsList=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errorsList) | Out-Null
          if($errorsList.Count -gt 0){$errorsList | Format-List;throw 'VM reboot script PowerShell parse failed'}
          $content=[IO.File]::ReadAllText((Resolve-Path $path))
          foreach($forbidden in @('Restart-Computer','shutdown.exe','Set-DnsClientServerAddress','netsh interface ip set dns','VOLVE-DNS-SERVER-0270')){
            if($content.Contains($forbidden)){throw ('Unexpected production or reboot command in lab: '+$forbidden)}
          }
          & $path -Mode ValidateScript -LabId '123456'
          # A PowerShell script does not set LASTEXITCODE on success; errors throw.
          Write-Host 'PASS: VM lab syntax and no-write entry point; actual reboot NOT executed.'
      - name: Rebuild verified complete source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $items=@(Get-ChildItem development/0.28.7/complete-source-parts -Filter 'part-*.bin' -File | Sort-Object Name)
          if($items.Count -ne 10){throw "Expected 10 chunks"}
          $out=[IO.File]::Create((Join-Path (Get-Location) 'source.zip'))
          try {
            for($i=0;$i -lt 10;$i++){
              if($items[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw "Chunk order"}
              $s=[IO.File]::OpenRead($items[$i].FullName)
              try{$s.CopyTo($out)}finally{$s.Dispose()}
            }
          }finally{$out.Dispose()}
          $hash=(Get-FileHash -Algorithm SHA256 source.zip).Hash.ToLowerInvariant()
          if($hash -ne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){throw "Source hash mismatch"}
          New-Item -ItemType Directory build -Force | Out-Null
          Expand-Archive -LiteralPath source.zip -DestinationPath build -Force
      - name: Apply verified read-only preflight and rollback fixes
        shell: pwsh
        run: |
          $f='development/0.28.7/VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip'
          $sha=(Get-FileHash -Algorithm SHA256 $f).Hash.ToLowerInvariant()
          if($sha -ne 'fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'){throw "Overlay mismatch"}
          Expand-Archive -LiteralPath $f -DestinationPath build -Force
      - name: Overlay crash recovery journal tests
        shell: pwsh
        run: Copy-Item development/0.28.7/journal/*.go build/codigo/motorupdate/ -Force
      - name: Overlay updated recovery journal and crash simulation
        shell: pwsh
        run: |
          $archive='development/0.28.7/VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip'
          if((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne '773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'){throw 'Recovery ZIP hash mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath build -Force
      - name: Wire signed panel and motor staging into Windows GUI (candidate)
        shell: pwsh
        run: |
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Unified updater source overlay failed'}
      - name: Run updater tests on Windows
        working-directory: build/codigo
        shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          go test ./motorupdate ./releaseupdate -count=1
          if($LASTEXITCODE -ne 0){throw "Unit tests failed"}
          go test . -run 'TestMotorJournalReadOnlyRejectsUnsafeStates|TestMotorPreflightOnlyReadsKnownFiles|TestMergeUpdateReports' -count=1
          if($LASTEXITCODE -ne 0){throw "Read-only preflight tests failed"}
      - name: Verify signed legacy resident and candidate engine evidence (READ ONLY)
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          go test . -run '^TestResidentMotor' -count=1 -timeout 2m -v
          if($LASTEXITCODE -ne 0){throw 'Signed legacy motor provenance verification failed'}
          Write-Host 'PASS: both signed motor identities and the read-only rescue gate are enforced'
      - name: Compile and test standalone Windows watchdog (CI-only tasks)
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          go test ./cmd/volve-managed-watchdog -count=1 -v
          if($LASTEXITCODE -ne 0){throw 'Independent watchdog validation failed'}
          $watchdog=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_Standalone_Motor_Watchdog.exe'
          go build -trimpath -o $watchdog ./cmd/volve-managed-watchdog
          if($LASTEXITCODE -ne 0){throw 'Independent watchdog compilation failed'}
          if(-not (Test-Path -LiteralPath $watchdog -PathType Leaf)){throw 'Separate watchdog executable missing'}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('VOLVE_CI_MANAGED_WATCHDOG_EXE='+$watchdog)
          Write-Host 'PASS: separate CI-only Windows motor watchdog compiled; no production task access'
      - name: Exercise independent watchdog as a fresh process after switching a temporary SYSTEM task
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          go test . -run TestIndependentWatchdogRestoresAfterUpdaterExit -count=1 -timeout 3m -v
          if($LASTEXITCODE -ne 0){throw 'Independent watchdog integration failed'}
      - name: Prove separate watchdog runs under actual SYSTEM identity (pilot task only)
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          go test . -run 'TestIndependentMotorWatchdog(RunsAsSYSTEM|SYSTEMLeavesCommittedUpgradeIntact)' -count=1 -timeout 3m -v
          if($LASTEXITCODE -ne 0){throw 'Independent SYSTEM recovery verification failed'}
      - name: Exercise signed managed transaction against disposable SYSTEM task
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference = 'Stop'
          go test . -run TestManagedWindowsDisposableTaskIntegration -count=1 -timeout 3m -v
          if($LASTEXITCODE -ne 0){throw 'Managed motor CI task transaction failed'}
      - name: Compile complete Windows GUI (not for distribution)
        working-directory: build/codigo
        shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -trimpath -ldflags '-H windowsgui' -o VOLVE_0287_PILOT_NO_INSTALL.exe .
          if($LASTEXITCODE -ne 0){throw "Windows compilation failed"}
          $f="VOLVE_0287_PILOT_NO_INSTALL.exe"
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $f))
          if($bytes.Length -lt 1000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90){throw "Invalid Windows PE"}
          Get-FileHash -Algorithm SHA256 $f | Format-List

      - name: Step 2 - Run actual DNS core on isolated Windows loopback (NO PORT 53)
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          go test ./dnsproxy -run 'TestProbeRealSockets|TestLiveLoopbackUDP|TestSlowFirstUpstreamStillAllowsHealthyFallback' -count=1 -timeout 90s -v
          if($LASTEXITCODE -ne 0){throw 'Windows isolated DNS socket tests failed'}
          go test . -run TestMotorDNSIsolatedLoopbackProof -count=1 -timeout 45s -v
          if($LASTEXITCODE -ne 0){throw 'Five real DNS loopback queries failed'}
          $exe=(Resolve-Path 'VOLVE_0287_PILOT_NO_INSTALL.exe').Path
          $stdOut=Join-Path $env:RUNNER_TEMP 'VOLVE-CI-isolated-dns.out.txt'
          $stdErr=Join-Path $env:RUNNER_TEMP 'VOLVE-CI-isolated-dns.err.txt'
          $process=Start-Process -FilePath $exe -ArgumentList '--motor-dns-isolated-loopback' -PassThru -RedirectStandardOutput $stdOut -RedirectStandardError $stdErr
          if(-not $process.WaitForExit(20000)){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue;throw 'Full VOLVE binary did not finish isolated DNS test'}
          if($process.ExitCode -ne 0){throw ('Full VOLVE binary DNS test failed: '+(Get-Content $stdErr -Raw -ErrorAction SilentlyContinue))}
          $report=Get-Content $stdOut -Raw -ErrorAction SilentlyContinue
          if($report -notmatch 'VOLVE_DNS_ISOLATED_LOOPBACK_OK' -or $report -notmatch '3 bloqueadas, 2 permitidas'){throw ('Full VOLVE binary did not report verified DNS packets: '+$report)}
          Write-Host $report
          Write-Host 'PASS: actual Windows VOLVE application processed five isolated DNS queries without changing DNS adapters or Task Scheduler'
      - name: Step 2 signed full VOLVE binary and disposable SYSTEM rollback
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $env:VOLVE_CI_REAL_CENTRO_EXE=(Resolve-Path 'VOLVE_0287_PILOT_NO_INSTALL.exe').Path
          if(-not $env:VOLVE_CI_MANAGED_WATCHDOG_EXE){throw 'Independent watchdog is absent'}
          go test . -run TestCompleteApplicationCandidateSystemTaskRecovery -count=1 -timeout 3m -v
          if($LASTEXITCODE -ne 0){throw 'Compiled binary and isolated SYSTEM rollback test failed'}
      - name: Build isolated recovery journal helper
        shell: pwsh
        working-directory: build/codigo
        run: |
          $env:CGO_ENABLED='0'
          go build -trimpath -o (Join-Path $env:RUNNER_TEMP 'volve-journal-lab.exe') ./cmd/volve-journal-lab
          if($LASTEXITCODE -ne 0){throw 'Recovery journal helper compilation failed'}
      - name: Force-kill updater process while leaving a switched task
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $lab=Join-Path $env:GITHUB_WORKSPACE 'build/lab/recovery_lab.ps1'
          $helper=Join-Path $env:RUNNER_TEMP 'volve-journal-lab.exe'
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-RECOVERY-'+$env:GITHUB_RUN_ID)
          $task='VOLVE-CI-EngineRecovery-'+$env:GITHUB_RUN_ID
          $argsList=@('-NoProfile','-NonInteractive','-File',('"'+$lab+'"'),'-Phase','switch','-TaskName',$task,'-JournalExe',('"'+$helper+'"'),'-Workspace',('"'+$root+'"'))
          $worker=Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList $argsList -PassThru
          try {
            $ready=Join-Path $root 'switched.ready'
            $deadline=[DateTime]::UtcNow.AddSeconds(70)
            while([DateTime]::UtcNow -lt $deadline -and -not (Test-Path -LiteralPath $ready -PathType Leaf)){
              if($worker.HasExited){throw ('Updater worker exited too early: '+$worker.ExitCode)}
              Start-Sleep -Milliseconds 600
            }
            if(-not (Test-Path -LiteralPath $ready)){throw 'Worker never completed checkpoint'}
            if([IO.File]::ReadAllText($ready) -ne 'SWITCHED_AND_JOURNALED'){throw 'Checkpoint marker invalid'}
            if($worker.HasExited){throw 'Worker exited naturally, not a forced interruption'}
            Stop-Process -Id $worker.Id -Force
            $worker.WaitForExit()
            $status=& $helper status (Join-Path $root 'recovery.json')
            if($LASTEXITCODE -ne 0 -or $status -ne 'ROLLBACK_REQUIRED'){throw 'Recovery journal missing after forced termination'}
            Write-Host 'PASS: updater process force-killed after task switch; journal requires rollback'
          } finally {
            if(-not $worker.HasExited){Stop-Process -Id $worker.Id -Force -ErrorAction SilentlyContinue}
          }
      - name: Restore original task from a fresh process
        shell: pwsh
        run: |
          $lab=Join-Path $env:GITHUB_WORKSPACE 'build/lab/recovery_lab.ps1'
          $helper=Join-Path $env:RUNNER_TEMP 'volve-journal-lab.exe'
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-RECOVERY-'+$env:GITHUB_RUN_ID)
          & $lab -Phase recover -TaskName ('VOLVE-CI-EngineRecovery-'+$env:GITHUB_RUN_ID) -JournalExe $helper -Workspace $root
          if($LASTEXITCODE -ne 0){throw 'Lab restore failed'}
      - name: Verify tampered XML snapshot is rejected
        shell: pwsh
        run: |
          $lab=Join-Path $env:GITHUB_WORKSPACE 'build/lab/recovery_lab.ps1'
          $helper=Join-Path $env:RUNNER_TEMP 'volve-journal-lab.exe'
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-RECOVERY-'+$env:GITHUB_RUN_ID)
          & $lab -Phase tamper -TaskName ('VOLVE-CI-EngineRecovery-'+$env:GITHUB_RUN_ID) -JournalExe $helper -Workspace $root
          if($LASTEXITCODE -ne 0){throw 'Lab tamper validation failed'}
      - name: Stage a disposable SYSTEM boot-trigger watchdog
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $lab=Join-Path $env:GITHUB_WORKSPACE 'development/0.28.7/lab/boot_recovery_lab.ps1'
          $helper=Join-Path $env:RUNNER_TEMP 'volve-journal-lab.exe'
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-BOOT-'+$env:GITHUB_RUN_ID)
          $task='VOLVE-CI-StartupMotor-'+$env:GITHUB_RUN_ID
          $watchdog='VOLVE-CI-BootRecovery-'+$env:GITHUB_RUN_ID
          & $lab -Mode stage -TaskName $task -WatchdogName $watchdog -Workspace $root -JournalExe $helper
          if($LASTEXITCODE -ne 0){throw 'Boot recovery staging failed'}
      - name: Trigger startup recovery under actual SYSTEM identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $watchdog='VOLVE-CI-BootRecovery-'+$env:GITHUB_RUN_ID
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-BOOT-'+$env:GITHUB_RUN_ID)
          $done=Join-Path $root 'boot-recovery-success.marker'
          $failed=Join-Path $root 'boot-recovery-failed.marker'
          Start-ScheduledTask -TaskName $watchdog
          $limit=[DateTime]::UtcNow.AddSeconds(60)
          while([DateTime]::UtcNow -lt $limit){
            if(Test-Path -LiteralPath $failed -PathType Leaf){throw ('Recovery task failed: '+[IO.File]::ReadAllText($failed))}
            if(Test-Path -LiteralPath $done -PathType Leaf){break}
            Start-Sleep -Milliseconds 500
          }
          if(-not (Test-Path -LiteralPath $done -PathType Leaf)){throw 'SYSTEM watchdog did not finish within 60s'}
          Write-Host 'PASS: independent boot-triggered SYSTEM task successfully restored the test motor task.'
      - name: Verify boot recovery status and original task identity
        shell: pwsh
        run: |
          $lab=Join-Path $env:GITHUB_WORKSPACE 'development/0.28.7/lab/boot_recovery_lab.ps1'
          $helper=Join-Path $env:RUNNER_TEMP 'volve-journal-lab.exe'
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-BOOT-'+$env:GITHUB_RUN_ID)
          & $lab -Mode verify -TaskName ('VOLVE-CI-StartupMotor-'+$env:GITHUB_RUN_ID) -WatchdogName ('VOLVE-CI-BootRecovery-'+$env:GITHUB_RUN_ID) -Workspace $root -JournalExe $helper
          if($LASTEXITCODE -ne 0){throw 'Startup watchdog verification failed'}
      - name: Stage second boot recovery case with damaged original-task XML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $suffix=$env:GITHUB_RUN_ID+'1'
          $lab=Join-Path $env:GITHUB_WORKSPACE 'development/0.28.7/lab/boot_recovery_lab.ps1'
          $helper=Join-Path $env:RUNNER_TEMP 'volve-journal-lab.exe'
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-BOOT-'+$suffix)
          & $lab -Mode stage -TaskName ('VOLVE-CI-StartupMotor-'+$suffix) -WatchdogName ('VOLVE-CI-BootRecovery-'+$suffix) -Workspace $root -JournalExe $helper
          if($LASTEXITCODE -ne 0){throw 'Damaged snapshot lab setup failed'}
          [IO.File]::AppendAllText((Join-Path $root 'old-task.xml'),'<!-- unauthorized modification -->')
      - name: Reject tampered boot-recovery snapshot and preserve current task
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $suffix=$env:GITHUB_RUN_ID+'1'
          $root=Join-Path $env:RUNNER_TEMP ('VOLVE-CI-BOOT-'+$suffix)
          $watchdog='VOLVE-CI-BootRecovery-'+$suffix
          Start-ScheduledTask -TaskName $watchdog
          $failure=Join-Path $root 'boot-recovery-failed.marker'
          $success=Join-Path $root 'boot-recovery-success.marker'
          $limit=[DateTime]::UtcNow.AddSeconds(60)
          while([DateTime]::UtcNow -lt $limit -and -not (Test-Path -LiteralPath $failure -PathType Leaf)){
            if(Test-Path -LiteralPath $success -PathType Leaf){throw 'Security regression: modified snapshot was accepted'}
            Start-Sleep -Milliseconds 500
          }
          if(-not (Test-Path -LiteralPath $failure -PathType Leaf)){throw 'Recovery did not reject damaged snapshot'}
          if([IO.File]::ReadAllText($failure) -notmatch 'Journal helper rejected operation verify-snapshot'){throw 'Unexpected failure cause'}
          $task=Get-ScheduledTask -TaskName ('VOLVE-CI-StartupMotor-'+$suffix)
          $expected=Join-Path $env:WINDIR 'System32/notepad.exe'
          if(@($task.Actions).Count -ne 1 -or $task.Actions[0].Execute -ne $expected){throw 'Rejected snapshot nevertheless changed the test task'}
          Write-Host 'PASS: SYSTEM boot watchdog rejected altered snapshot and left task unchanged.'
      - name: Remove corrupted-snapshot test SYSTEM tasks
        if: always()
        shell: pwsh
        run: |
          $suffix=$env:GITHUB_RUN_ID+'1'
          foreach($prefix in @('VOLVE-CI-StartupMotor-','VOLVE-CI-BootRecovery-')){
            $name=$prefix+$suffix
            if($name -match '^VOLVE-CI-(StartupMotor|BootRecovery)-[0-9]+$'){
              Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
            }
          }
      - name: Remove boot test SYSTEM tasks even after failure
        if: always()
        shell: pwsh
        run: |
          foreach($prefix in @('VOLVE-CI-StartupMotor-','VOLVE-CI-BootRecovery-')){
            $task=$prefix+$env:GITHUB_RUN_ID
            if($task -match '^VOLVE-CI-(StartupMotor|BootRecovery)-[0-9]+$'){
              Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
            }
          }
      - name: Validate VM-only reboot proof parser and platform gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script='development/0.28.7/lab/vm_reboot_proof.ps1'
          $tokens=$null
          $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | Out-String | Write-Host;throw 'PowerShell VM proof has syntax errors'}
          $disallowed=@('Restart-Computer','Stop-Computer','Set-DnsClientServerAddress','Uninstall-WindowsFeature')
          $commands=$ast.FindAll({param($n) $n -is [System.Management.Automation.Language.CommandAst]},$true)
          foreach($cmd in $commands){
            if($cmd.GetCommandName() -in $disallowed){throw ('Unsafe command in VM proof: '+$cmd.GetCommandName())}
          }
          & $script -Mode Probe
      - name: Verify VM trial cannot pass without real reboot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # Enable TaskScheduler history only on the disposable GitHub runner.
          & wevtutil.exe sl 'Microsoft-Windows-TaskScheduler/Operational' /e:true
          if($LASTEXITCODE -ne 0){throw 'Unable to enable disposable runner Task Scheduler history'}
          $script=Join-Path $env:GITHUB_WORKSPACE 'development/0.28.7/lab/vm_reboot_proof.ps1'
          $lab=Join-Path $env:GITHUB_WORKSPACE 'development/0.28.7/lab/boot_recovery_lab.ps1'
          $helper=Join-Path $env:RUNNER_TEMP 'volve-journal-lab.exe'
          $trialId='2026'+$env:GITHUB_RUN_ID
          $kit=Join-Path $env:ProgramData ('VOLVE-VM-RebootLab-'+$trialId)
          try {
            & $script -Mode Prepare -RunId $trialId -LabScript $lab -JournalExe $helper
            # Deliberately trigger the watchdog by hand. It must NOT be counted
            # as a real reboot even when recovery itself succeeds under SYSTEM.
            $bootTask='VOLVE-CI-BootRecovery-'+$trialId
            $root=Join-Path $kit ('VOLVE-CI-BOOT-'+$trialId)
            $success=Join-Path $root 'boot-recovery-success.marker'
            $failure=Join-Path $root 'boot-recovery-failed.marker'
            Start-ScheduledTask -TaskName $bootTask
            $deadline=[DateTime]::UtcNow.AddSeconds(60)
            while([DateTime]::UtcNow -lt $deadline) {
              if(Test-Path -LiteralPath $failure -PathType Leaf){throw ('Manual recovery failed: '+[IO.File]::ReadAllText($failure))}
              if(Test-Path -LiteralPath $success -PathType Leaf){break}
              Start-Sleep -Milliseconds 500
            }
            if(-not (Test-Path -LiteralPath $success -PathType Leaf)){throw 'Manual SYSTEM recovery did not complete'}
            $rejected=$false
            try { & $script -Mode Verify -RunId $trialId }
            catch {
              if($_.Exception.Message -match 'NOT VERIFIED: VM has not undergone a new boot'){$rejected=$true}
              else {throw}
            }
            if(-not $rejected){throw 'Security regression: VM rehearsal passed without a reboot'}
            Write-Host 'PASS: manual SYSTEM watchdog recovery cannot masquerade as a real VM reboot.'
          } finally {
            if(Test-Path -LiteralPath $kit -PathType Container){
              & $script -Mode Cleanup -RunId $trialId
            }
          }
      - name: Remove isolated test-only task
        if: always()
        shell: pwsh
        run: |
          $task='VOLVE-CI-EngineRecovery-'+$env:GITHUB_RUN_ID
          if($task -match '^VOLVE-CI-EngineRecovery-[0-9]+$'){
            Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
          }

  scheduler-rollback-drill:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      TEST_TASK_NAME: VOLVE-CI-EngineSwap-${{ github.run_id }}
    steps:
      - name: Export original harmless task and interrupt after switch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = $env:TEST_TASK_NAME
          if ($name -notmatch '^VOLVE-CI-EngineSwap-[0-9]+$') { throw "Unsafe task name" }
          $isAdmin = ([Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin) { throw "This isolated runner cannot create test tasks" }
          $original = Join-Path $env:WINDIR 'System32/cmd.exe'
          $candidate = Join-Path $env:WINDIR 'System32/notepad.exe'
          $action = New-ScheduledTaskAction -Execute $original -Argument '/C exit 0'
          $trigger = New-ScheduledTaskTrigger -Once -At ((Get-Date).AddYears(1))
          Register-ScheduledTask -TaskName $name -Action $action -Trigger $trigger -User SYSTEM -RunLevel Highest -Force | Out-Null
          $saved = Export-ScheduledTask -TaskName $name
          $snapshotPath = Join-Path $env:RUNNER_TEMP 'VOLVE_CI_original_task.xml'
          [IO.File]::WriteAllText($snapshotPath, $saved, [Text.UTF8Encoding]::new($false))
          if (-not (Test-Path $snapshotPath)) { throw "Snapshot not created" }
          $newAction = New-ScheduledTaskAction -Execute $candidate
          Set-ScheduledTask -TaskName $name -Action $newAction | Out-Null
          $current = @(Get-ScheduledTask -TaskName $name).Actions[0]
          if ($current.Execute -ne $candidate) { throw "Task was not switched" }
          Write-Host 'TEST: task action switched; ending process without rollback to simulate interrupted update.'
      - name: Recover original task in an independent process
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = $env:TEST_TASK_NAME
          $snapshotPath = Join-Path $env:RUNNER_TEMP 'VOLVE_CI_original_task.xml'
          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) { throw "No original task snapshot; fail closed" }
          $saved = [IO.File]::ReadAllText($snapshotPath)
          if (-not $saved.Contains('cmd.exe')) { throw "Snapshot does not identify expected harmless task" }
          Register-ScheduledTask -TaskName $name -Xml $saved -Force | Out-Null
          $restored = Get-ScheduledTask -TaskName $name
          $original = Join-Path $env:WINDIR 'System32/cmd.exe'
          if ($restored.Actions[0].Execute -ne $original -or $restored.Actions[0].Arguments -ne '/C exit 0') {
            throw 'Rollback verification failed: original action not restored'
          }
          Write-Host 'PASS: Windows Task Scheduler task restored after simulated process interruption.'
      - name: Remove only this test task
        if: always()
        shell: pwsh
        run: |
          $name = $env:TEST_TASK_NAME
          if ($name -match '^VOLVE-CI-EngineSwap-[0-9]+$') {
            Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
          }
