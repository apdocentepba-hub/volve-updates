name: VOLVE 0.28.7 FOCUSED signed SYSTEM task restoration tests (CI ONLY)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - '.github/workflows/volve-0287-task-restore-focused-windows.yml'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_task_restore_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_task_restore_windows_test.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_task_restore_system_binding_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_task_restore_system_binding_windows_test.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_original_and_task_transaction_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_original_and_task_transaction_windows_test.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_combined_publisher_binding_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_combined_publisher_binding_windows_test.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_boot_policy_adapter_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_boot_policy_adapter_windows_test.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_exact_candidate_rollback_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_exact_candidate_rollback_windows_test.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_pinned_boot_driver_windows.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_pinned_boot_driver_windows_test.go'
      - 'development/0.28.7/inapp/watchdogcmd/resident_signed_system_stage_ci_windows_test.go'
      - 'development/0.28.7/inapp/apply_overlay.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-windows-quiescence:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [task-only, combined-success, combined-rejections, candidate-success, candidate-rejections]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify isolated runner and pinned original code
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Not hosted CI'}
          $vm=Get-CimInstance Win32_ComputerSystem
          if(($vm.Manufacturer+' '+$vm.Model) -notmatch '(?i:virtual machine|hyper-v|vmware|kvm|qemu|virtualbox)'){throw 'Not a verified VM'}
          if(Get-ScheduledTask -TaskName 'VOLVE-DNS-SERVER-0270' -ErrorAction SilentlyContinue){throw 'Real motor task exists; refusing test'}
          if(Get-ScheduledTask -TaskName 'VOLVE-DNS-RESCUE-0270' -ErrorAction SilentlyContinue){throw 'Real rescue task exists'}
          $parts=@(Get-ChildItem development/0.28.7/complete-source-parts -Filter part-*.bin -File|Sort-Object Name)
          if($parts.Count -ne 10){throw 'Wrong number of source segments'}
          $source=[IO.File]::Create((Join-Path $PWD 'pinned-source.zip'))
          try {
            for($i=0;$i -lt 10;$i++){
              if($parts[$i].Name -ne ('part-{0:D2}.bin' -f $i)){throw 'Unexpected source ordering'}
              $from=[IO.File]::OpenRead($parts[$i].FullName)
              try{$from.CopyTo($source)}finally{$from.Dispose()}
            }
          }finally{$source.Dispose()}
          if((Get-FileHash -Algorithm SHA256 pinned-source.zip).Hash.ToLowerInvariant() -cne '92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5'){
            throw 'Source hash changed'
          }
          New-Item -ItemType Directory build -Force|Out-Null
          Expand-Archive pinned-source.zip build -Force
          $patches=@(
            @{n='VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip';h='fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd'},
            @{n='VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip';h='773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40'}
          )
          foreach($patch in $patches){
            $p=Join-Path development/0.28.7 $patch.n
            if((Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant() -cne $patch.h){throw 'Overlay hash mismatch'}
            Expand-Archive $p build -Force
          }
          Copy-Item development/0.28.7/journal/*.go build/codigo/motorupdate/ -Force
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Source overlay generation failed'}
      - name: Verify only original-editor-signed SYSTEM task restore (focused Windows tests)
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $env:CGO_ENABLED='0'
          $scope='${{ matrix.scope }}'
          switch ($scope) {
            'task-only' {
              $pattern = '^(TestSignedOriginalSYSTEMTask|TestSignedProductionSYSTEMTaskRestore|TestSignedCombinedPublisherBinding|TestPinnedResidentBootDriver)'
            }
            'combined-success' {
              $pattern = '^(TestSignedCombinedRecovery(MissingExeThenTaskOneMutexNoReceipt|AlreadyOriginalRetriesTaskWithoutOverwritingExe|LockedHandoffDoesNotReacquireMutex)|TestSignedBootOriginalOps(RejectMissingTrustBeforeOSChanges|UnderProtectedPolicyLeaseLeavesPendingJournal)|TestSignedBootPolicyFullRecoveryUnderSharedMutexSealsExactlyOnce)$'
            }
            'combined-rejections' {
              $pattern = '^(TestSignedCombinedRecovery(UnknownExistingImageNoTaskMutation|RejectsLiveDNS53NoTaskOrExeChanges|TaskFailureLeavesOriginalAndPendingJournal|WithoutSYSTEMOrCancelledCannotMutate)|TestSignedBootOriginalOpsHealthyRunningOriginalCanBeAuditedButNotMutated)$'
            }
            'candidate-success' {
              $pattern = '^TestSignedExactCandidateRollbackRestoresOriginalThenTaskAndLeavesPending$'
            }
            'candidate-rejections' {
              $pattern = '^(TestSignedExactCandidateRollbackRejectsActiveDNSWithoutTouchingCandidate|TestSignedBootPolicyAuditsExactCandidateUnderProtectedMutexButRejectsUnknown)$'
            }
            default { throw 'Unexpected test matrix selector' }
          }
          go test ./cmd/volve-managed-watchdog -run $pattern -count=1 -timeout 13m -v
          if($LASTEXITCODE -ne 0){throw ('Publisher-signed Windows tests failed in '+$scope)}
          go build -trimpath -o (Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Quiescence_Watchdog_CI.exe') ./cmd/volve-managed-watchdog
          if($LASTEXITCODE -ne 0){throw 'Independent watchdog does not compile'}
          if(Get-ScheduledTask -TaskName 'VOLVE-DNS-SERVER-0270' -ErrorAction SilentlyContinue){
            throw 'Disposable task leaked into CI runner'
          }
          Write-Host ('PASS: signed SYSTEM task restoration in '+$scope+'; no production task, DNS or installation changed')
          if($scope -eq 'task-only'){
            $testExe=Join-Path $env:RUNNER_TEMP 'VOLVE_CI_System_Stage_Test.exe'
            go test -c -o $testExe ./cmd/volve-managed-watchdog
            if($LASTEXITCODE -ne 0){throw 'Cannot compile independent Go test binary for SYSTEM token lab'}
            $env:VOLVE_CI_STAGE_EXEC='1'
            & $testExe '-test.run=^TestResidentCIStageSealerActualDisposableSYSTEMTask$' '-test.timeout=3m' '-test.v'
            if($LASTEXITCODE -ne 0){throw 'Actual SYSTEM NTFS stage sealing test failed'}
          }
