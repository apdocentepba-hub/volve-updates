name: VOLVE 0.28.7 combined Windows partial host census (NO RELEASE)
on:
  push:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/inapp/fresh_partial_host_probe_windows.go'
      - 'development/0.28.7/inapp/fresh_partial_host_probe_windows_test.go'
      - 'development/0.28.7/inapp/fresh_task_inventory_windows.go'
      - 'development/0.28.7/inapp/fresh_task_inventory_windows_test.go'
      - 'development/0.28.7/inapp/fresh_service_inventory_windows.go'
      - 'development/0.28.7/inapp/fresh_service_inventory_windows_test.go'
      - 'development/0.28.7/inapp/fresh_install_policy.go'
      - 'development/0.28.7/inapp/fresh_install_policy_test.go'
      - '.github/workflows/volve-0287-fresh-partial-host-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-combined-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Validate admin token plus real Windows task/service inventories; all installation gates remain closed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:GO111MODULE='off'
          $files=@(
            'development/0.28.7/inapp/fresh_install_policy.go',
            'development/0.28.7/inapp/fresh_install_policy_test.go',
            'development/0.28.7/inapp/fresh_task_inventory_windows.go',
            'development/0.28.7/inapp/fresh_task_inventory_windows_test.go',
            'development/0.28.7/inapp/fresh_service_inventory_windows.go',
            'development/0.28.7/inapp/fresh_service_inventory_windows_test.go',
            'development/0.28.7/inapp/fresh_partial_host_probe_windows.go',
            'development/0.28.7/inapp/fresh_partial_host_probe_windows_test.go'
          )
          foreach($file in $files){
            if(-not (Test-Path -LiteralPath $file -PathType Leaf)){
              throw ('Required Windows partial host census source is missing: '+$file)
            }
          }
          go test -count=1 -timeout 6m -v @files
          if($LASTEXITCODE -ne 0){throw 'Windows partial host census did NOT satisfy fail-closed acceptance tests'}
          Write-Host 'PASS: live Windows token, service, scheduler inspections + partial 2-of-6 host census; installation blocked until four other OS inventories are verified. No system modifications.'
