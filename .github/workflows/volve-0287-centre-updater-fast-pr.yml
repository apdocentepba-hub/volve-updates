name: VOLVE 0.28.7 Centre+Updater actual Windows integration (FAST, NO RELEASE)
on:
  pull_request:
    branches: [feature/motor-updater-0287-pilot]
    paths:
      - 'development/0.28.7/inapp/**'
      - 'development/0.28.7/release-materials/**'
      - '.github/workflows/volve-0287-centre-updater-fast-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volve-0287-centre-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-real-centre-compile:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Prove Windows is disposable and has no productive VOLVE DNS tasks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Not isolated CI'}
          foreach($name in @('VOLVE-DNS-SERVER-0270','VOLVE-DNS-RESCUE-0270','VOLVE-CATALOGO-0230')){
            if(Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue){throw 'Production task detected: refusing build'}
          }
      - name: Reconstruct exact authenticated original Centro and overlays
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib,zipfile,shutil
          from pathlib import Path
          root=Path("development/0.28.7")
          parts=sorted((root/"complete-source-parts").glob("part-*.bin"))
          assert [p.name for p in parts]==[f"part-{i:02d}.bin" for i in range(10)]
          payload=b"".join(p.read_bytes() for p in parts)
          assert hashlib.sha256(payload).hexdigest()=="92b3536559151260375b17a64eedd009df8399e45460637208027b7ca0587ba5"
          Path("source.zip").write_bytes(payload)
          Path("build").mkdir(exist_ok=True)
          with zipfile.ZipFile("source.zip") as z:z.extractall("build")
          for name,digest in (
            ("VOLVE_0287_PRECHECK_RESCATE_OVERLAY_NO_INSTALAR.zip","fdfd31f21df81fe6da6075bfd442354297874576b6dc2c38f19bd35a681d95cd"),
            ("VOLVE_0287_RECUPERACION_INTERRUPCION_FORZADA_NO_INSTALAR_v3.zip","773bd5eb5f1c4883021cc321856636354e964d3605dba9017e2fb5d1a7401b40")
          ):
            p=root/name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
            with zipfile.ZipFile(p) as z:z.extractall("build")
          for p in (root/"journal").glob("*.go"):
            shutil.copy2(p,Path("build/codigo/motorupdate")/p.name)
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Authenticated source archive reconstruction failed'}
          go run development/0.28.7/inapp/apply_overlay.go build/codigo
          if($LASTEXITCODE -ne 0){throw 'Authenticated source overlay failed'}
      - name: Focused actual Centro, signed update button and production mutex contract
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $required=@(
            'TestMergeUpdateReportsPreservesPanelInstallMarker',
            'TestMergeUpdateReportsNoPanelCandidate',
            'TestPreparedSignedMigrationValidIsReadOnlyAndNeverClaimsInstalled',
            'TestMotorMigrationStatusUsesSignedPermitInsteadOfMissingOldVersion',
            'TestInstalledPublisherReviewBridgeRequiresRepeatedLiveSYSTEMTaskXMLAndDNS',
            'TestInstalledUnsignedMigrationDraftBindsFourLiveSYSTEMObservationsAndNeverAuthorizes',
            'TestInstalledUnsignedMigrationDraftRejectsHostDriftBetweenReviewAndDraft',
            'TestWindowsResidentProcessEvidenceUsesReadOnlySystemCommands',
            'TestWindowsResidentProcessEvidenceFailsClosed',
            'TestProtectedMotorTargetNativePathAllowlist'
          )
          $listed=@(go test . -list '^Test')
          if($LASTEXITCODE -ne 0){throw 'Centre tests did not compile'}
          foreach($name in $required){
            if(-not ($listed -contains $name)){throw ('REQUIRED Centro test not compiled: '+$name)}
          }
          go test . -run '^Test(MergeUpdateReports|PreparedSignedMigration|MotorMigrationStatus|InstalledPublisherReview|InstalledUnsignedMigrationDraft|WindowsResidentProcessEvidence|ProtectedMotorTarget)' -count=1 -timeout 5m
          if($LASTEXITCODE -ne 0){throw 'Centro signed migration/inapp tests failed'}
          $motorTests=@(go test ./motorupdate -list '^TestProtectedMotor')
          foreach($required in @(
            'TestProtectedMotorPreparedOnlySignedBundleAndNoActivation',
            'TestProtectedMotorPreparationFailsClosedBeforeAnyWrite',
            'TestProtectedMotorPreparationKeepsInterruptedBundleUnusable'
          )){
            if($LASTEXITCODE -ne 0 -or -not ($motorTests -contains $required)){
              throw ('protected motor staging test absent: '+$required)
            }
          }
          go test ./motorupdate -run '^(TestProtectedBoot|TestProtectedSigned|TestPublisherBoundBootEvidence|TestPublisherBoundBootFinalizer|TestDurablePublisherBootEvidence|TestProtectedMotor)' -count=1 -timeout 6m
          if($LASTEXITCODE -ne 0){throw 'Protected signed bridge tests failed'}
          # Real WinNTFS ACL exercise on a disposable hosted VM only.
          $nativeRequired=@(
            'TestWindowsNativeProtectedMotorStagingRealNTFS',
            'TestWindowsNativeProtectedMotorStageRootAndLease'
          )
          $census=@(go test -tags volveci . -list '^TestWindowsNativeProtectedMotor')
          if($LASTEXITCODE -ne 0){throw 'WinNTFS staged motor native tests did not compile'}
          foreach($test in $nativeRequired){
            if(-not ($census -contains $test)){
              throw ('CRITICAL: native Windows SYSTEM/NTFS test missing: '+$test)
            }
          }
          $events=@(go test -tags volveci . -run '^TestWindowsNativeProtectedMotor' -count=1 -timeout 6m -json)
          if($LASTEXITCODE -ne 0){
            $events | Select-Object -Last 65 | Write-Host
            throw 'Real NTFS, OS-wide mutex, publisher signing and protected motor staging failed'
          }
          $report=@($events | Where-Object {$_ -match '^\s*\{'} | ForEach-Object {$_ | ConvertFrom-Json})
          foreach($test in $nativeRequired){
            $passed=@($report | Where-Object {$_.Test -eq $test -and $_.Action -eq 'pass'})
            $skipped=@($report | Where-Object {$_.Test -eq $test -and $_.Action -eq 'skip'})
            if($passed.Count -ne 1 -or $skipped.Count -ne 0){
              throw ('CRITICAL: protected Windows motor test missing or skipped: '+$test)
            }
          }
          Write-Host 'PASS: native WinNTFS SYSTEM/Admin create-only root and signed bundle, actual shared kernel lock, no installed receipt, no DNS/task writes'
          # Real compiled Windows watchdog source, no real SYSTEM task writes.
          $watchdogRequired=@(
            'TestSignedOriginalSYSTEMStartRequiresSignedPendingTaskAndNeverCommits',
            'TestSignedOriginalSYSTEMStartFailClosedBeforeTaskMutation',
            'TestPinnedResidentTerminalReceiptExactPathAndNoAlias',
            'TestPinnedResidentBootEntryRejectsNonSYSTEMWithoutTouchingInstallation',
            'TestPinnedResidentBootTerminalSourceHasNoReleaseOrTaskRegistration',
            'TestPinnedResidentBootCLIFailsClosedWithoutActualSYSTEM',
            'TestPinnedResidentBootCLIRefusesCancelledContext',
            'TestPinnedRecoveryBootCLIHasNoUserControlledRootOrAutomaticTask',
            'TestPinnedBootHealthQueriesLiveTaskProcessAndBothDNS53Owners',
            'TestSignedOriginalSYSTEMTaskRestoresOnlyAuthenticatedPendingXMLAndDoesNotFinish'
          )
          $watchdogCensus=@(go test ./cmd/volve-managed-watchdog -list '^Test')
          if($LASTEXITCODE -ne 0){throw 'Independent watchdog Windows code does not compile'}
          foreach($test in $watchdogRequired){
            if(-not ($watchdogCensus -contains $test)){
              throw ('CRITICAL: independent signed boot watchdog test not compiled: '+$test)
            }
          }
          go test ./cmd/volve-managed-watchdog -run '^(TestSignedOriginalSYSTEMStart|TestPinnedBootHealthQueriesLiveTaskProcessAndBothDNS53Owners|TestSignedOriginalSYSTEMTaskRestoresOnlyAuthenticatedPendingXMLAndDoesNotFinish|TestPinnedResidentTerminal|TestPinnedResidentBootEntry|TestPinnedResidentBootTerminalSource|TestPinnedResidentBootCLI|TestPinnedRecoveryBootCLI)' -count=1 -timeout 6m
          if($LASTEXITCODE -ne 0){throw 'Protected SYSTEM original task restart/health rollback tests failed'}
          go vet . ./motorupdate
          if($LASTEXITCODE -ne 0){throw 'Centre updater vet failed'}
      - name: Build and inspect real integrated Win64 GUI (NO DISTRIBUTION)
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $env:CGO_ENABLED='0'
          $file=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Centro_Updater_LAB_NO_INSTALAR.exe'
          # Keep build metadata independent of PR commit SHA and destination path.
          # Two independently linked files must be byte-exact within this run.
          Write-Host ('Go toolchain: '+(go version))
          $file2=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Centro_Updater_RELINK_NO_INSTALAR.exe'
          go build -buildvcs=false -trimpath -ldflags '-H windowsgui -buildid=' -o $file .
          if($LASTEXITCODE -ne 0){throw 'First exact Centro+Updater Win64 build failed'}
          go build -buildvcs=false -trimpath -ldflags '-H windowsgui -buildid=' -o $file2 .
          if($LASTEXITCODE -ne 0){throw 'Second independent Centro+Updater Win64 link failed'}
          $digest1=(Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          $digest2=(Get-FileHash -Algorithm SHA256 -LiteralPath $file2).Hash.ToLowerInvariant()
          if($digest1 -cne $digest2){throw 'CRITICAL: Centro+Updater not byte-identical across independent link outputs'}
          Write-Host ('PASS: REPRODUCIBLE_CENTRO_WITHIN_RUN SHA256='+$digest1)
          $meta=Get-Item -LiteralPath $file -ErrorAction Stop
          if($meta.Length -lt 1048576){throw 'Windows GUI is incomplete'}
          $handle=[IO.File]::OpenRead($file)
          try{$a=$handle.ReadByte();$b=$handle.ReadByte()}finally{$handle.Dispose()}
          if($a -ne 77 -or $b -ne 90){throw 'Result is not a PE executable'}
          $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          Write-Host ('PASS: compile actual Centro+Updater 0.28.7 for Windows; bytes='+$meta.Length+' SHA256='+$h)
          Write-Host 'NO RELEASE, NO INSTALLER, NO FILE DISTRIBUTION, NO DNS/TASK MODIFICATIONS'

      - name: Compile actual independent Windows watchdog and audit 2 of 7 public inputs (NO RELEASE)
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          $env:CGO_ENABLED='0'
          $centro=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Centro_Updater_LAB_NO_INSTALAR.exe'
          $watchdog=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Managed_Watchdog_LAB_NO_INSTALAR.exe'
          if(-not (Test-Path -LiteralPath $centro -PathType Leaf)){
            throw 'Integrated Centre binary from previous Windows build is missing'
          }
          $watchdog2=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Managed_Watchdog_RELINK_NO_INSTALAR.exe'
          go build -buildvcs=false -trimpath -ldflags '-buildid=' -o $watchdog ./cmd/volve-managed-watchdog
          if($LASTEXITCODE -ne 0){throw 'First independent native Windows watchdog build failed'}
          go build -buildvcs=false -trimpath -ldflags '-buildid=' -o $watchdog2 ./cmd/volve-managed-watchdog
          if($LASTEXITCODE -ne 0){throw 'Second independent native Windows watchdog build failed'}
          $digest1=(Get-FileHash -Algorithm SHA256 -LiteralPath $watchdog).Hash.ToLowerInvariant()
          $digest2=(Get-FileHash -Algorithm SHA256 -LiteralPath $watchdog2).Hash.ToLowerInvariant()
          if($digest1 -cne $digest2){throw 'CRITICAL: watchdog not byte-identical across independent link outputs'}
          Write-Host ('PASS: REPRODUCIBLE_WATCHDOG_WITHIN_RUN SHA256='+$digest1)
          $meta=Get-Item -LiteralPath $watchdog -ErrorAction Stop
          if($meta.Length -lt 1048576){throw 'Compiled watchdog binary is suspiciously small'}
          Write-Host 'MATERIALS CHECK 1/2: execute adversarial auditor tests'
          python -m unittest discover -s ../../development/0.28.7/release-materials -p 'test_inspect_materials.py' -v
          if($LASTEXITCODE -ne 0){throw 'Materials audit negative/contract tests failed'}
          Write-Host 'MATERIALS CHECK 2/2: inventory actual PE32+ binaries, with NONE approved for install'
          python ../../development/0.28.7/release-materials/inspect_materials.py `
            --centro $centro `
            --watchdog $watchdog `
            --go-contract ../../development/0.28.7/unifiedbundle/bundle.go `
            --report (Join-Path $env:RUNNER_TEMP 'VOLVE_0287_CI_INPUTS_NO_RELEASE.json')
          if($LASTEXITCODE -ne 0){throw 'Actual Windows release material inspection failed'}
          $proof=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'VOLVE_0287_CI_INPUTS_NO_RELEASE.json') -Raw | ConvertFrom-Json
          if($proof.checked_compiled_roles -ne 2 -or $proof.missing_production_release_roles -ne 7 -or
             @($proof.materials).Count -ne 7 -or
             @($proof.materials | Where-Object {$_.filename -eq 'VOLVE_Uninstall.exe' -or $_.id -eq 'uninstaller'}).Count -ne 0 -or
             $proof.production_install_authorized -ne $false -or $proof.can_publish_release -ne $false){
            throw 'Unsigned CI components were incorrectly treated as installable release'
          }
          Write-Host 'PASS: Centro and independent watchdog compiled from authenticated real source; 2/7 CI build inputs; 0/7 release-approved'
          Write-Host 'NO EXPORT/UPLOAD, NO RELEASE, NO INSTALLER, NO DNS/TASK CHANGE'

      - name: Verify exact old editor-signed DNS motor candidate as THIRD material (NO RELEASE)
        shell: pwsh
        working-directory: build/codigo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'VOLVE-CI-PINNED-MOTOR-NO-INSTALAR'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          gh release download v0.28.7 --repo "$env:GITHUB_REPOSITORY" --pattern 'VOLVE_0_28_7_CENTRO.exe' --dir $root
          if($LASTEXITCODE -ne 0){throw 'Original published and pinned v0.28.7 motor candidate unavailable'}
          $original=Join-Path $root 'VOLVE_0_28_7_CENTRO.exe'
          $originalHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $original).Hash.ToLowerInvariant()
          if((Get-Item -LiteralPath $original).Length -ne 18168832 -or
             $originalHash -cne 'e451b6289116636986ddd67b39dc15f02e471ebde7be9508b38d7bcb0155b414'){
            throw 'Published motor candidate does not match exact pinned original release bytes'
          }
          # This is an OLD published candidate, not this PR's new Centro binary.
          # It is not authorized for migration, nor signed as a complete Setup.
          $motor=Join-Path $root 'VOLVE_DNS_Motor_0_28_7.exe'
          Copy-Item -LiteralPath $original -Destination $motor -ErrorAction Stop
          Copy-Item -LiteralPath '../../development/0.28.7/motor-release-candidate/VOLVE_DNS_Motor_0_28_7.exe.json' -Destination ($motor+'.json') -ErrorAction Stop
          Copy-Item -LiteralPath '../../development/0.28.7/motor-release-candidate/VOLVE_DNS_Motor_0_28_7.exe.sig' -Destination ($motor+'.sig') -ErrorAction Stop
          $env:VOLVE_CI_PINNED_MOTOR=$motor
          @'
          //go:build windows
          package motorupdate
          import (
            "crypto/ed25519"
            "encoding/base64"
            "os"
            "path/filepath"
            "testing"
          )
          func TestExactPublisherSignedHistoricMotorForAudit(t *testing.T) {
            path:=os.Getenv("VOLVE_CI_PINNED_MOTOR")
            if path==""{t.Fatal("required published candidate not specified")}
            key,e:=base64.StdEncoding.DecodeString("6pa2qoWNv+J7u0ulDXvqlBd7qEeDzPBdxmU6NpqTGHk=")
            if e!=nil || len(key)!=ed25519.PublicKeySize {t.Fatal("pinned original publisher key invalid")}
            manifest,e:=VerifyStaged(path,ed25519.PublicKey(key))
            if e!=nil {t.Fatalf("published old signed motor refused: %v",e)}
            if manifest.Version!="0.28.7" || manifest.Component!="dns-engine" ||
              manifest.Size!=18168832 ||
              manifest.SHA256!="e451b6289116636986ddd67b39dc15f02e471ebde7be9508b38d7bcb0155b414"{
              t.Fatalf("published old signed motor identity wrong: %+v",manifest)
            }
            modified:=filepath.Join(t.TempDir(),"VOLVE_DNS_Motor_0_28_7.exe")
            raw,e:=os.ReadFile(path);if e!=nil{t.Fatal(e)}
            raw[100]^=0x01
            if e=os.WriteFile(modified,raw,0600);e!=nil{t.Fatal(e)}
            for _,ext:=range []string{".json",".sig"}{
              bytes,e:=os.ReadFile(path+ext);if e!=nil{t.Fatal(e)}
              if e=os.WriteFile(modified+ext,bytes,0600);e!=nil{t.Fatal(e)}
            }
            if _,e=VerifyStaged(modified,ed25519.PublicKey(key));e==nil{
              t.Fatal("modified published motor was erroneously accepted")
            }
          }
          '@ | Set-Content -LiteralPath 'motorupdate/ci_pinned_motor_materials_windows_test.go' -Encoding utf8
          go test ./motorupdate -run '^TestExactPublisherSignedHistoricMotorForAudit$' -count=1 -timeout 3m -v
          if($LASTEXITCODE -ne 0){throw 'Original motor Editor Ed25519 signature verification failed'}
          $centro=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Centro_Updater_LAB_NO_INSTALAR.exe'
          $watchdog=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Managed_Watchdog_LAB_NO_INSTALAR.exe'
          $report=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_PINNED_THREE_MATERIALS_NO_RELEASE.json'
          python ../../development/0.28.7/release-materials/inspect_materials.py `
            --centro $centro `
            --watchdog $watchdog `
            --pinned-published-motor $motor `
            --go-contract ../../development/0.28.7/unifiedbundle/bundle.go `
            --report $report
          if($LASTEXITCODE -ne 0){throw 'Three-component material audit refused old motor candidate'}
          $proof=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $m=@($proof.materials | Where-Object {$_.id -eq 'dns-motor'})
          if($proof.checked_compiled_roles -ne 2 -or
             $proof.checked_historic_candidate_roles -ne 1 -or
             $proof.checked_build_material_roles -ne 3 -or
             @($proof.materials).Count -ne 7 -or
             @($proof.materials | Where-Object {$_.filename -eq 'VOLVE_Uninstall.exe' -or $_.id -eq 'uninstaller'}).Count -ne 0 -or
             $proof.missing_production_release_roles -ne 7 -or
             $proof.production_install_authorized -ne $false -or
             $m.Count -ne 1 -or
             $m[0].state -cne 'PINNED_HISTORIC_SIGNED_DNS_CANDIDATE_NOT_INSTALLABLE'){
            throw 'Candidate presence must never grant installation or release permission'
          }
          Write-Host 'PASS: 2 distinct actual Windows builds + 1 SHA256-pinned historical publisher-signed DNS motor verified with genuine original Go verifier.'
          Write-Host '3/7 CI audit materials, 0/7 production approved; missing signed migration and final Setup. NO INSTALL OR RELEASE.'

      - name: Stage actual five-source files with two explicit CI-only placeholders (NO RELEASE)
        timeout-minutes: 5
        shell: pwsh
        working-directory: development/0.28.7/release-materials/mixedbundleci
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Not hosted Windows CI'}
          # Fetch one exact HaGeZi Git commit/blob, never a floating latest.
          # No release: upstream GPL-3.0 license and motor compatibility need review.
          python -m unittest discover -s ../catalogci -p 'test_pinned_hagezi.py' -v
          if($LASTEXITCODE -ne 0){throw 'Pinned official catalog parser negative tests failed'}
          $catalog=Join-Path $env:RUNNER_TEMP 'VOLVE_Full_Catalog.txt'
          $catalogReceipt=Join-Path $env:RUNNER_TEMP 'VOLVE_Full_Catalog_SOURCE_ONLY.json'
          python ../catalogci/pinned_hagezi.py --out $catalog --receipt $catalogReceipt
          if($LASTEXITCODE -ne 0){throw 'Official HaGeZi gambling catalog does not match fixed source blob/size/format'}
          go test -count=1 -v ./...
          if($LASTEXITCODE -ne 0){throw 'Mixed real-material provenance negative tests failed'}
          go vet ./...
          if($LASTEXITCODE -ne 0){throw 'Mixed real-material vet failed'}
          $centro=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Centro_Updater_LAB_NO_INSTALAR.exe'
          $watchdog=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_Managed_Watchdog_LAB_NO_INSTALAR.exe'
          $motor=Join-Path $env:RUNNER_TEMP 'VOLVE-CI-PINNED-MOTOR-NO-INSTALAR/VOLVE_DNS_Motor_0_28_7.exe'
          $audit=Join-Path $env:RUNNER_TEMP 'VOLVE_0287_PINNED_THREE_MATERIALS_NO_RELEASE.json'
          $root=Join-Path $env:RUNNER_TEMP 'VOLVE-CI-MIXED-REAL-5'
          $inactive=Join-Path $env:RUNNER_TEMP 'VOLVE-CI-VERSION-0287-MIXED'
          $sidecar=(Resolve-Path '../../motor-release-candidate/VOLVE_DNS_Motor_0_28_7.exe.json').Path
          $signature=(Resolve-Path '../../motor-release-candidate/VOLVE_DNS_Motor_0_28_7.exe.sig').Path
          $result=(& go run ./cmd/mixedbundle --centro $centro --watchdog $watchdog --historic-motor $motor --motor-manifest $sidecar --motor-signature $signature --catalog $catalog --catalog-receipt $catalogReceipt --audit $audit --out $root --inactive $inactive | Out-String)
          if($LASTEXITCODE -ne 0 -or $result -notmatch 'PASS VOLVE_REAL_MATERIALS_MIXED_CI_INACTIVE_STAGE actual_source_files=6 synthetic_roles=1 native_PE=3 total=7 RELEASE_APPROVED=false'){
            throw 'Actual Windows components could not be signed and staged in inactive CI'
          }
          foreach($test in @(
            @($centro, (Join-Path $inactive 'VOLVE_Centro_Updater.exe')),
            @($watchdog, (Join-Path $inactive 'VOLVE_Managed_Watchdog.exe')),
            @($motor, (Join-Path $inactive 'VOLVE_DNS_Motor_0_28_7.exe')),
            @($sidecar, (Join-Path $inactive 'VOLVE_DNS_Motor_0_28_7.exe.json')),
            @($signature, (Join-Path $inactive 'VOLVE_DNS_Motor_0_28_7.exe.sig'))
          )){
            $a=(Get-FileHash -Algorithm SHA256 -LiteralPath $test[0]).Hash
            $b=(Get-FileHash -Algorithm SHA256 -LiteralPath $test[1]).Hash
            if($a -cne $b){throw ('Real asset changed while staging: '+$test[1])}
          }
          if((Get-Content -LiteralPath (Join-Path $inactive 'VOLVE_Browser_Policies.json') -Raw) -notmatch 'never_install'){throw 'Synthetic browser policy marker missing'}
          $sourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $catalog).Hash
          $stagedHash=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $inactive 'VOLVE_Full_Catalog.txt')).Hash
          if($sourceHash -cne $stagedHash){throw 'Pinned official full source changed during inactive stage'}
          if((Get-Item -LiteralPath (Join-Path $inactive 'VOLVE_Full_Catalog.txt')).Length -ne 11040215){
            throw 'Staged complete gambling catalog truncated'
          }
          if(Test-Path -LiteralPath (Join-Path $inactive 'VOLVE_Uninstall.exe')){throw 'Owner uninstaller entered public payload'}
          Write-Host $result
          Write-Host 'PASS VOLVE_MIXED_REAL_SOURCE_INACTIVE_CI_WIREUP; ZERO PRODUCTION-APPROVED COMPONENTS; HAGEZI GPL COMPLIANCE PENDING; NO SETUP NO INSTALL NO RELEASE'

      - name: Exercise exact HaGeZi full list with REAL resident DNS parser on Windows loopback (NO INSTALL)
        timeout-minutes: 7
        shell: pwsh
        working-directory: build/codigo
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'Not isolated Windows CI'}
          $source=Join-Path $env:RUNNER_TEMP 'VOLVE_Full_Catalog.txt'
          if(-not (Test-Path -LiteralPath $source -PathType Leaf)){throw 'Pinned full source was not verified earlier'}
          if((Get-Item -LiteralPath $source).Length -ne 11040215){throw 'Full source identity changed before DNS test'}
          $beforeDns=Get-DnsClientServerAddress -ErrorAction Stop | Sort-Object InterfaceIndex,AddressFamily | Select-Object InterfaceIndex,AddressFamily,ServerAddresses | ConvertTo-Json -Depth 5 -Compress
          $beforeTasks=@(Get-ScheduledTask -ErrorAction Stop | Where-Object {$_.TaskName -match '^(?i:VOLVE[-_])'}).Count
          $probe=(Resolve-Path '../../development/0.28.7/release-materials/catalogci/real_dns_probe_windows_test.go.txt').Path
          Copy-Item -LiteralPath $probe -Destination './ci_real_hagezi_full_windows_test.go' -ErrorAction Stop
          $env:VOLVE_CI_HAGEZI_FULL_SOURCE=$source
          $events=@(go test . -run '^TestOfficialPinnedHaGeZiFullLoadedByActualDNSMotorOnLoopback$' -count=1 -timeout 6m -json)
          if($LASTEXITCODE -ne 0){
            $events | Select-Object -Last 75 | Write-Host
            throw 'Actual pinned HaGeZi full catalog did not load/block in production DNS parser'
          }
          $parsed=@($events | Where-Object {$_ -match '^\s*\{'} | ForEach-Object {$_ | ConvertFrom-Json})
          $passed=@($parsed | Where-Object {$_.Action -eq 'pass' -and $_.Test -eq 'TestOfficialPinnedHaGeZiFullLoadedByActualDNSMotorOnLoopback'})
          $skipped=@($parsed | Where-Object {$_.Action -eq 'skip' -and $_.Test -eq 'TestOfficialPinnedHaGeZiFullLoadedByActualDNSMotorOnLoopback'})
          if($passed.Count -ne 1 -or $skipped.Count -ne 0){throw 'Live loopback test skipped or absent'}
          $afterDns=Get-DnsClientServerAddress -ErrorAction Stop | Sort-Object InterfaceIndex,AddressFamily | Select-Object InterfaceIndex,AddressFamily,ServerAddresses | ConvertTo-Json -Depth 5 -Compress
          $afterTasks=@(Get-ScheduledTask -ErrorAction Stop | Where-Object {$_.TaskName -match '^(?i:VOLVE[-_])'}).Count
          if($beforeDns -cne $afterDns -or $beforeTasks -ne $afterTasks){throw 'Loopback DNS test modified host DNS or scheduled tasks'}
          Write-Host 'PASS VOLVE_REAL_PINNED_HAGEZI_FULL_PRODUCTION_PARSER_WINDOWS_LOOPBACK_UDP NO_PORT53 NO_DNS_CHANGE NO_TASKS NO_INSTALL NO_RELEASE'
