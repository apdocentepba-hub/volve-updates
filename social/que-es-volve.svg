 <text x="76" y="397" fill="url(#highlight)" font-weight="bold" font-size="72">¿QUÉ ES VOLVÉ?</text>
 <text x="76" y="476" fill="#FFFFFF" font-weight="bold" font-size="39">Un programa en desarrollo para</text>
